<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Northing</title>
<style>

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #0c0d11;
}

/* The scene — full viewport, illustration as background */
#scene {
  position: fixed;
  inset: 0;
  background-image: url(images/001-ridge-overlook.png);
  background-size: 220% auto;
  background-position: 0% 42%;
  background-repeat: no-repeat;
  opacity: 0;
  will-change: background-position, opacity, filter;
}

/* Vignette — softens edges, deepens atmosphere */
#vignette {
  position: fixed;
  inset: 0;
  background: radial-gradient(
    ellipse 80% 70% at 50% 50%,
    transparent 30%,
    rgba(12, 13, 17, 0.35) 60%,
    rgba(12, 13, 17, 0.72) 85%,
    rgba(12, 13, 17, 0.92) 100%
  );
  z-index: 2;
  pointer-events: none;
}

/* Dark overlay — opens and closes the experience */
#dark {
  position: fixed;
  inset: 0;
  background: #0c0d11;
  z-index: 10;
  opacity: 1;
}

/* Mark — minimal identity, appears only at opening */
#mark {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 11;
  opacity: 0;
  pointer-events: none;
}

#mark img {
  display: block;
  width: min(200px, 48vw);
  height: auto;
  opacity: 0.85;
}

/* Observation fragment — appears mid-traversal */
#fragment {
  position: fixed;
  bottom: 13vh;
  left: 50%;
  transform: translateX(-50%);
  z-index: 5;
  opacity: 0;
  text-align: center;
  pointer-events: none;
  white-space: nowrap;
}

#fragment span {
  font-family: Georgia, 'Times New Roman', serif;
  font-style: italic;
  font-size: clamp(0.78rem, 1.5vw, 0.96rem);
  color: rgba(220, 216, 208, 0.70);
  letter-spacing: 0.04em;
}

</style>
</head>
<body>

<div id="scene"></div>
<div id="vignette"></div>
<div id="dark"></div>

<div id="mark">
  <img src="images/northing-logo-v1.png" alt="">
</div>

<div id="fragment">
  <span>The valley was absent.</span>
</div>

<script>
(function () {

  // ─── Elements ───────────────────────────────────────────────────────────────
  const scene    = document.getElementById('scene');
  const dark     = document.getElementById('dark');
  const mark     = document.getElementById('mark');
  const fragment = document.getElementById('fragment');

  // ─── Timeline (milliseconds) ─────────────────────────────────────────────────
  // Total duration: ~86 seconds
  const T = {
    markFadeIn  :  1200,   // mark begins appearing
    markHold    :  3500,   // mark at full opacity
    markFadeOut :  5800,   // mark fully dissolved
    sceneFadeIn :  7200,   // scene begins emerging through dark
    darkCleared :  9600,   // dark overlay fully open
    travStart   :  9600,   // horizontal movement begins
    travEnd     : 76600,   // horizontal movement ends  (67 s traversal)
    fragIn      : 43000,   // fragment begins appearing (~33 s into traversal)
    fragHold    : 46500,   // fragment at full opacity
    fragFadeOut : 59000,   // fragment begins dissolving
    fragGone    : 62000,   // fragment fully gone
    darkReturn  : 73000,   // closing dark begins returning
    end         : 86000,   // experience complete
  };

  // ─── Helpers ─────────────────────────────────────────────────────────────────

  // Map elapsed time t into [0,1] between keyframe a and b
  function prog(t, a, b) {
    if (t <= a) return 0;
    if (t >= b) return 1;
    return (t - a) / (b - a);
  }

  // Cubic ease-in-out
  function ease(t) {
    return t < 0.5
      ? 4 * t * t * t
      : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }

  // Linear interpolation
  function lerp(a, b, t) {
    return a + (b - a) * t;
  }

  // ─── Animation loop ──────────────────────────────────────────────────────────
  let start = null;

  function frame(timestamp) {
    if (!start) start = timestamp;
    const elapsed = timestamp - start;

    // ── Mark (logo) ────────────────────────────────────────────────────────────
    // Fade in → hold → fade out
    let markOpacity = 0;
    if (elapsed < T.markFadeIn) {
      markOpacity = 0;
    } else if (elapsed < T.markHold) {
      markOpacity = ease(prog(elapsed, T.markFadeIn, T.markHold));
    } else if (elapsed < T.markFadeOut) {
      markOpacity = 1 - ease(prog(elapsed, T.markHold, T.markFadeOut));
    } else {
      markOpacity = 0;
    }
    mark.style.opacity = markOpacity;

    // ── Dark overlay ───────────────────────────────────────────────────────────
    let darkOpacity = 1;
    if (elapsed < T.sceneFadeIn) {
      darkOpacity = 1;
    } else if (elapsed < T.darkCleared) {
      // Open: dark fades away as scene emerges
      darkOpacity = 1 - ease(prog(elapsed, T.sceneFadeIn, T.darkCleared));
    } else if (elapsed < T.darkReturn) {
      darkOpacity = 0;
    } else if (elapsed < T.end) {
      // Close: dark returns
      darkOpacity = ease(prog(elapsed, T.darkReturn, T.end));
    } else {
      darkOpacity = 1;
    }
    dark.style.opacity = darkOpacity;

    // ── Scene opacity ──────────────────────────────────────────────────────────
    // Scene fades in with the opening dark, lingers until closing dark covers it
    let sceneOpacity = 0;
    if (elapsed < T.sceneFadeIn) {
      sceneOpacity = 0;
    } else if (elapsed < T.darkCleared) {
      sceneOpacity = ease(prog(elapsed, T.sceneFadeIn, T.darkCleared));
    } else {
      sceneOpacity = 1;
    }
    scene.style.opacity = sceneOpacity;

    // ── Horizontal traversal ───────────────────────────────────────────────────
    // background-position-x: 0% → 100% over 67 seconds
    // Slight ease-in over first 6% of traversal, then linear
    let bgX = 0;
    if (elapsed >= T.travStart && elapsed <= T.travEnd) {
      let trav = prog(elapsed, T.travStart, T.travEnd);
      let p;
      if (trav < 0.06) {
        // Ease in over the first 6%
        p = ease(trav / 0.06) * 0.06;
      } else {
        p = trav;
      }
      bgX = p * 100;
    } else if (elapsed > T.travEnd) {
      bgX = 100;
    }
    scene.style.backgroundPositionX = bgX + '%';

    // ── Atmospheric breathing ──────────────────────────────────────────────────
    // Barely perceptible light oscillation: ±2.5%, 28-second period
    // Only active while scene is visible
    let brightness = 1.0;
    if (elapsed > T.darkCleared && elapsed < T.darkReturn) {
      brightness = 0.975 + Math.sin((elapsed / 28000) * Math.PI * 2) * 0.025;
    }
    scene.style.filter = 'brightness(' + brightness + ')';

    // ── Observation fragment ───────────────────────────────────────────────────
    let fragOpacity = 0;
    if (elapsed < T.fragIn) {
      fragOpacity = 0;
    } else if (elapsed < T.fragHold) {
      fragOpacity = ease(prog(elapsed, T.fragIn, T.fragHold));
    } else if (elapsed < T.fragFadeOut) {
      fragOpacity = 1;
    } else if (elapsed < T.fragGone) {
      fragOpacity = 1 - ease(prog(elapsed, T.fragFadeOut, T.fragGone));
    } else {
      fragOpacity = 0;
    }
    fragment.style.opacity = fragOpacity;

    // ── Continue or stop ───────────────────────────────────────────────────────
    if (elapsed < T.end) {
      requestAnimationFrame(frame);
    }
    // After T.end: dark is fully opaque, experience is complete. Nothing more happens.
  }

  // Begin
  requestAnimationFrame(frame);

})();
</script>

</body>
</html>
