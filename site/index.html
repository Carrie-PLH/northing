<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Northing | A documentary about a place that doesn't exist.</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #000;
  cursor: none;
}
canvas {
  display: block;
  position: fixed;
  top: 0; left: 0;
}
#fragment {
  position: fixed;
  bottom: 17%;
  left: 50%;
  transform: translateX(-50%);
  font-family: Georgia, 'Times New Roman', serif;
  font-size: clamp(11px, 1.6vw, 15px);
  font-style: italic;
  letter-spacing: 0.09em;
  color: rgba(212, 200, 178, 0);
  text-align: center;
  pointer-events: none;
  white-space: nowrap;
  z-index: 10;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="fragment"></div>
<script>
// ─────────────────────────────────────────────────────────────────────────────
// NORTHING — Angle 1: 0-90° 
// Clockwise from true north, i.e. facing roughly northwest.
// ─────────────────────────────────────────────────────────────────────────────

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const fragEl = document.getElementById('fragment');

let W = canvas.width  = window.innerWidth;
let H = canvas.height = window.innerHeight;
window.addEventListener('resize', () => {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
});

// ── World ────────────────────────────────────────────────────────────────────
const WORLD = 11000;   // total virtual width
let scrollX  = 0;      // current camera position
let targetX  = 0;      // easing target

function prog() { return scrollX / (WORLD - W); }

// ── Math ─────────────────────────────────────────────────────────────────────
const lerp      = (a, b, t) => a + (b - a) * t;
const clamp     = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;
const smooth    = t => t * t * (3 - 2 * t);
// fade in from lo→hi
const fadeIn    = (lo, hi, t) => smooth(clamp((t - lo) / (hi - lo), 0, 1));
// fade out from lo→hi  (1 before lo, 0 after hi)
const fadeOut   = (lo, hi, t) => 1 - fadeIn(lo, hi, t);
// window: full at mid, fading at edges
const window01  = (lo, peak0, peak1, hi, t) => Math.min(fadeIn(lo, peak0, t), fadeOut(peak1, hi, t));

// Seeded deterministic pseudo-random
function rand(seed) {
  const x = Math.sin(seed * 9301 + 49297) * 233280;
  return x - Math.floor(x);
}

// ── Scene progression markers (as progress 0–1) ───────────────────────────
//   0.00 – 0.05   opening dark
//   0.05 – 0.32   forest approach
//   0.32 – 0.50   ridge transition (thinning, opening)
//   0.50 – 0.66   ridge overlook
//   0.66 – 0.82   forest descent
//   0.82 – 0.93   orchard edge
//   0.93 – 1.00   closing dark

// ── Text fragments ───────────────────────────────────────────────────────────
const FRAGS = [
  { at: 0.29, text: 'The valley hums.', done: false },
  { at: 0.51, text: 'Scents arrive before the clearing.', done: false },
  { at: 0.84, text: 'Not at a line but as a progression.', done: false },
];

let fragPhase = 'idle';   // 'in' | 'hold' | 'out' | 'idle'
let fragStart = 0;

function triggerFrag(text) {
  fragEl.textContent = text;
  fragPhase = 'in';
  fragStart = performance.now();
}

function tickFrag(now) {
  if (fragPhase === 'idle') return;
  const el = now - fragStart;
  if (fragPhase === 'in') {
    const a = Math.min(el / 1500, 1);
    fragEl.style.color = `rgba(212,200,178,${smooth(a) * 0.80})`;
    if (a >= 1) { fragPhase = 'hold'; fragStart = now; }
  } else if (fragPhase === 'hold') {
    if (el > 3000) { fragPhase = 'out'; fragStart = now; }
  } else {
    const a = Math.max(1 - el / 1800, 0);
    fragEl.style.color = `rgba(212,200,178,${smooth(a) * 0.80})`;
    if (a <= 0) { fragPhase = 'idle'; }
  }
}

function checkFrags(p) {
  FRAGS.forEach(f => {
    if (!f.done && p >= f.at && p < f.at + 0.14) {
      f.done = true;
      triggerFrag(f.text);
    }
  });
}

// ── Tree data (generated once, stable) ───────────────────────────────────────
// Each tree: { wx, layer 0–3, h(raction), w(fraction), kind }
// Layers: 0 = far/background, 3 = near/foreground

const TREES = [];

(function buildTrees() {
  // Forest approach — dense, enc
  for (let i = 0; i < 280; i++) {
    const wx    = 500  + rand(i * 7 + 1) * 2700;
    const layer = Math.floor(rand(i * 3 + 2) * 4);
    TREES.push({ wx, layer,
      h: 0.28 + rand(i*11+3)*0.42 + layer*0.09,
      w: 0.022 + rand(i*17+4)*0.020,
      kind: rand(i*5+5) > 0.92 ? 'dead' : 'conifer' });
  }

  // Ridge transition — thinning, some dead
  for (let i = 400; i < 460; i++) {
    const wx    = 3200 + rand(i * 7) * 1600;
    const layer = Math.floor(rand(i * 3) * 3);
    TREES.push({ wx, layer,
      h: 0.18 + rand(i*11)*0.28 + layer*0.07,
      w: 0.016 + rand(i*17)*0.012,
      kind: rand(i*5) > 0.55 ? 'dead' : 'conifer' });
  }

  // Ridge — sparse scrub only
  for (let i = 500; i < 545; i++) {
    const wx    = 4800 + rand(i * 7) * 1600;
    const layer = Math.floor(rand(i * 3) * 2);
    TREES.push({ wx, layer,
      h: 0.05 + rand(i*11)*0.11,
      w: 0.016 + rand(i*17)*0.010,
      kind: 'shrub' });
  }

  // Forest descent — re-densifying
  for (let i = 600; i < 850; i++) {
    const wx    = 6400 + rand(i * 7) * 1600;
    const layer = Math.floor(rand(i * 3) * 4);
    TREES.push({ wx, layer,
      h: 0.26 + rand(i*11)*0.44 + layer*0.09,
      w: 0.020 + rand(i*17)*0.018,
      kind: 'conifer' });
  }

  // Orchard edge — regular spacing, two rows
  for (let i = 0; i < 26; i++) {
    [1, 2].forEach(row => {
      TREES.push({
        wx:    8100 + i * 165 + rand(i*100+row)*35 - 17,
        layer: row,
        h:     0.13 + rand(i*13+row)*0.09,
        w:     0.032 + rand(i*19+row)*0.014,
        kind:  'orchard'
      });
    });
  }

  // Sort far-to-near so farther trees paint first
  TREES.sort((a, b) => a.layer - b.layer);
})();

// ── Terrain height ────────────────────────────────────────────────────────────
function groundY(wx) {
  const base = H * 0.725;
  const undulation = Math.sin(wx * 0.0016) * 16
                   + Math.sin(wx * 0.0040 + 1.2) * 9
                   + Math.sin(wx * 0.00085 + 2.5) * 24;
  // Ridge: ground rises at ~worldX 5400
  const dist = Math.abs(wx - 5400);
  const lift  = Math.pow(Math.max(0, 1 - dist / 2500), 2.0) * 95;
  return base + undulation - lift;
}

// ── Draw: sky ────────────────────────────────────────────────────────────────
function drawSky(p) {
  // Forest = dark grey-green tones; ridge = cool overcast grey-blue
  const rf = window01(0.38, 0.52, 0.64, 0.80, p);

  const topR = lerp(18,  112, rf),  topG = lerp(22,  126, rf),  topB = lerp(18,  138, rf);
  const botR = lerp(42,  158, rf),  botG = lerp(48,  166, rf),  botB = lerp(38,  172, rf);

  const g = ctx.createLinearGradient(0, 0, 0, H * 0.74);
  g.addColorStop(0, `rgb(${topR|0},${topG|0},${topB|0})`);
  g.addColorStop(1, `rgb(${botR|0},${botG|0},${botB|0})`);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

// ── Draw: distant hill layers (ridge section) ─────────────────────────────────
function drawHills(p) {
  const vis = window01(0.38, 0.52, 0.64, 0.80, p);
  if (vis < 0.004) return;

  // Three layers: far, mid, near — each with progressively faster parallax
  [
    { pf: 0.05, baseY: 0.50, amp: 58, freq: 0.00042, col: [96,  108, 118] },
    { pf: 0.09, baseY: 0.57, amp: 36, freq: 0.00071, col: [74,   85,  94] },
    { pf: 0.14, baseY: 0.62, amp: 22, freq: 0.00112, col: [55,   65,  72] },
  ].forEach(({ pf, baseY, amp, freq, col }) => {
    const off = scrollX * pf;
    ctx.fillStyle = `rgba(${col[0]},${col[1]},${col[2]},${vis * 0.90})`;
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let x = -8; x <= W + 8; x += 5) {
      const wx = x + off;
      const y  = H * baseY
               + Math.sin(wx * freq)          * amp
               + Math.sin(wx * freq * 2.2 + 1.3) * amp * 0.38
               + Math.sin(wx * freq * 0.45 + 2.8) * amp * 0.65;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fill();
  });
}

// ── Draw: distant shelter on ridge ───────────────────────────────────────────
function drawShelter(p) {
  const vis = window01(0.50, 0.57, 0.62, 0.70, p);
  if (vis < 0.01) return;

  // Shelter is set in the distant hill — extremely slow parallax
  // Tuned so it appears right-of-centre during the ridge window
  const sx = 980 - scrollX * 0.085;
  if (sx < -60 || sx > W + 60) return;

  // Y sits on the nearest hill surface at sx
  const hillOff = scrollX * 0.14;
  const hillWx  = sx + hillOff;
  const shelterY = H * 0.62
                 + Math.sin(hillWx * 0.00112) * 22
                 + Math.sin(hillWx * 0.00246 + 1.3) * 8.4;

  const sw = 30, sh = 18;
  ctx.globalAlpha = vis * 0.62;
  ctx.fillStyle = '#1a1814';
  ctx.fillRect(sx - sw / 2, shelterY - sh, sw, sh);
  // Roof pitch
  ctx.beginPath();
  ctx.moveTo(sx - sw / 2 - 5, shelterY - sh);
  ctx.lineTo(sx,               shelterY - sh - 10);
  ctx.lineTo(sx + sw / 2 + 5, shelterY - sh);
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = 1;
}

// ── Draw: ground ─────────────────────────────────────────────────────────────
function drawGround(p) {
  const rf = window01(0.38, 0.52, 0.64, 0.80, p);

  // Colour: dark forest floor → rocky ridge grey
  const tR = lerp(38, 96,  rf), tG = lerp(43, 100, rf), tB = lerp(32, 92, rf);
  const bR = lerp(16, 52,  rf), bG = lerp(19, 56,  rf), bB = lerp(12, 48, rf);

  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 4) ctx.lineTo(x, groundY(x + scrollX));
  ctx.lineTo(W, H);
  ctx.closePath();

  const midGY = groundY(scrollX + W / 2);
  const g = ctx.createLinearGradient(0, midGY, 0, H);
  g.addColorStop(0, `rgb(${tR|0},${tG|0},${tB|0})`);
  g.addColorStop(1, `rgb(${bR|0},${bG|0},${bB|0})`);
  ctx.fillStyle = g;
  ctx.fill();
}

// ── Draw: stone suggestion at orchard boundary ────────────────────────────────
function drawOrchardBoundary(p) {
  const vis = window01(0.82, 0.87, 0.92, 0.97, p);
  if (vis < 0.01) return;

  const wallWx = 8620;
  const sx = wallWx - scrollX;
  if (sx < -250 || sx > W + 250) return;

  const gy = groundY(wallWx);
  ctx.globalAlpha = vis * 0.48;
  ctx.fillStyle = '#585048';
  for (let i = 0; i < 16; i++) {
    const bx  = sx - 130 + i * 17 + rand(i * 7) * 7;
    const bw  = 12 + rand(i * 3) * 7;
    const bh  =  5 + rand(i * 5) * 4;
    const by  = gy - bh - rand(i * 11) * 4;
    ctx.fillRect(bx, by, bw, bh);
  }
  ctx.globalAlpha = 1;
}

// ── Draw: a single tree ────────────────────────────────────────────────────────
function drawOneTree(tree) {
  const sx = tree.wx - scrollX;
  if (sx < -350 || sx > W + 350) return;

  const gY   = groundY(tree.wx);
  const th   = tree.h * H;
  const tw   = tree.w * W;
  const dep  = tree.layer / 3;   // 0=far, 1=near

  if (tree.kind === 'conifer') {
    // Far trees = lighter, slightly bluer; near = darker
    const r = lerp(65, 22, dep) | 0;
    const g = lerp(74, 28, dep) | 0;
    const b = lerp(65, 20, dep) | 0;
    ctx.fillStyle = `rgb(${r},${g},${b})`;

    // Three stacked triangle tiers
    for (let lv = 0; lv < 3; lv++) {
      const lTop = gY - th + (th * 0.62 * lv / 3);
      const lBot = gY - (th * 0.10 * lv / 3);
      const lW   = tw * (1.08 - lv * 0.16);
      ctx.beginPath();
      ctx.moveTo(sx,          lTop);
      ctx.lineTo(sx - lW / 2, lBot);
      ctx.lineTo(sx + lW / 2, lBot);
      ctx.closePath();
      ctx.fill();
    }
    // Trunk
    ctx.fillStyle = `rgb(${(r*0.65)|0},${(g*0.55)|0},${(b*0.50)|0})`;
    ctx.fillRect(sx - tw * 0.07, gY - th * 0.17, tw * 0.14, th * 0.17);

  } else if (tree.kind === 'dead') {
    ctx.strokeStyle = `rgba(42,39,34,0.72)`;
    ctx.lineWidth   = Math.max(1, tw * 0.09);
    ctx.beginPath();
    ctx.moveTo(sx, gY);
    ctx.lineTo(sx, gY - th);
    ctx.stroke();
    ctx.lineWidth = Math.max(0.5, tw * 0.045);
    ctx.beginPath();
    ctx.moveTo(sx,            gY - th * 0.62);
    ctx.lineTo(sx - tw * 0.42, gY - th * 0.78);
    ctx.moveTo(sx,            gY - th * 0.74);
    ctx.lineTo(sx + tw * 0.38, gY - th * 0.88);
    ctx.stroke();

  } else if (tree.kind === 'shrub') {
    const r = lerp(62,48,dep)|0, g2 = lerp(70,56,dep)|0, b2 = lerp(54,42,dep)|0;
    ctx.fillStyle = `rgba(${r},${g2},${b2},0.82)`;
    ctx.beginPath();
    ctx.ellipse(sx, gY - th * 0.52, tw * 0.68, th * 0.52, 0, 0, Math.PI * 2);
    ctx.fill();

  } else if (tree.kind === 'orchard') {
    ctx.fillStyle = 'rgb(36,50,28)';
    ctx.fillRect(sx - 3, gY - th * 0.72, 6, th * 0.72);
    ctx.beginPath();
    ctx.ellipse(sx, gY - th * 0.76, tw * 0.46, th * 0.38, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ── Draw: canopy overhead (forest enclosure) ──────────────────────────────────
function drawCanopy(p) {
  const approach = window01(0.05, 0.12, 0.30, 0.44, p);
  const descent  = window01(0.66, 0.72, 0.82, 0.92, p);
  const ca = Math.max(approach, descent);
  if (ca < 0.004) return;

  // Top canopy darkening
  const tg = ctx.createLinearGradient(0, 0, 0, H * 0.68);
  tg.addColorStop(0,   `rgba(6,8,5,${ca * 0.90})`);
  tg.addColorStop(0.55,`rgba(10,13,8,${ca * 0.58})`);
  tg.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.fillStyle = tg;
  ctx.fillRect(0, 0, W, H * 0.68);

  // Forest floor mist
  const bg = ctx.createLinearGradient(0, H * 0.70, 0, H);
  bg.addColorStop(0, 'rgba(0,0,0,0)');
  bg.addColorStop(1, `rgba(4,6,3,${ca * 0.60})`);
  ctx.fillStyle = bg;
  ctx.fillRect(0, H * 0.70, W, H * 0.30);

  // Horizontal mist seam at ground level
  const mistY = H * 0.72;
  const mg = ctx.createLinearGradient(0, mistY - 45, 0, mistY + 35);
  mg.addColorStop(0,   'rgba(0,0,0,0)');
  mg.addColorStop(0.5, `rgba(65,76,55,${ca * 0.16})`);
  mg.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.fillStyle = mg;
  ctx.fillRect(0, mistY - 45, W, 80);
}

// ── Draw: open-air atmosphere at ridge ───────────────────────────────────────
function drawRidgeHaze(p) {
  const vis = window01(0.44, 0.54, 0.64, 0.76, p);
  if (vis < 0.004) return;
  const hg = ctx.createLinearGradient(0, H * 0.34, 0, H * 0.64);
  hg.addColorStop(0, 'rgba(0,0,0,0)');
  hg.addColorStop(1, `rgba(182,190,198,${vis * 0.22})`);
  ctx.fillStyle = hg;
  ctx.fillRect(0, H * 0.34, W, H * 0.30);
}

// ── Draw: vignette ────────────────────────────────────────────────────────────
function drawVignette() {
  const vg = ctx.createRadialGradient(W/2, H/2, H*0.16, W/2, H/2, H*0.90);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.50)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
}

// ── Draw: fade to/from dark ────────────────────────────────────────────────────
function drawDark(p) {
  const open  = fadeOut(0, 0.06, p);
  const close = fadeIn(0.92, 1.0, p);
  const d = Math.max(open, close);
  if (d < 0.003) return;
  ctx.fillStyle = `rgba(0,0,0,${d})`;
  ctx.fillRect(0, 0, W, H);
}

// ── Audio ─────────────────────────────────────────────────────────────────────
let ac, forestG, windG, audioLive = false;

function bootAudio() {
  if (audioLive) return;
  audioLive = true;
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    const master = ac.createGain();
    master.gain.value = 0.22;
    master.connect(ac.destination);

    // Noise buffer
    const sr  = ac.sampleRate;
    const len = sr * 8;
    const buf = ac.createBuffer(1, len, sr);
    const d   = buf.getChannelData(0);
    let prev  = 0;
    for (let i = 0; i < len; i++) {
      const w = Math.random() * 2 - 1;
      d[i] = (prev + 0.04 * w) / 1.04;
      prev = d[i];
      d[i] *= 3.2;
    }
    const noise = ac.createBufferSource();
    noise.buffer = buf;
    noise.loop   = true;

    // Forest channel: low-pass rumble
    forestG = ac.createGain(); forestG.gain.value = 0;
    const ff = ac.createBiquadFilter();
    ff.type = 'lowpass'; ff.frequency.value = 260; ff.Q.value = 1.4;
    noise.connect(ff); ff.connect(forestG); forestG.connect(master);

    // Wind channel: bandpass
    windG = ac.createGain(); windG.gain.value = 0;
    const wf = ac.createBiquadFilter();
    wf.type = 'bandpass'; wf.frequency.value = 680; wf.Q.value = 0.45;
    noise.connect(wf); wf.connect(windG); windG.connect(master);

    // Sub drone (very low, always present but quiet)
    const sub = ac.createOscillator();
    sub.type = 'sine'; sub.frequency.value = 44;
    const subG = ac.createGain(); subG.gain.value = 0.030;
    sub.connect(subG); subG.connect(master);
    sub.start();

    noise.start();
  } catch(e) {}
}

function tickAudio(p) {
  if (!ac || !forestG || !windG) return;
  const fa = window01(0.06, 0.14, 0.30, 0.44, p);
  const fd = window01(0.66, 0.72, 0.82, 0.92, p);
  const forest = Math.max(fa, fd) * 0.52;
  const wind   = window01(0.44, 0.55, 0.64, 0.78, p) * 0.38;
  const t = ac.currentTime;
  forestG.gain.setTargetAtTime(forest, t, 1.2);
  windG.gain.setTargetAtTime(wind,   t, 1.2);
}

// ── Input ────────────────────────────────────────────────────────────────────
function advance(delta) {
  bootAudio();
  targetX = clamp(targetX + delta, 0, WORLD - W);
}

window.addEventListener('wheel', e => {
  e.preventDefault();
  const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
  advance(d * 1.65);
}, { passive: false });

window.addEventListener('keydown', e => {
  const step = 65;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') advance(step);
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   advance(-step);
});

let tPrev = null;
window.addEventListener('touchstart', e => {
  tPrev = e.touches[0].clientX; bootAudio();
}, { passive: true });
window.addEventListener('touchmove', e => {
  e.preventDefault();
  if (tPrev !== null) {
    advance((tPrev - e.touches[0].clientX) * 2.4);
    tPrev = e.touches[0].clientX;
  }
}, { passive: false });
window.addEventListener('touchend', () => { tPrev = null; });

// ── Main render + loop ────────────────────────────────────────────────────────
function render(now) {
  scrollX = lerp(scrollX, targetX, 0.085);
  const p = clamp(scrollX / (WORLD - W), 0, 1);

  // — Sky
  drawSky(p);

  // — Distant hills + shelter (far background)
  drawHills(p);
  drawShelter(p);

  // — Far & mid trees (painted before ground so ground clips lower trunks)
  TREES.filter(t => t.layer <= 2).forEach(t => drawOneTree(t));

  // — Ground surface
  drawGround(p);
  drawOrchardBoundary(p);

  // — Near trees (above ground)
  TREES.filter(t => t.layer >= 3).forEach(t => drawOneTree(t));

  // — Ridge open-air haze
  drawRidgeHaze(p);

  // — Forest overhead canopy
  drawCanopy(p);

  // — Edge darkening
  drawVignette();

  // — Opening / closing dark
  drawDark(p);

  // — Text fragment
  checkFrags(p);
  tickFrag(now);

  // — Audio
  tickAudio(p);

  requestAnimationFrame(render);
}

requestAnimationFrame(render);
</script>
</body>
</html>
