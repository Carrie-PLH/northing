// ── S3: Ground height (local wx) ────────────────────────────────────────────
function s3GroundY(wx) {
  const base = H * 0.69;
  const undulation = Math.sin(wx * 0.0007) * 5
                   + Math.sin(wx * 0.0022 + 0.9) * 3.5
                   + Math.sin(wx * 0.0048 + 1.5) * 2
                   + Math.sin(wx * 0.00032 + 2.8) * 8;
  // Clearing zone: slightly depressed ground where root systems were removed
  const cl = S3_CLEARING;
  let clearingDip = 0;
  if (wx > cl.startWx && wx < cl.endWx) {
    const clT = (wx - cl.startWx) / (cl.endWx - cl.startWx);
    clearingDip = Math.sin(clT * Math.PI) * 5;
  }
  // General descent through scene
  const descent = Math.max(0, (wx - 1000) / 14000) * 18;
  // Hummock micro-terrain (less pronounced in clearing)
  const inClearing = (wx > cl.startWx && wx < cl.endWx) ? 0.4 : 1.0;
  const hummock = (Math.sin(wx * 0.016 + 0.5) * 2.0 + Math.sin(wx * 0.028 + 1.3) * 1.4) * inClearing;
  return base + undulation + clearingDip + descent + hummock;
}

// ── S3: Sky colors ──────────────────────────────────────────────────────────
function s3SkyColors() {
  const close = fadeIn(0.14, 0.50, p3);
  const reopen = fadeIn(0.65, 0.88, p3);
  const enclosed = Math.max(0, close - reopen * 0.7);
  return {
    topR: lerp(82, 52, enclosed), topG: lerp(86, 58, enclosed), topB: lerp(88, 56, enclosed),
    botR: lerp(110, 72, enclosed), botG: lerp(114, 78, enclosed), botB: lerp(108, 72, enclosed),
    horizon: H * 0.68
  };
}

// ── S3: Fog density query ───────────────────────────────────────────────────
function s3FogDensityAt(screenX, screenY, now) {
  let total = 0;
  S3_FOG.forEach(bank => {
    const drift = now * 0.001 * bank.speed;
    const fogCenterWx = bank.baseX + drift + Math.sin(now * 0.00016 + bank.phase) * 140;
    const wrappedWx = ((fogCenterWx % (S3_WORLD * 1.5)) + S3_WORLD * 1.5) % (S3_WORLD * 1.5) - S3_WORLD * 0.25;
    const fogCenterSx = wrappedWx - s3sx;
    const vy = bank.y + Math.sin(now * 0.00028 + bank.phase) * bank.vertical * 8;
    const dx = (screenX - fogCenterSx) / (bank.w * 0.5);
    const dy = (screenY - vy) / (bank.h * 0.5);
    const dist = dx * dx + dy * dy;
    if (dist < 1) total += bank.density * (1 - dist) * (1 - dist);
  });
  return Math.min(total, 0.50);
}

// ── S3: Wind strength ───────────────────────────────────────────────────────
function s3WindStr(now) {
  return Math.sin(now * 0.00035) * 0.4 + Math.sin(now * 0.0008) * 0.25 + 0.15;
}

// ── S3: Distant treeline ────────────────────────────────────────────────────
function s3DrawDistantTreeline(now) {
  // Visible briefly at entry and more at exit (reopening)
  const vis = Math.max(
    fadeOut(0.18, 0.36, p3) * fadeIn(0.03, 0.10, p3),
    window01(0.72, 0.80, 0.90, 0.96, p3) * 0.7
  );
  if (vis < 0.006) return;

  const off = s3sx * 0.035;
  S3_DISTANT.forEach(dt => {
    const sx = dt.wx - off;
    if (sx < -40 || sx > W + 40) return;
    const baseY = H * 0.46 + Math.sin((sx + off) * 0.00038) * 10;
    const th = dt.h * H;
    const fogA = s3FogDensityAt(sx, baseY, now);
    const alpha = vis * 0.30 * Math.max(1 - fogA * 3, 0.05) * sceneAlpha;
    if (alpha < 0.01) return;
    ctx.globalAlpha = alpha;

    if (dt.kind === 'dead') {
      ctx.strokeStyle = '#464440';
      ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(sx, baseY); ctx.lineTo(sx + 1, baseY - th); ctx.stroke();
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.moveTo(sx, baseY - th * 0.55);
      ctx.lineTo(sx + (rand(dt.wx) > 0.5 ? 5 : -5), baseY - th * 0.64);
      ctx.stroke();
    } else if (dt.kind === 'conifer') {
      const tw = dt.w * W * 0.6;
      ctx.fillStyle = '#323830';
      ctx.beginPath();
      ctx.moveTo(sx, baseY - th); ctx.lineTo(sx - tw * 0.5, baseY - th * 0.30); ctx.lineTo(sx + tw * 0.5, baseY - th * 0.30);
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(sx, baseY - th * 0.60); ctx.lineTo(sx - tw * 0.65, baseY - th * 0.05); ctx.lineTo(sx + tw * 0.65, baseY - th * 0.05);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#282c22'; ctx.fillRect(sx - 1, baseY - th * 0.08, 2, th * 0.08);
    } else {
      const tw = dt.w * W * 0.45;
      ctx.fillStyle = '#363e34';
      ctx.beginPath();
      ctx.moveTo(sx - tw, baseY - th * 0.32);
      ctx.quadraticCurveTo(sx - tw * 0.8, baseY - th * 0.90, sx, baseY - th);
      ctx.quadraticCurveTo(sx + tw * 0.8, baseY - th * 0.90, sx + tw, baseY - th * 0.32);
      ctx.quadraticCurveTo(sx + tw * 0.5, baseY - th * 0.22, sx, baseY - th * 0.25);
      ctx.quadraticCurveTo(sx - tw * 0.5, baseY - th * 0.22, sx - tw, baseY - th * 0.32);
      ctx.fill();
      ctx.fillStyle = '#282c24'; ctx.fillRect(sx - 1, baseY - th * 0.28, 2, th * 0.28);
    }
    ctx.globalAlpha = sceneAlpha;
  });

  // Distant horizon band
  ctx.fillStyle = `rgba(56,62,54,${vis * 0.22 * sceneAlpha})`;
  ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = -8; x <= W + 8; x += 6) {
    const wx = x + off;
    const y = H * 0.50 + Math.sin(wx * 0.00042) * 14 + Math.sin(wx * 0.0012 + 1.6) * 7;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
}

// ── S3: Fog ─────────────────────────────────────────────────────────────────
function s3DrawFog(now) {
  const fogPresence = window01(0.10, 0.22, 0.75, 0.88, p3);
  if (fogPresence < 0.005) return;
  S3_FOG.forEach(bank => {
    const drift = now * 0.001 * bank.speed;
    const fogCenterWx = bank.baseX + drift + Math.sin(now * 0.00016 + bank.phase) * 140;
    const wrappedWx = ((fogCenterWx % (S3_WORLD * 1.5)) + S3_WORLD * 1.5) % (S3_WORLD * 1.5) - S3_WORLD * 0.25;
    const sx = wrappedWx - s3sx;
    if (sx < -bank.w * 0.6 || sx > W + bank.w * 0.6) return;
    const vy = bank.y + Math.sin(now * 0.00028 + bank.phase) * bank.vertical * 8;
    const alpha = bank.density * fogPresence * sceneAlpha;
    const rg = ctx.createRadialGradient(sx, vy, 0, sx, vy, Math.max(bank.w, bank.h) * 0.5);
    rg.addColorStop(0,    `rgba(104,110,100,${alpha * 0.80})`);
    rg.addColorStop(0.35, `rgba(94,100,90,${alpha * 0.45})`);
    rg.addColorStop(0.65, `rgba(86,92,82,${alpha * 0.18})`);
    rg.addColorStop(1,    'rgba(78,84,74,0)');
    ctx.fillStyle = rg;
    ctx.beginPath();
    ctx.ellipse(sx, vy, bank.w * 0.5, bank.h * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();
  });
}

// ── S3: Water features ──────────────────────────────────────────────────────
function s3DrawWater(now) {
  const waterVis = fadeIn(0.12, 0.35, p3);
  if (waterVis < 0.004) return;
  const sa = sceneAlpha;

  S3_WATER.forEach(wf => {
    const sx = wf.wx - s3sx;

    if (wf.type === 'puddle') {
      if (sx < -wf.w || sx > W + wf.w) return;
      const gy = s3GroundY(wf.wx);
      const poolH = 3 + wf.depth * 9;
      const alpha = waterVis * wf.depth * 0.58 * sa;
      const rg = ctx.createLinearGradient(0, gy - 2, 0, gy + poolH);
      rg.addColorStop(0,   `rgba(56,64,74,${alpha * 0.40})`);
      rg.addColorStop(0.4, `rgba(44,54,68,${alpha * 0.68})`);
      rg.addColorStop(0.7, `rgba(40,50,64,${alpha * 0.70})`);
      rg.addColorStop(1,   `rgba(48,56,66,${alpha * 0.30})`);
      ctx.fillStyle = rg;
      ctx.beginPath(); ctx.ellipse(sx, gy, wf.w / 2, poolH, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = `rgba(88,98,108,${alpha * 0.12})`;
      ctx.beginPath();
      ctx.ellipse(sx + Math.sin(now * 0.00025 + wf.wx * 0.01) * 3, gy - poolH * 0.1, wf.w * 0.18, poolH * 0.22, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    else if (wf.type === 'ditch') {
      if (sx < -wf.w * 0.7 || sx > W + wf.w * 0.7) return;
      const ditchVis = window01(0.18, 0.26, 0.48, 0.58, p3);
      if (ditchVis < 0.01) return;
      const gy = s3GroundY(wf.wx);
      const cw = wf.channelWidth;
      const channelAlpha = ditchVis * 0.72 * sa;
      const cwg = ctx.createLinearGradient(0, gy - 5, 0, gy + 7);
      cwg.addColorStop(0,    `rgba(44,52,64,${channelAlpha * 0.28})`);
      cwg.addColorStop(0.25, `rgba(36,46,60,${channelAlpha * 0.72})`);
      cwg.addColorStop(0.55, `rgba(32,42,58,${channelAlpha * 0.76})`);
      cwg.addColorStop(0.8,  `rgba(34,44,60,${channelAlpha * 0.68})`);
      cwg.addColorStop(1,    `rgba(40,50,62,${channelAlpha * 0.28})`);
      ctx.fillStyle = cwg;

      ctx.beginPath();
      const channelLeft = sx - wf.w * 0.4;
      const channelRight = sx + wf.w * 0.4;
      ctx.moveTo(channelLeft, gy - cw * 0.35 + wf.angle * (channelLeft - sx));
      for (let x = channelLeft; x <= channelRight; x += 7) {
        const irr = Math.sin(x * 0.022 + 1.5) * 1.8 + Math.sin(x * 0.048) * 0.9;
        ctx.lineTo(x, gy - cw * 0.35 + wf.angle * (x - sx) + irr);
      }
      for (let x = channelRight; x >= channelLeft; x -= 7) {
        const irr = Math.sin(x * 0.022 + 2.9) * 1.8 + Math.sin(x * 0.046 + 0.6) * 0.9;
        ctx.lineTo(x, gy + cw * 0.55 + wf.angle * (x - sx) + irr);
      }
      ctx.closePath(); ctx.fill();

      // Bank edges - slightly darker, suggesting cut earth
      ctx.fillStyle = `rgba(52,48,38,${channelAlpha * 0.28})`;
      for (let x = channelLeft + 8; x < channelRight - 8; x += 12) {
        const yOff = wf.angle * (x - sx);
        ctx.fillRect(x, gy - cw * 0.35 + yOff - 2 + rand(x) * 1.5, 7, 2.5);
        ctx.fillRect(x + 2, gy + cw * 0.55 + yOff + rand(x + 88) * 1.5, 6, 2);
      }
    }

    else if (wf.type === 'saturated') {
      if (sx < -wf.w || sx > W + wf.w) return;
      const satVis = waterVis * wf.depth * 0.45 * sa;
      if (satVis < 0.01) return;
      const gy = s3GroundY(wf.wx);
      const sg = ctx.createRadialGradient(sx, gy, 0, sx, gy, wf.w * 0.5);
      sg.addColorStop(0,   `rgba(46,54,64,${satVis * 0.38})`);
      sg.addColorStop(0.4, `rgba(42,50,58,${satVis * 0.24})`);
      sg.addColorStop(0.7, `rgba(38,46,54,${satVis * 0.12})`);
      sg.addColorStop(1,   'rgba(34,42,50,0)');
      ctx.fillStyle = sg;
      ctx.fillRect(sx - wf.w * 0.5, gy - 5, wf.w, 12);
    }
  });
}

// ── S3: Stump Clearing — felled trees, open canopy ─────────────────────────
function s3DrawStumpClearing(now) {
  const cl = S3_CLEARING;
  const vis = window01(0.14, 0.22, 0.50, 0.60, p3);
  if (vis < 0.01) return;
  const sa = sceneAlpha;

  const clStartSx = cl.startWx - s3sx;
  const clEndSx = cl.endWx - s3sx;
  if (clEndSx < -100 || clStartSx > W + 100) return;

  // ─── 1. GROUND BRIGHTENING — sun reaches the floor where canopy was removed
  const clearingGrad = ctx.createLinearGradient(clStartSx, 0, clEndSx, 0);
  clearingGrad.addColorStop(0,    `rgba(120,115,95,0)`);
  clearingGrad.addColorStop(0.15, `rgba(120,115,95,${vis * 0.12 * sa})`);
  clearingGrad.addColorStop(0.5,  `rgba(128,122,100,${vis * 0.18 * sa})`);
  clearingGrad.addColorStop(0.85, `rgba(120,115,95,${vis * 0.12 * sa})`);
  clearingGrad.addColorStop(1,    `rgba(120,115,95,0)`);
  ctx.fillStyle = clearingGrad;
  const gTop = s3GroundY(cl.centerWx) - 10;
  ctx.fillRect(clStartSx, gTop, clEndSx - clStartSx, H - gTop);

  // ─── 2. SAWDUST / WOOD CHIP SCATTER on ground near stumps
  ctx.globalAlpha = vis * 0.30 * sa;
  cl.stumps.forEach((st, si) => {
    const sx = st.wx - s3sx;
    if (sx < -60 || sx > W + 60) return;
    const gy = s3GroundY(st.wx);
    // Scatter of pale wood chips around each stump
    for (let c2 = 0; c2 < 8; c2++) {
      const cx = sx + (rand(st.wx + c2 * 7) - 0.5) * st.diameter * 2.5;
      const cy = gy + rand(st.wx + c2 * 11) * 6 - 1;
      const cw = 2 + rand(st.wx + c2 * 13) * 4;
      const ch = 1 + rand(st.wx + c2 * 17) * 2;
      const pale = (165 + rand(st.wx + c2 * 19) * 35) | 0;
      ctx.fillStyle = `rgba(${pale},${pale - 15},${pale - 35},${vis * 0.25})`;
      ctx.fillRect(cx - cw / 2, cy, cw, ch);
    }
  });
  ctx.globalAlpha = sa;

  // ─── 3. STUMPS — cut faces with growth rings, bark sides
  cl.stumps.forEach((st, si) => {
    const sx = st.wx - s3sx;
    if (sx < -50 || sx > W + 50) return;
    const gy = s3GroundY(st.wx);
    const R = st.diameter / 2;
    const topY = gy - st.height;

    const fogOcc = s3FogDensityAt(sx, gy, now);
    const alpha = vis * (1 - fogOcc * 0.35) * sa;
    if (alpha < 0.01) return;

    ctx.save();
    ctx.globalAlpha = alpha;

    // Bark sides — dark, textured vertical faces
    const barkR = (52 + st.barkColor * 30) | 0;
    const barkG = (42 + st.barkColor * 20) | 0;
    const barkB = (32 + st.barkColor * 12) | 0;

    // Left bark face
    const barkGrad = ctx.createLinearGradient(sx - R, 0, sx + R, 0);
    barkGrad.addColorStop(0,   `rgb(${barkR - 12},${barkG - 8},${barkB - 6})`);
    barkGrad.addColorStop(0.3, `rgb(${barkR},${barkG},${barkB})`);
    barkGrad.addColorStop(0.7, `rgb(${barkR + 6},${barkG + 4},${barkB + 2})`);
    barkGrad.addColorStop(1,   `rgb(${barkR - 8},${barkG - 6},${barkB - 4})`);
    ctx.fillStyle = barkGrad;
    ctx.beginPath();
    ctx.moveTo(sx - R, topY + 2);
    ctx.lineTo(sx + R, topY + 2 + st.cutAngle * st.diameter);
    ctx.lineTo(sx + R + 1, gy + 2);
    ctx.lineTo(sx - R - 1, gy + 2);
    ctx.closePath();
    ctx.fill();

    // Bark texture lines — vertical fissures
    ctx.strokeStyle = `rgba(${barkR - 18},${barkG - 14},${barkB - 10},0.30)`;
    ctx.lineWidth = 0.8;
    for (let f = 0; f < 5; f++) {
      const fx = sx - R + (f + 0.5) * (st.diameter / 5) + (rand(st.wx + f * 3) - 0.5) * 3;
      ctx.beginPath();
      ctx.moveTo(fx, topY + 3 + rand(f * 7) * 2);
      ctx.lineTo(fx + (rand(f * 11) - 0.5) * 2, gy);
      ctx.stroke();
    }

    // Cut face — the top, exposed wood
    const cutTiltY = st.cutAngle * st.diameter;
    // Exposed wood is pale, yellowish
    const woodGrad = ctx.createRadialGradient(sx, topY + cutTiltY * 0.5, 0,
                                               sx, topY + cutTiltY * 0.5, R * 0.9);
    woodGrad.addColorStop(0,   `rgba(185,170,135,1)`);   // heartwood — pale
    woodGrad.addColorStop(0.3, `rgba(175,158,118,1)`);   // inner rings
    woodGrad.addColorStop(0.7, `rgba(155,138,100,1)`);    // outer rings
    woodGrad.addColorStop(0.9, `rgba(130,112,78,1)`);     // sapwood
    woodGrad.addColorStop(1,   `rgba(${barkR},${barkG},${barkB},1)`);  // bark edge
    ctx.fillStyle = woodGrad;
    ctx.beginPath();
    ctx.ellipse(sx, topY + cutTiltY * 0.5, R, R * 0.35 + Math.abs(cutTiltY) * 0.2,
                st.cutAngle * 0.3, 0, Math.PI * 2);
    ctx.fill();

    // Growth rings — concentric ellipses
    ctx.strokeStyle = `rgba(120,105,72,0.30)`;
    ctx.lineWidth = 0.6;
    for (let ring = 1; ring <= 4; ring++) {
      const rFrac = ring / 5;
      ctx.beginPath();
      ctx.ellipse(sx, topY + cutTiltY * 0.5, R * rFrac, (R * 0.35 + Math.abs(cutTiltY) * 0.2) * rFrac,
                  st.cutAngle * 0.3, 0, Math.PI * 2);
      ctx.stroke();
    }

    // Weathering stain on cut face — darker patches
    ctx.fillStyle = `rgba(90,78,55,0.15)`;
    ctx.beginPath();
    ctx.ellipse(sx + (rand(st.wx + 100) - 0.5) * R * 0.4,
                topY + cutTiltY * 0.5 + (rand(st.wx + 101) - 0.5) * R * 0.15,
                R * 0.3 + rand(st.wx + 102) * R * 0.2,
                R * 0.12 + rand(st.wx + 103) * R * 0.08,
                rand(st.wx + 104) * 0.5, 0, Math.PI * 2);
    ctx.fill();

    // Regrowth shoots — 1-2 small green sprigs on some stumps
    if (rand(st.wx + 200) > 0.4) {
      const shootX = sx + (rand(st.wx + 201) - 0.5) * R * 0.6;
      const shootBaseY = topY + cutTiltY * 0.3;
      const shootH = 8 + rand(st.wx + 202) * 14;
      const shootLean = (rand(st.wx + 203) - 0.5) * 4 + Math.sin(now * 0.0008 + st.wx) * 1.5;
      ctx.fillStyle = `rgba(52,68,38,0.55)`;
      ctx.beginPath();
      ctx.moveTo(shootX, shootBaseY);
      ctx.quadraticCurveTo(shootX + shootLean * 0.4, shootBaseY - shootH * 0.5,
                           shootX + shootLean, shootBaseY - shootH);
      ctx.lineTo(shootX + shootLean + 1, shootBaseY - shootH);
      ctx.quadraticCurveTo(shootX + shootLean * 0.4 + 1, shootBaseY - shootH * 0.5,
                           shootX + 1, shootBaseY);
      ctx.fill();
    }

    ctx.restore();
  });

  // ─── 4. FALLEN TRUNK — one felled tree lying on the ground
  const ft = cl.fallenTrunk;
  const ftSx = ft.wx - s3sx;
  if (ftSx > -ft.length && ftSx < W + ft.length) {
    const ftGy = s3GroundY(ft.wx);
    const ftVis = vis * sa;
    const fogOcc = s3FogDensityAt(ftSx, ftGy, now);
    const ftAlpha = ftVis * (1 - fogOcc * 0.35);

    if (ftAlpha > 0.01) {
      ctx.save();
      ctx.globalAlpha = ftAlpha;

      // Trunk lies along the ground at a slight angle
      const baseX = ftSx;
      const baseY = ftGy - ft.baseDiameter * 0.3;  // raised slightly off ground
      const tipX = ftSx + Math.cos(ft.angle) * ft.length;
      const tipY = s3GroundY(ft.wx + ft.length * 0.8) - ft.tipDiameter * 0.2;

      // Main trunk body — tapered
      const trunkGrad = ctx.createLinearGradient(baseX, 0, tipX, 0);
      trunkGrad.addColorStop(0,   'rgb(58,50,38)');
      trunkGrad.addColorStop(0.5, 'rgb(52,46,34)');
      trunkGrad.addColorStop(1,   'rgb(48,42,30)');
      ctx.fillStyle = trunkGrad;
      ctx.beginPath();
      const bR = ft.baseDiameter / 2;
      const tR = ft.tipDiameter / 2;
      ctx.moveTo(baseX, baseY - bR * 0.5);
      ctx.lineTo(tipX, tipY - tR * 0.5);
      ctx.lineTo(tipX, tipY + tR * 0.7);
      ctx.lineTo(baseX, baseY + bR * 0.7);
      ctx.closePath();
      ctx.fill();

      // Trunk top highlight
      ctx.fillStyle = 'rgba(72,64,48,0.25)';
      ctx.beginPath();
      ctx.moveTo(baseX, baseY - bR * 0.5);
      ctx.lineTo(tipX, tipY - tR * 0.5);
      ctx.lineTo(tipX, tipY - tR * 0.3);
      ctx.lineTo(baseX, baseY - bR * 0.3);
      ctx.closePath();
      ctx.fill();

      // Bark texture
      ctx.strokeStyle = 'rgba(38,32,24,0.22)';
      ctx.lineWidth = 0.7;
      for (let b = 0; b < 12; b++) {
        const t = rand(ft.wx + b * 7) * 0.85 + 0.05;
        const bx = baseX + (tipX - baseX) * t;
        const by = baseY + (tipY - baseY) * t;
        const localR = bR + (tR - bR) * t;
        ctx.beginPath();
        ctx.moveTo(bx, by - localR * 0.5 + rand(b * 3) * 2);
        ctx.lineTo(bx + (rand(b * 5) - 0.5) * 3, by + localR * 0.7 - rand(b * 7) * 2);
        ctx.stroke();
      }

      // Branch stubs — broken/cut limbs
      ft.branchStubs.forEach((br, bi) => {
        const bx = baseX + (tipX - baseX) * br.along;
        const by = baseY + (tipY - baseY) * br.along;
        const localR = bR + (tR - bR) * br.along;
        // Stub pointing up and slightly outward
        const stubEndX = bx + Math.cos(br.angle) * br.len;
        const stubEndY = by + Math.sin(br.angle) * br.len;
        const stubW = 2.5 + (1 - br.along) * 3;
        ctx.fillStyle = `rgba(55,48,36,${ftAlpha * 0.65})`;
        ctx.beginPath();
        ctx.moveTo(bx - stubW * 0.5, by - localR * 0.4);
        ctx.lineTo(stubEndX - 1, stubEndY);
        ctx.lineTo(stubEndX + 1, stubEndY);
        ctx.lineTo(bx + stubW * 0.5, by - localR * 0.4);
        ctx.closePath();
        ctx.fill();
        // Broken end — pale wood
        ctx.fillStyle = `rgba(155,140,105,${ftAlpha * 0.40})`;
        ctx.beginPath();
        ctx.arc(stubEndX, stubEndY, 1.5 + rand(bi * 3) * 1.5, 0, Math.PI * 2);
        ctx.fill();
      });

      // Cut end face at the base — where the saw cut it
      ctx.fillStyle = 'rgba(170,155,120,0.50)';
      ctx.beginPath();
      ctx.ellipse(baseX, baseY + bR * 0.1, bR * 0.55, bR * 0.8, 0.1, 0, Math.PI * 2);
      ctx.fill();
      // Rings on cut face
      ctx.strokeStyle = 'rgba(120,105,72,0.25)';
      ctx.lineWidth = 0.5;
      for (let r = 1; r <= 3; r++) {
        ctx.beginPath();
        ctx.ellipse(baseX, baseY + bR * 0.1, bR * 0.55 * r / 4, bR * 0.8 * r / 4, 0.1, 0, Math.PI * 2);
        ctx.stroke();
      }

      ctx.restore();
    }
  }

  // ─── 5. CLEARING EDGE REGROWTH — low grass and weeds in the opening
  ctx.globalAlpha = vis * 0.40 * sa;
  for (let g = 0; g < 18; g++) {
    const gwx = cl.startWx + 200 + rand(g * 7 + 800) * (cl.endWx - cl.startWx - 400);
    const gsx = gwx - s3sx;
    if (gsx < -30 || gsx > W + 30) continue;
    const gy = s3GroundY(gwx);
    const gh = 5 + rand(g * 11 + 800) * 12;   // shorter than forest understory
    const lean = (rand(g * 13 + 800) - 0.5) * 4 + Math.sin(now * 0.0007 + g * 1.1) * 2;
    // Slightly brighter green — more sun reaching the ground
    const gr = (48 + rand(g * 17 + 800) * 20) | 0;
    const gg = (62 + rand(g * 19 + 800) * 25) | 0;
    const gb = (32 + rand(g * 23 + 800) * 12) | 0;
    ctx.fillStyle = `rgba(${gr},${gg},${gb},${vis * 0.38})`;
    ctx.beginPath();
    ctx.moveTo(gsx, gy);
    ctx.quadraticCurveTo(gsx + lean * 0.4, gy - gh * 0.5, gsx + lean, gy - gh);
    ctx.lineTo(gsx + lean + 1, gy - gh);
    ctx.quadraticCurveTo(gsx + lean * 0.4 + 1, gy - gh * 0.5, gsx + 1, gy);
    ctx.fill();
  }
  ctx.globalAlpha = sa;
}

// ── S3: Single vegetation element ───────────────────────────────────────────
function s3DrawOneVeg(v, now) {
  const sx = v.wx - s3sx;
  if (sx < -300 || sx > W + 300) return;

  const gY = s3GroundY(v.wx);
  const vh = v.h * H, vw = v.w * W;
  const dep = Math.min(v.layer, 3) / 3;
  const wet = fadeIn(0.15, 0.50, p3);
  const windS = 0.5 + Math.sin(now * 0.00035 + v.windPhase) * 0.35;
  const windLean = Math.sin(now * 0.0007 + v.windPhase) * windS * 2.5
                 + Math.sin(now * 0.0017 + v.windPhase * 1.6) * windS * 1.2;

  if (v.kind === 'birch') {
    // White-barked trunk
    const barkR = lerp(165, 120, dep) | 0;
    const barkG = lerp(158, 112, dep) | 0;
    const barkB = lerp(148, 102, dep) | 0;
    ctx.strokeStyle = `rgb(${barkR},${barkG},${barkB})`;
    ctx.lineWidth = Math.max(1.5, vw * 0.04);
    ctx.beginPath(); ctx.moveTo(sx, gY); ctx.lineTo(sx + windLean * 0.06, gY - vh * 0.65); ctx.stroke();
    // Dark marks on bark
    ctx.strokeStyle = `rgba(${barkR - 60},${barkG - 55},${barkB - 50},0.30)`;
    ctx.lineWidth = 1;
    for (let m = 0; m < 3; m++) {
      const my = gY - vh * (0.15 + rand(v.wx + m * 7) * 0.40);
      const mx = sx + windLean * 0.03 * (my - gY) / (vh * 0.65);
      ctx.beginPath();
      ctx.moveTo(mx - 2, my); ctx.lineTo(mx + 2, my);
      ctx.stroke();
    }
    // Canopy
    const cr = lerp(52, 28, dep) | 0, cg = lerp(62, 36, dep) | 0, cb = lerp(44, 24, dep) | 0;
    ctx.fillStyle = `rgba(${cr},${cg},${cb},0.72)`;
    ctx.beginPath();
    ctx.ellipse(sx + windLean * 0.12, gY - vh * 0.78, vw * 0.48, vh * 0.28, 0, 0, Math.PI * 2);
    ctx.fill();

  } else if (v.kind === 'alder') {
    const r = lerp(38, 18, dep) | 0, g = lerp(46, 28, dep) | 0, b = lerp(32, 16, dep) | 0;
    ctx.strokeStyle = `rgb(${(r * 0.48) | 0},${(g * 0.40) | 0},${(b * 0.36) | 0})`;
    ctx.lineWidth = Math.max(1.5, vw * 0.06);
    ctx.beginPath(); ctx.moveTo(sx, gY); ctx.lineTo(sx + windLean * 0.08, gY - vh * 0.55); ctx.stroke();
    if (rand(v.wx * 5) > 0.4) {
      const leanDir = rand(v.wx * 9) > 0.5 ? 1 : -1;
      ctx.lineWidth = Math.max(1, vw * 0.035);
      ctx.beginPath();
      ctx.moveTo(sx, gY - vh * 0.25);
      ctx.quadraticCurveTo(sx + leanDir * vw * 0.14 + windLean * 0.15, gY - vh * 0.46, sx + leanDir * vw * 0.18 + windLean * 0.25, gY - vh * 0.65);
      ctx.stroke();
    }
    ctx.fillStyle = `rgba(${r},${g},${b},0.76)`;
    ctx.beginPath();
    ctx.ellipse(sx + windLean * 0.12, gY - vh * 0.70, vw * 0.40, vh * 0.30, 0, 0, Math.PI * 2);
    ctx.fill();

  } else if (v.kind === 'willow') {
    const r = lerp(42, 22, dep) | 0, g = lerp(52, 32, dep) | 0, b = lerp(34, 18, dep) | 0;
    ctx.strokeStyle = `rgb(${(r * 0.50) | 0},${(g * 0.42) | 0},${(b * 0.40) | 0})`;
    ctx.lineWidth = Math.max(1.5, vw * 0.055);
    const stems = 2 + Math.floor(rand(v.wx * 3) * 3);
    for (let s = 0; s < stems; s++) {
      const sLean = (rand(v.wx + s * 11) - 0.5) * vw * 0.35 + windLean * 0.25;
      ctx.beginPath();
      ctx.moveTo(sx + (s - stems / 2) * 3, gY);
      ctx.quadraticCurveTo(sx + sLean * 0.4, gY - vh * 0.5, sx + sLean, gY - vh * (0.65 + rand(v.wx + s) * 0.3));
      ctx.stroke();
    }
    ctx.fillStyle = `rgba(${r},${g},${b},0.72)`;
    ctx.beginPath();
    ctx.ellipse(sx + windLean * 0.18, gY - vh * 0.70, vw * 0.50, vh * 0.32, 0, 0, Math.PI * 2);
    ctx.fill();
    // Drooping fronds
    ctx.strokeStyle = `rgba(${r},${g + 5},${b},0.30)`;
    ctx.lineWidth = 0.6;
    for (let f = 0; f < 4; f++) {
      const fx = sx + (rand(v.wx + f * 17) - 0.5) * vw * 0.8 + windLean * 0.35;
      const fy = gY - vh * (0.50 + rand(v.wx + f * 3) * 0.20);
      ctx.beginPath(); ctx.moveTo(fx, fy);
      ctx.quadraticCurveTo(fx + windLean * 0.25 + (rand(f + v.wx) - 0.5) * 8, fy + vh * 0.16, fx + windLean * 0.4 + (rand(f * 3 + v.wx) - 0.5) * 5, fy + vh * 0.28);
      ctx.stroke();
    }

  } else if (v.kind === 'wet_grass' || v.kind === 'sedge') {
    const isSedge = v.kind === 'sedge';
    const r = lerp(isSedge ? 58 : 50, isSedge ? 38 : 34, wet) | 0;
    const g = lerp(isSedge ? 66 : 60, isSedge ? 46 : 44, wet) | 0;
    const b = lerp(isSedge ? 44 : 38, isSedge ? 30 : 26, wet) | 0;
    ctx.fillStyle = `rgba(${r},${g},${b},${isSedge ? 0.55 : 0.45})`;
    const blades = isSedge ? 8 : 6;
    for (let bl = 0; bl < blades; bl++) {
      const bx = sx - vw * 0.45 + bl * vw * (0.9 / blades);
      const lean = (rand(v.wx + bl * 5) - 0.5) * vw * 0.22 + windLean * (isSedge ? 1.0 : 0.7);
      const bladeH = vh * (0.6 + rand(v.wx + bl * 3) * 0.4);
      ctx.beginPath(); ctx.moveTo(bx, gY);
      ctx.quadraticCurveTo(bx + lean * 0.4, gY - bladeH * 0.5, bx + lean, gY - bladeH);
      ctx.lineTo(bx + lean + 0.8, gY - bladeH);
      ctx.quadraticCurveTo(bx + lean * 0.4 + 0.8, gY - bladeH * 0.5, bx + 0.8, gY);
      ctx.fill();
    }

  } else if (v.kind === 'wet_scrub') {
    const r = lerp(40, 24, dep) | 0, g = lerp(50, 34, dep) | 0, b = lerp(34, 20, dep) | 0;
    ctx.fillStyle = `rgba(${r},${g},${b},0.65)`;
    ctx.beginPath();
    ctx.ellipse(sx + windLean * 0.08, gY - vh * 0.46, vw * 0.48, vh * 0.48, 0, 0, Math.PI * 2);
    ctx.fill();

  } else if (v.kind === 'reeds') {
    const r = lerp(54, 38, wet) | 0, g = lerp(62, 46, wet) | 0, b = lerp(40, 28, wet) | 0;
    ctx.fillStyle = `rgba(${r},${g},${b},0.48)`;
    for (let bl = 0; bl < 6; bl++) {
      const bx = sx - vw * 0.3 + bl * vw * 0.12;
      const lean = (rand(v.wx + bl * 5) - 0.5) * vw * 0.15 + windLean * 0.9;
      const bladeH = vh * (0.7 + rand(v.wx + bl * 3) * 0.3);
      ctx.beginPath(); ctx.moveTo(bx, gY + 1);
      ctx.quadraticCurveTo(bx + lean * 0.3, gY - bladeH * 0.4, bx + lean, gY - bladeH);
      ctx.lineTo(bx + lean + 0.6, gY - bladeH);
      ctx.quadraticCurveTo(bx + lean * 0.3 + 0.6, gY - bladeH * 0.4, bx + 0.6, gY + 1);
      ctx.fill();
    }

  } else if (v.kind === 's3conifer') {
    const r = lerp(30, 14, dep) | 0, g = lerp(40, 22, dep) | 0, b = lerp(28, 14, dep) | 0;
    ctx.strokeStyle = `rgb(${(r * 0.38) | 0},${(g * 0.32) | 0},${(b * 0.28) | 0})`;
    ctx.lineWidth = Math.max(1.5, vw * 0.045);
    ctx.beginPath(); ctx.moveTo(sx, gY); ctx.lineTo(sx + windLean * 0.06, gY - vh); ctx.stroke();
    ctx.fillStyle = `rgba(${r},${g},${b},0.80)`;
    const tipX = sx + windLean * 0.10, tipY = gY - vh;
    const midY = gY - vh * 0.50, baseW = vw * 0.36, midW = vw * 0.44;
    ctx.beginPath();
    ctx.moveTo(tipX, tipY);
    ctx.lineTo(tipX - baseW * 0.55 + windLean * 0.04, midY);
    ctx.lineTo(tipX + baseW * 0.55 + windLean * 0.04, midY);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = `rgba(${r - 3 | 0},${g - 3 | 0},${b - 2 | 0},0.76)`;
    ctx.beginPath();
    ctx.moveTo(tipX, midY + vh * 0.05);
    ctx.lineTo(sx - midW * 0.65 + windLean * 0.03, gY - vh * 0.10);
    ctx.lineTo(sx + midW * 0.65 + windLean * 0.03, gY - vh * 0.10);
    ctx.closePath(); ctx.fill();

  } else if (v.kind === 'meadow_grass') {
    const r = lerp(68, 50, wet) | 0, g = lerp(74, 58, wet) | 0, b = lerp(56, 40, wet) | 0;
    ctx.fillStyle = `rgba(${r},${g},${b},0.50)`;
    for (let bl = 0; bl < 5; bl++) {
      const bx = sx - vw * 0.4 + bl * vw * 0.2;
      const lean = (rand(v.wx + bl * 7) - 0.5) * vw * 0.28 + windLean;
      ctx.beginPath();
      ctx.moveTo(bx, gY);
      ctx.quadraticCurveTo(bx + lean * 0.5, gY - vh * 0.6, bx + lean, gY - vh);
      ctx.quadraticCurveTo(bx + lean * 0.5 + 1.2, gY - vh * 0.6, bx + 1.5, gY);
      ctx.fill();
    }

  } else if (v.kind === 'fg_alder') {
    const fgAlpha = window01(0.12, 0.22, 0.72, 0.84, p3) * 0.70 * sceneAlpha;
    if (fgAlpha < 0.02) return;
    ctx.globalAlpha = fgAlpha;
    ctx.strokeStyle = 'rgb(16,20,12)';
    ctx.lineWidth = Math.max(3, vw * 0.10);
    ctx.beginPath();
    ctx.moveTo(sx, gY + 20);
    ctx.lineTo(sx + windLean * 0.08, gY - vh * 0.50);
    ctx.stroke();
    if (rand(v.wx * 5) > 0.3) {
      const ld = rand(v.wx * 9) > 0.5 ? 1 : -1;
      ctx.lineWidth = Math.max(2, vw * 0.05);
      ctx.beginPath();
      ctx.moveTo(sx, gY - vh * 0.20);
      ctx.quadraticCurveTo(sx + ld * vw * 0.2 + windLean * 0.15, gY - vh * 0.42, sx + ld * vw * 0.25 + windLean * 0.25, gY - vh * 0.60);
      ctx.stroke();
    }
    ctx.fillStyle = 'rgba(12,18,10,0.78)';
    ctx.beginPath();
    ctx.ellipse(sx + windLean * 0.25, gY - vh * 0.62, vw * 0.65, vh * 0.38, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = sceneAlpha;

  } else if (v.kind === 'fg_grass') {
    const fgAlpha = window01(0.12, 0.22, 0.72, 0.84, p3) * 0.60 * sceneAlpha;
    if (fgAlpha < 0.02) return;
    ctx.globalAlpha = fgAlpha;
    ctx.fillStyle = 'rgba(24,32,20,0.65)';
    for (let bl = 0; bl < 9; bl++) {
      const bx = sx - vw * 0.6 + bl * vw * 0.15;
      const lean = (rand(v.wx + bl * 7) - 0.5) * vw * 0.45 + windLean * 1.8;
      const bladeH = vh * (0.55 + rand(v.wx + bl * 3) * 0.45);
      ctx.beginPath(); ctx.moveTo(bx, gY + 30);
      ctx.quadraticCurveTo(bx + lean * 0.4, gY - bladeH * 0.4, bx + lean, gY - bladeH);
      ctx.lineTo(bx + lean + 2, gY - bladeH);
      ctx.quadraticCurveTo(bx + lean * 0.4 + 2, gY - bladeH * 0.4, bx + 2.5, gY + 30);
      ctx.fill();
    }
    ctx.globalAlpha = sceneAlpha;
  }
}

// ── S3: Overhead vegetation ─────────────────────────────────────────────────
function s3DrawOverheadVegetation(now) {
  // Heavier overhead than S2, especially early-mid
  const overhead = window01(0.12, 0.24, 0.62, 0.78, p3);
  if (overhead < 0.004) return;
  const sa = sceneAlpha;
  const baseAlpha = overhead * 0.62 * sa;

  const tg = ctx.createLinearGradient(0, 0, 0, H * 0.48);
  tg.addColorStop(0,   `rgba(12,16,10,${baseAlpha * 0.75})`);
  tg.addColorStop(0.4, `rgba(16,22,14,${baseAlpha * 0.38})`);
  tg.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.fillStyle = tg;
  ctx.fillRect(0, 0, W, H * 0.48);

  ctx.fillStyle = `rgba(10,14,8,${overhead * 0.45 * sa})`;
  const branchOffset = s3sx * 0.12;
  const ws = s3WindStr(now);
  for (let i = 0; i < 10; i++) {
    const bx = (i * W * 0.16 + rand(i * 7) * W * 0.10 - branchOffset * (0.7 + rand(i * 3) * 0.5)) % (W * 1.4) - W * 0.2;
    const by = H * (0.01 + rand(i * 11) * 0.10);
    const bw = W * (0.07 + rand(i * 13) * 0.14);
    const bh = H * (0.025 + rand(i * 17) * 0.055);
    ctx.beginPath();
    ctx.ellipse(bx + ws * 3, by, bw, bh, rand(i * 19) * 0.25, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ── S3: Side enclosure ──────────────────────────────────────────────────────
function s3DrawSideEnclosure() {
  // Tighter than S2, especially in the infrastructure zone
  const enclosure = window01(0.10, 0.22, 0.65, 0.80, p3);
  if (enclosure < 0.004) return;
  const sa = sceneAlpha;
  const infraBoost = window01(0.18, 0.28, 0.42, 0.52, p3) * 0.3;
  const totalEnc = Math.min(enclosure + infraBoost, 1);

  const leftStr = totalEnc * 1.2;
  const lg = ctx.createLinearGradient(0, 0, W * 0.24, 0);
  lg.addColorStop(0, `rgba(14,20,12,${Math.min(leftStr, 1) * 0.50 * sa})`);
  lg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = lg;
  ctx.fillRect(0, H * 0.12, W * 0.24, H * 0.72);

  const rightStr = totalEnc * 0.95;
  const rg = ctx.createLinearGradient(W, 0, W * 0.78, 0);
  rg.addColorStop(0, `rgba(14,20,12,${rightStr * 0.45 * sa})`);
  rg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = rg;
  ctx.fillRect(W * 0.78, H * 0.15, W * 0.22, H * 0.68);

  const bottomStr = window01(0.14, 0.26, 0.58, 0.72, p3);
  if (bottomStr > 0.01) {
    const bg = ctx.createLinearGradient(0, H, 0, H * 0.74);
    bg.addColorStop(0, `rgba(12,16,10,${bottomStr * 0.42 * sa})`);
    bg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = bg;
    ctx.fillRect(0, H * 0.74, W, H * 0.26);
  }
}

// ── S3: Atmosphere ──────────────────────────────────────────────────────────
function s3DrawAtmosphere() {
  const sa = sceneAlpha;
  const haze = window01(0.16, 0.30, 0.68, 0.82, p3);
  if (haze > 0.004) {
    const hg = ctx.createLinearGradient(0, H * 0.32, 0, H * 0.62);
    hg.addColorStop(0, 'rgba(0,0,0,0)');
    hg.addColorStop(0.5, `rgba(80,86,78,${haze * 0.09 * sa})`);
    hg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = hg;
    ctx.fillRect(0, H * 0.32, W, H * 0.30);
  }
  const groundMoist = fadeIn(0.18, 0.45, p3) * fadeOut(0.70, 0.86, p3);
  if (groundMoist > 0.004) {
    const mg = ctx.createLinearGradient(0, H * 0.62, 0, H * 0.74);
    mg.addColorStop(0, 'rgba(0,0,0,0)');
    mg.addColorStop(0.5, `rgba(72,78,70,${groundMoist * 0.14 * sa})`);
    mg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = mg;
    ctx.fillRect(0, H * 0.62, W, H * 0.12);
  }
}

// ── S3: Sky corridors ───────────────────────────────────────────────────────
function s3DrawSkyCorridors(now) {
  // Fewer, narrower sky gaps - more enclosed
  const vis = window01(0.28, 0.38, 0.56, 0.68, p3) * 0.28;
  if (vis < 0.008) return;
  const sa = sceneAlpha;
  const gaps = [{ wx: 3400, w: 70, h: 0.08 },{ wx: 6600, w: 100, h: 0.10 },{ wx: 10200, w: 130, h: 0.14 }];
  gaps.forEach(gap => {
    const sx = gap.wx - s3sx;
    if (sx < -gap.w || sx > W + gap.w) return;
    const fogAtten = 1 - s3FogDensityAt(sx, H * 0.28, now) * 2;
    const alpha = vis * Math.max(fogAtten, 0.1) * sa;
    const gg = ctx.createRadialGradient(sx, H * 0.26, 0, sx, H * 0.26, gap.w);
    gg.addColorStop(0,   `rgba(118,124,120,${alpha * 0.40})`);
    gg.addColorStop(0.5, `rgba(98,104,100,${alpha * 0.18})`);
    gg.addColorStop(1,   'rgba(0,0,0,0)');
    ctx.fillStyle = gg;
    ctx.fillRect(sx - gap.w, H * 0.08, gap.w * 2, H * gap.h + H * 0.18);
  });
}


// =============================================================================
// SCENE 4 — Reabsorption / Weather Veil / Return Toward Orientation
// =============================================================================

// ── S4: Vegetation data ─────────────────────────────────────────────────────
const S4_VEG = [];

(function buildS4Veg() {
  // Early section: sparse, irregular — residual clearing influence
  for (let i = 0; i < 60; i++) {
    const wx = 400 + rand(i * 7 + 1) * 3200;
    const layer = Math.floor(rand(i * 3 + 2) * 3);
    const kind = rand(i * 5 + 3);
    S4_VEG.push({ wx, layer,
      h: 0.08 + rand(i * 11 + 3) * 0.22 + layer * 0.05,
      w: 0.016 + rand(i * 17 + 4) * 0.022,
      kind: kind > 0.6 ? 's4conifer' : (kind > 0.3 ? 'birch' : 'scrub'),
      windPhase: rand(i * 23) * Math.PI * 2 });
  }
  // Mid section: weather zone — trees present but visibility-limited
  for (let i = 70; i < 190; i++) {
    const wx = 3000 + rand(i * 7) * 6000;
    const layer = Math.floor(rand(i * 3) * 4);
    const kind = rand(i * 5);
    S4_VEG.push({ wx, layer,
      h: 0.10 + rand(i * 11) * 0.30 + layer * 0.07,
      w: 0.015 + rand(i * 17) * 0.025,
      kind: kind > 0.55 ? 's4conifer' : (kind > 0.30 ? 'birch' : (kind > 0.15 ? 'alder' : 'wet_scrub')),
      windPhase: rand(i * 23) * Math.PI * 2 });
  }
  // Late section: forest returning, denser, layered
  for (let i = 200; i < 360; i++) {
    const wx = 8500 + rand(i * 7) * 5000;
    const layer = Math.floor(rand(i * 3) * 4);
    const kind = rand(i * 5);
    S4_VEG.push({ wx, layer,
      h: 0.12 + rand(i * 11) * 0.36 + layer * 0.08,
      w: 0.016 + rand(i * 17) * 0.026,
      kind: kind > 0.50 ? 's4conifer' : (kind > 0.25 ? 'birch' : 'alder'),
      windPhase: rand(i * 23) * Math.PI * 2 });
  }
  // Ground cover throughout
  for (let i = 370; i < 470; i++) {
    const wx = 600 + rand(i * 7) * 13000;
    const layer = Math.floor(rand(i * 3) * 2) + 1;
    S4_VEG.push({ wx, layer,
      h: 0.02 + rand(i * 11) * 0.05,
      w: 0.022 + rand(i * 17) * 0.030,
      kind: rand(i * 5) > 0.5 ? 'wet_grass' : 'meadow_grass',
      windPhase: rand(i * 23) * Math.PI * 2 });
  }
  // Foreground elements — softer than S3
  for (let i = 480; i < 520; i++) {
    const wx = 2000 + rand(i * 7) * 10500;
    S4_VEG.push({ wx, layer: 4,
      h: 0.16 + rand(i * 11) * 0.28,
      w: 0.030 + rand(i * 17) * 0.040,
      kind: rand(i * 5) > 0.6 ? 'fg_conifer' : 'fg_grass',
      windPhase: rand(i * 23) * Math.PI * 2 });
  }
  S4_VEG.sort((a, b) => a.layer - b.layer);
})();

// ── S4: Water features ──────────────────────────────────────────────────────
const S4_WATER = [];
(function buildS4Water() {
  for (let i = 0; i < 6; i++) {
    S4_WATER.push({ type: 'puddle', wx: 2000 + rand(i * 7) * 10000,
      w: 35 + rand(i * 11) * 70, depth: 0.15 + rand(i * 5) * 0.25 });
  }
  S4_WATER.push({ type: 'saturated', wx: 5500, w: 700, depth: 0.25 });
  S4_WATER.push({ type: 'saturated', wx: 9000, w: 400, depth: 0.18 });
})();

// ── S4: Fog banks ───────────────────────────────────────────────────────────
const S4_FOG = [];
(function buildS4Fog() {
  for (let i = 0; i < 22; i++) {
    S4_FOG.push({
      baseX: rand(i * 13 + 7) * S4_WORLD,
      y: H * (0.28 + rand(i * 7 + 3) * 0.40),

      h: H * (0.10 + rand(i * 5 + 1) * 0.25),
      density: 0.12 + rand(i * 9) * 0.22,

    });

})();

// ── S4: Weather streaks (vertical haze) ─────────────────────────────────────
const S4_STREAKS = [];
(function buildS4Streaks() {

    });

// ── S4: Distant treeline ────────────────────────────────────────────────────
const S4_DISTANT = [];
(function buildS4Distant() {
  for (let i = 0; i < 28; i++) {
    const r = rand(i * 5);
    S4_DISTANT.push({
      wx: 700 + i * 460 + (rand(i * 7) - 0.5) * 150,
      h: 0.05 + rand(i * 11) * 0.09,
      w: 0.007 + rand(i * 17) * 0.011,
      kind: r > 0.80 ? 'dead' : (r > 0.30 ? 'conifer' : 'deciduous')
    });
  }
})();

// ── S4: Ground height (local wx) ────────────────────────────────────────────
function s4GroundY(wx) {
  const base = H * 0.70;
  const undulation = Math.sin(wx * 0.0007) * 5
                   + Math.sin(wx * 0.0020 + 0.8) * 3
                   + Math.sin(wx * 0.0045 + 1.6) * 2
                   + Math.sin(wx * 0.00030 + 3.0) * 9;
  const rise = wx > 9000 ? -Math.pow((wx - 9000) / 5000, 1.5) * 12 : 0;
  const hummock = Math.sin(wx * 0.015 + 0.4) * 1.6 + Math.sin(wx * 0.026 + 1.0) * 1.0;
  return base + undulation + rise + hummock;
}

// ── S4: Sky colors ──────────────────────────────────────────────────────────
function s4SkyColors() {
  const weather = window01(0.20, 0.40, 0.65, 0.82, p4);
  const late = fadeIn(0.70, 0.90, p4);
  return {
    topR: lerp(lerp(72, 58, weather), 82, late),
    topG: lerp(lerp(76, 62, weather), 84, late),
    topB: lerp(lerp(78, 60, weather), 80, late),
    botR: lerp(lerp(98, 76, weather), 108, late),
    botG: lerp(lerp(100, 80, weather), 106, late),
    botB: lerp(lerp(96, 74, weather), 100, late),
    horizon: H * 0.69
  };
}

// ── S4: Fog density query ───────────────────────────────────────────────────
function s4FogDensityAt(screenX, screenY, now) {
  let total = 0;
  const pwSettle = s4pw * H * 0.08;
  const pwSurge = 1 + s4pw * 1.1;
  S4_FOG.forEach(bank => {
    const drift = now * 0.001 * bank.speed;
    const fogCenterWx = bank.baseX + drift + Math.sin(now * 0.00014 + bank.phase) * 120;
    const wrappedWx = ((fogCenterWx % (S4_WORLD * 1.5)) + S4_WORLD * 1.5) % (S4_WORLD * 1.5) - S4_WORLD * 0.25;
    const fogCenterSx = wrappedWx - s4sx;
    const vy = bank.y + Math.sin(now * 0.00025 + bank.phase) * bank.vertical * 8 + pwSettle;
    const expandH = bank.h * (1 + s4pw * 0.4);
    const dx = (screenX - fogCenterSx) / (bank.w * 0.5);
    const dy = (screenY - vy) / (expandH * 0.5);
    const dist = dx * dx + dy * dy;
    if (dist < 1) total += bank.density * pwSurge * (1 - dist) * (1 - dist);
  });
  return Math.min(total, 0.65);
}

// ── S4: Wind strength ───────────────────────────────────────────────────────
function s4WindStr(now) {
  return Math.sin(now * 0.00030) * 0.35 + Math.sin(now * 0.00072) * 0.20 + 0.12;
}

// ── S4: Perceptual weather ─────────────────────────────────────────────────
// Time-driven atmospheric modulation independent of scroll position.
// When high: depth cues collapse, tonal layers flatten, horizon vanishes.
// When low: full spatial legibility returns.
// Multiple incommensurate periods prevent rhythmic predictability.
function s4PerceptualWeather(now) {
  const a = Math.sin(now * 0.0000523 + 1.7) * 0.5 + 0.5;   // ~120s
  const b = Math.sin(now * 0.0000884 + 0.3) * 0.5 + 0.5;   // ~71s
  const c = Math.sin(now * 0.0000312 + 2.9) * 0.5 + 0.5;   // ~201s
  const d = Math.sin(now * 0.000148  + 0.8) * 0.5 + 0.5;    // ~42s
  // Weighted blend — more even weighting increases overlap probability
  const raw = a * 0.30 + b * 0.28 + c * 0.24 + d * 0.18;
  // Lower threshold: weather events begin sooner, occur more often
  return smooth(clamp((raw - 0.26) / 0.32, 0, 1));
}

// ── S4: Distant treeline ────────────────────────────────────────────────────
function s4DrawDistantTreeline(now) {
  const baseVis = Math.max(
    window01(0.04, 0.12, 0.22, 0.35, p4) * 0.4,
    window01(0.68, 0.78, 0.88, 0.95, p4) * 0.65
  );
  // Perceptual weather suppresses horizon — depth vanishes and returns
  const vis = baseVis * (1 - s4pw * 0.85);
  if (vis < 0.006) return;

  const off = s4sx * 0.035;
  S4_DISTANT.forEach(dt => {
    const sx = dt.wx - off;
    if (sx < -40 || sx > W + 40) return;
    const baseY = H * 0.47 + Math.sin((sx + off) * 0.00036) * 10;
    const th = dt.h * H;
    const fogA = s4FogDensityAt(sx, baseY, now);
    const alpha = vis * 0.28 * Math.max(1 - fogA * 3.5, 0.03) * sceneAlpha;
    if (alpha < 0.01) return;
    ctx.globalAlpha = alpha;

    if (dt.kind === 'dead') {
      ctx.strokeStyle = '#4a4842';
      ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(sx, baseY); ctx.lineTo(sx + 1, baseY - th); ctx.stroke();
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.moveTo(sx, baseY - th * 0.55);
      ctx.lineTo(sx + (rand(dt.wx) > 0.5 ? 5 : -5), baseY - th * 0.64);
      ctx.stroke();
    } else if (dt.kind === 'conifer') {
      const tw = dt.w * W * 0.6;
      ctx.fillStyle = '#343a32';
      ctx.beginPath();
      ctx.moveTo(sx, baseY - th); ctx.lineTo(sx - tw * 0.5, baseY - th * 0.30); ctx.lineTo(sx + tw * 0.5, baseY - th * 0.30);
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(sx, baseY - th * 0.62); ctx.lineTo(sx - tw * 0.65, baseY - th * 0.05); ctx.lineTo(sx + tw * 0.65, baseY - th * 0.05);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#2a2e24'; ctx.fillRect(sx - 1, baseY - th * 0.08, 2, th * 0.08);
    } else {
      const tw = dt.w * W * 0.45;
      ctx.fillStyle = '#383e36';
      ctx.beginPath();
      ctx.moveTo(sx - tw, baseY - th * 0.32);
      ctx.quadraticCurveTo(sx - tw * 0.8, baseY - th * 0.90, sx, baseY - th);
      ctx.quadraticCurveTo(sx + tw * 0.8, baseY - th * 0.90, sx + tw, baseY - th * 0.32);
      ctx.quadraticCurveTo(sx + tw * 0.5, baseY - th * 0.22, sx, baseY - th * 0.25);
      ctx.quadraticCurveTo(sx - tw * 0.5, baseY - th * 0.22, sx - tw, baseY - th * 0.32);
      ctx.fill();
      ctx.fillStyle = '#2a2e26'; ctx.fillRect(sx - 1, baseY - th * 0.28, 2, th * 0.28);
    }
    ctx.globalAlpha = sceneAlpha;
  });

  ctx.fillStyle = `rgba(58,64,56,${vis * 0.18 * sceneAlpha})`;
  ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = -8; x <= W + 8; x += 6) {
    const wx = x + off;
    const y = H * 0.51 + Math.sin(wx * 0.00040) * 12 + Math.sin(wx * 0.0012 + 1.5) * 6;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
}

// ── S4: Fog ─────────────────────────────────────────────────────────────────
function s4DrawFog(now) {
  const fogPresence = window01(0.08, 0.18, 0.82, 0.94, p4);
  if (fogPresence < 0.005) return;
  const weatherBoost = window01(0.25, 0.40, 0.60, 0.75, p4) * 0.4;
  // Perceptual weather surges fog density and settles banks lower
  const pwSurge = 1 + s4pw * 1.1;
  const pwSettle = s4pw * H * 0.08;
  S4_FOG.forEach(bank => {
    const drift = now * 0.001 * bank.speed;
    const fogCenterWx = bank.baseX + drift + Math.sin(now * 0.00014 + bank.phase) * 120;
    const wrappedWx = ((fogCenterWx % (S4_WORLD * 1.5)) + S4_WORLD * 1.5) % (S4_WORLD * 1.5) - S4_WORLD * 0.25;
    const sx = wrappedWx - s4sx;
    if (sx < -bank.w * 0.6 || sx > W + bank.w * 0.6) return;
    // Fog settles toward ground during heavy weather
    const vy = bank.y + Math.sin(now * 0.00025 + bank.phase) * bank.vertical * 8 + pwSettle;
    const alpha = bank.density * (fogPresence + weatherBoost) * pwSurge * sceneAlpha;
    // Banks expand vertically during heavy weather, compressing spatial legibility
    const expandH = bank.h * (1 + s4pw * 0.4);
    const rg = ctx.createRadialGradient(sx, vy, 0, sx, vy, Math.max(bank.w, expandH) * 0.5);
    rg.addColorStop(0,    `rgba(108,112,106,${alpha * 0.75})`);
    rg.addColorStop(0.35, `rgba(98,102,96,${alpha * 0.42})`);
    rg.addColorStop(0.65, `rgba(88,92,86,${alpha * 0.16})`);
    rg.addColorStop(1,    'rgba(80,84,78,0)');
    ctx.fillStyle = rg;
    ctx.beginPath();
    ctx.ellipse(sx, vy, bank.w * 0.5, expandH * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();
  });
}

// ── S4: Weather veil (vertical haze streaks) ────────────────────────────────
function s4DrawWeatherVeil(now) {
  const weatherStr = window01(0.18, 0.32, 0.62, 0.80, p4);
  if (weatherStr < 0.005) return;
  const sa = sceneAlpha;
  // Perceptual weather intensifies the overall dampening
  const pwDamp = 1 + s4pw * 0.65;

  const dampGrad = ctx.createLinearGradient(0, 0, 0, H);
  dampGrad.addColorStop(0,   `rgba(82,86,80,${weatherStr * 0.12 * pwDamp * sa})`);
  dampGrad.addColorStop(0.3, `rgba(78,82,76,${weatherStr * 0.18 * pwDamp * sa})`);
  dampGrad.addColorStop(0.6, `rgba(74,78,72,${weatherStr * 0.15 * pwDamp * sa})`);
  dampGrad.addColorStop(1,   `rgba(70,74,68,${weatherStr * 0.08 * pwDamp * sa})`);
  ctx.fillStyle = dampGrad;
  ctx.fillRect(0, 0, W, H);

  // Streaks drift at their own pace independent of scroll —
  // during heavy weather the mismatch creates uncertainty about what is moving
  const pwStreakBoost = 1 + s4pw * 0.50;
  S4_STREAKS.forEach(streak => {
    const drift = now * 0.001 * streak.speed * pwStreakBoost;
    const baseWx = streak.wx + drift + Math.sin(now * 0.00012 + streak.phase) * (80 + s4pw * 60);
    const wrappedWx = ((baseWx % (S4_WORLD * 1.3)) + S4_WORLD * 1.3) % (S4_WORLD * 1.3) - S4_WORLD * 0.15;
    const sx = wrappedWx - s4sx;
    if (sx < -streak.width * 2 || sx > W + streak.width * 2) return;

    const alpha = streak.density * weatherStr * pwDamp * sa;
    const yOff = streak.yOffset * H;
    // Streaks widen during heavy weather
    const sw = streak.width * (1 + s4pw * 0.35);
    const streakGrad = ctx.createLinearGradient(sx - sw * 0.5, 0, sx + sw * 0.5, 0);
    streakGrad.addColorStop(0,   'rgba(96,100,94,0)');
    streakGrad.addColorStop(0.3, `rgba(96,100,94,${alpha * 0.6})`);
    streakGrad.addColorStop(0.5, `rgba(92,96,90,${alpha})`);
    streakGrad.addColorStop(0.7, `rgba(96,100,94,${alpha * 0.6})`);
    streakGrad.addColorStop(1,   'rgba(96,100,94,0)');
    ctx.fillStyle = streakGrad;
    const topY = H * 0.05 + yOff;
    const botY = H * 0.85 + yOff;
    ctx.fillRect(sx - sw * 0.5, topY, sw, botY - topY);
  });

  // Low fog thickens during heavy weather — obscures terrain shape
  const lowFog = weatherStr * (0.20 + s4pw * 0.18) * sa;
  // Low fog band rises higher during heavy weather
  const lfgTop = H * (0.58 - s4pw * 0.08);
  const lfg = ctx.createLinearGradient(0, lfgTop, 0, H * 0.82);
  lfg.addColorStop(0, 'rgba(0,0,0,0)');
  lfg.addColorStop(0.3, `rgba(88,92,86,${lowFog * 0.6})`);
  lfg.addColorStop(0.6, `rgba(84,88,82,${lowFog})`);
  lfg.addColorStop(1, `rgba(82,86,80,${lowFog * 0.65})`);
  ctx.fillStyle = lfg;
  ctx.fillRect(0, lfgTop, W, H * 0.82 - lfgTop);
}

// ── S4: Water features ──────────────────────────────────────────────────────
function s4DrawWater(now) {
  const waterVis = fadeIn(0.10, 0.30, p4);
  if (waterVis < 0.004) return;
  const sa = sceneAlpha;

  S4_WATER.forEach(wf => {
    const sx = wf.wx - s4sx;

    if (wf.type === 'puddle') {
      if (sx < -wf.w || sx > W + wf.w) return;
      const gy = s4GroundY(wf.wx);
      const poolH = 3 + wf.depth * 7;
      const alpha = waterVis * wf.depth * 0.48 * sa;
      const rg = ctx.createLinearGradient(0, gy - 2, 0, gy + poolH);
      rg.addColorStop(0,   `rgba(60,68,78,${alpha * 0.35})`);
      rg.addColorStop(0.4, `rgba(48,58,72,${alpha * 0.60})`);
      rg.addColorStop(1,   `rgba(52,60,70,${alpha * 0.25})`);
      ctx.fillStyle = rg;
      ctx.beginPath(); ctx.ellipse(sx, gy, wf.w / 2, poolH, 0, 0, Math.PI * 2); ctx.fill();
    }

    else if (wf.type === 'saturated') {
      if (sx < -wf.w || sx > W + wf.w) return;
      const satVis = waterVis * wf.depth * 0.38 * sa;
      if (satVis < 0.01) return;
      const gy = s4GroundY(wf.wx);
      const sg = ctx.createRadialGradient(sx, gy, 0, sx, gy, wf.w * 0.5);
      sg.addColorStop(0,   `rgba(48,56,66,${satVis * 0.32})`);
      sg.addColorStop(0.5, `rgba(44,52,60,${satVis * 0.18})`);
      sg.addColorStop(1,   'rgba(40,48,56,0)');
      ctx.fillStyle = sg;
      ctx.fillRect(sx - wf.w * 0.5, gy - 4, wf.w, 10);
    }
  });
}

// ── S4: Single vegetation element ───────────────────────────────────────────
function s4DrawOneVeg(v, now) {
  const sx = v.wx - s4sx;
  if (sx < -300 || sx > W + 300) return;

  const gY = s4GroundY(v.wx);
  const vh = v.h * H, vw = v.w * W;
  // Tonal convergence: during heavy weather, depth layers compress toward mid-tone
  // Back layers and front layers become less distinguishable
  const rawDep = Math.min(v.layer, 3) / 3;
  const dep = lerp(rawDep, 0.45, s4pw * 0.62);
  const wet = window01(0.15, 0.40, 0.65, 0.85, p4);
  const windS = 0.4 + Math.sin(now * 0.00030 + v.windPhase) * 0.28;
  const windLean = Math.sin(now * 0.0006 + v.windPhase) * windS * 2.0
                 + Math.sin(now * 0.0015 + v.windPhase * 1.5) * windS * 1.0;
  // Weather dampens vegetation opacity; perceptual weather intensifies the effect
  const weatherDamp = 1 - window01(0.25, 0.38, 0.58, 0.72, p4) * (0.25 + s4pw * 0.30);

  if (v.kind === 's4conifer') {
    const r = lerp(32, 16, dep) | 0, g = lerp(42, 24, dep) | 0, b = lerp(30, 16, dep) | 0;
    ctx.strokeStyle = `rgb(${(r * 0.40) | 0},${(g * 0.35) | 0},${(b * 0.30) | 0})`;
    ctx.lineWidth = Math.max(1.5, vw * 0.045);
    ctx.beginPath(); ctx.moveTo(sx, gY); ctx.lineTo(sx + windLean * 0.06, gY - vh); ctx.stroke();
    ctx.fillStyle = `rgba(${r},${g},${b},${0.78 * weatherDamp})`;
    const tipX = sx + windLean * 0.10, tipY = gY - vh;
    const midY = gY - vh * 0.50;
    ctx.beginPath();
    ctx.moveTo(tipX, tipY);
    ctx.lineTo(tipX - vw * 0.20 + windLean * 0.04, midY);
    ctx.lineTo(tipX + vw * 0.20 + windLean * 0.04, midY);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = `rgba(${r - 3 | 0},${g - 3 | 0},${b - 2 | 0},${0.74 * weatherDamp})`;
    ctx.beginPath();
    ctx.moveTo(tipX, midY + vh * 0.05);
    ctx.lineTo(sx - vw * 0.28 + windLean * 0.03, gY - vh * 0.10);
    ctx.lineTo(sx + vw * 0.28 + windLean * 0.03, gY - vh * 0.10);
    ctx.closePath(); ctx.fill();

  } else if (v.kind === 'birch') {
    const barkR = lerp(155, 110, dep) | 0;
    const barkG = lerp(148, 102, dep) | 0;
    const barkB = lerp(138, 92, dep) | 0;
    ctx.strokeStyle = `rgba(${barkR},${barkG},${barkB},${0.85 * weatherDamp})`;
    ctx.lineWidth = Math.max(1.5, vw * 0.04);
    ctx.beginPath(); ctx.moveTo(sx, gY); ctx.lineTo(sx + windLean * 0.05, gY - vh * 0.62); ctx.stroke();
    const cr = lerp(48, 26, dep) | 0, cg = lerp(58, 34, dep) | 0, cb = lerp(42, 22, dep) | 0;
    ctx.fillStyle = `rgba(${cr},${cg},${cb},${0.68 * weatherDamp})`;
    ctx.beginPath();
    ctx.ellipse(sx + windLean * 0.10, gY - vh * 0.76, vw * 0.44, vh * 0.26, 0, 0, Math.PI * 2);
    ctx.fill();

  } else if (v.kind === 'alder') {
    const r = lerp(36, 16, dep) | 0, g2 = lerp(44, 26, dep) | 0, b2 = lerp(30, 14, dep) | 0;
    ctx.strokeStyle = `rgb(${(r * 0.46) | 0},${(g2 * 0.38) | 0},${(b2 * 0.34) | 0})`;
    ctx.lineWidth = Math.max(1.5, vw * 0.055);
    ctx.beginPath(); ctx.moveTo(sx, gY); ctx.lineTo(sx + windLean * 0.07, gY - vh * 0.52); ctx.stroke();
    ctx.fillStyle = `rgba(${r},${g2},${b2},${0.72 * weatherDamp})`;
    ctx.beginPath();
    ctx.ellipse(sx + windLean * 0.11, gY - vh * 0.68, vw * 0.38, vh * 0.28, 0, 0, Math.PI * 2);
    ctx.fill();

  } else if (v.kind === 'scrub' || v.kind === 'wet_scrub') {
    const r = lerp(40, 24, dep) | 0, g2 = lerp(50, 34, dep) | 0, b2 = lerp(34, 20, dep) | 0;
    ctx.fillStyle = `rgba(${r},${g2},${b2},${0.58 * weatherDamp})`;
    ctx.beginPath();
    ctx.ellipse(sx + windLean * 0.08, gY - vh * 0.45, vw * 0.46, vh * 0.46, 0, 0, Math.PI * 2);
    ctx.fill();

  } else if (v.kind === 'wet_grass' || v.kind === 'meadow_grass') {
    const isWet = v.kind === 'wet_grass';
    const r = lerp(isWet ? 52 : 66, isWet ? 36 : 48, wet) | 0;
    const g2 = lerp(isWet ? 62 : 72, isWet ? 46 : 56, wet) | 0;
    const b2 = lerp(isWet ? 40 : 54, isWet ? 28 : 38, wet) | 0;
    ctx.fillStyle = `rgba(${r},${g2},${b2},${(isWet ? 0.42 : 0.46) * weatherDamp})`;
    for (let bl = 0; bl < 5; bl++) {
      const bx = sx - vw * 0.4 + bl * vw * 0.2;
      const lean = (rand(v.wx + bl * 7) - 0.5) * vw * 0.25 + windLean * 0.8;
      const bladeH = vh * (0.6 + rand(v.wx + bl * 3) * 0.4);
      ctx.beginPath(); ctx.moveTo(bx, gY);
      ctx.quadraticCurveTo(bx + lean * 0.4, gY - bladeH * 0.5, bx + lean, gY - bladeH);
      ctx.quadraticCurveTo(bx + lean * 0.4 + 1.2, gY - bladeH * 0.5, bx + 1.2, gY);
      ctx.fill();
    }

  } else if (v.kind === 'fg_conifer') {
    const fgAlpha = window01(0.10, 0.20, 0.75, 0.88, p4) * 0.55 * weatherDamp * sceneAlpha;
    if (fgAlpha < 0.02) return;
    ctx.globalAlpha = fgAlpha;
    ctx.strokeStyle = 'rgb(14,18,12)';
    ctx.lineWidth = Math.max(3, vw * 0.10);
    ctx.beginPath(); ctx.moveTo(sx, gY + 20); ctx.lineTo(sx + windLean * 0.06, gY - vh * 0.55); ctx.stroke();
    ctx.fillStyle = 'rgba(12,16,10,0.75)';
    const tipX = sx + windLean * 0.10;
    ctx.beginPath();
    ctx.moveTo(tipX, gY - vh);
    ctx.lineTo(sx - vw * 0.35 + windLean * 0.04, gY - vh * 0.35);
    ctx.lineTo(sx + vw * 0.35 + windLean * 0.04, gY - vh * 0.35);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(10,14,8,0.70)';
    ctx.beginPath();
    ctx.moveTo(tipX, gY - vh * 0.55);
    ctx.lineTo(sx - vw * 0.45 + windLean * 0.03, gY - vh * 0.08);
    ctx.lineTo(sx + vw * 0.45 + windLean * 0.03, gY - vh * 0.08);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = sceneAlpha;

  } else if (v.kind === 'fg_grass') {
    const fgAlpha = window01(0.10, 0.20, 0.75, 0.88, p4) * 0.50 * weatherDamp * sceneAlpha;
    if (fgAlpha < 0.02) return;
    ctx.globalAlpha = fgAlpha;
    ctx.fillStyle = 'rgba(22,30,18,0.60)';
    for (let bl = 0; bl < 8; bl++) {
      const bx = sx - vw * 0.55 + bl * vw * 0.14;
      const lean = (rand(v.wx + bl * 7) - 0.5) * vw * 0.40 + windLean * 1.5;
      const bladeH = vh * (0.5 + rand(v.wx + bl * 3) * 0.5);
      ctx.beginPath(); ctx.moveTo(bx, gY + 30);
      ctx.quadraticCurveTo(bx + lean * 0.4, gY - bladeH * 0.4, bx + lean, gY - bladeH);
      ctx.lineTo(bx + lean + 2, gY - bladeH);
      ctx.quadraticCurveTo(bx + lean * 0.4 + 2, gY - bladeH * 0.4, bx + 2.5, gY + 30);
      ctx.fill();
    }
    ctx.globalAlpha = sceneAlpha;
  }
}

// ── S4: Overhead vegetation (returning canopy) ──────────────────────────────
function s4DrawOverheadVegetation(now) {
  const overhead = window01(0.30, 0.45, 0.80, 0.92, p4);
  if (overhead < 0.004) return;
  const sa = sceneAlpha;
  const baseAlpha = overhead * 0.42 * sa;

  const tg = ctx.createLinearGradient(0, 0, 0, H * 0.42);
  tg.addColorStop(0,   `rgba(14,18,12,${baseAlpha * 0.55})`);
  tg.addColorStop(0.4, `rgba(18,24,16,${baseAlpha * 0.25})`);
  tg.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.fillStyle = tg;
  ctx.fillRect(0, 0, W, H * 0.42);

  ctx.fillStyle = `rgba(12,16,10,${overhead * 0.30 * sa})`;
  const branchOffset = s4sx * 0.10;
  const ws = s4WindStr(now);
  for (let i = 0; i < 7; i++) {
    const bx = (i * W * 0.20 + rand(i * 7) * W * 0.12 - branchOffset * (0.6 + rand(i * 3) * 0.4)) % (W * 1.4) - W * 0.2;
    const by = H * (0.02 + rand(i * 11) * 0.10);
    const bw = W * (0.06 + rand(i * 13) * 0.12);
    const bh = H * (0.02 + rand(i * 17) * 0.045);
    ctx.beginPath();
    ctx.ellipse(bx + ws * 2.5, by, bw, bh, rand(i * 19) * 0.2, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ── S4: Side enclosure ──────────────────────────────────────────────────────
function s4DrawSideEnclosure() {
  const enclosure = window01(0.25, 0.40, 0.78, 0.90, p4);
  if (enclosure < 0.004) return;
  const sa = sceneAlpha;

  const leftStr = enclosure * 0.85;
  const lg = ctx.createLinearGradient(0, 0, W * 0.20, 0);
  lg.addColorStop(0, `rgba(16,22,14,${leftStr * 0.38 * sa})`);
  lg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = lg;
  ctx.fillRect(0, H * 0.15, W * 0.20, H * 0.68);

  const rightStr = enclosure * 0.70;
  const rg = ctx.createLinearGradient(W, 0, W * 0.82, 0);
  rg.addColorStop(0, `rgba(16,22,14,${rightStr * 0.35 * sa})`);
  rg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = rg;
  ctx.fillRect(W * 0.82, H * 0.18, W * 0.18, H * 0.64);

  const bottomStr = window01(0.30, 0.44, 0.72, 0.85, p4);
  if (bottomStr > 0.01) {
    const bg = ctx.createLinearGradient(0, H, 0, H * 0.78);
    bg.addColorStop(0, `rgba(14,18,12,${bottomStr * 0.32 * sa})`);
    bg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = bg;
    ctx.fillRect(0, H * 0.78, W, H * 0.22);
  }
}

// ── S4: Atmosphere ──────────────────────────────────────────────────────────
function s4DrawAtmosphere() {
  const sa = sceneAlpha;
  const haze = window01(0.12, 0.25, 0.72, 0.88, p4);
  // Mid-height haze intensifies during heavy weather — depth compresses into tonal band
  const hazeStr = haze * (0.10 + s4pw * 0.12);
  if (haze > 0.004) {
    const hg = ctx.createLinearGradient(0, H * 0.26, 0, H * 0.62);
    hg.addColorStop(0, 'rgba(0,0,0,0)');
    hg.addColorStop(0.4, `rgba(76,82,74,${hazeStr * sa})`);
    hg.addColorStop(0.7, `rgba(74,80,72,${hazeStr * 0.7 * sa})`);
    hg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = hg;
    ctx.fillRect(0, H * 0.26, W, H * 0.36);
  }
  const groundMoist = fadeIn(0.16, 0.40, p4) * fadeOut(0.68, 0.85, p4);
  if (groundMoist > 0.004) {
    const moistStr = groundMoist * (0.11 + s4pw * 0.08);
    const mg = ctx.createLinearGradient(0, H * 0.62, 0, H * 0.76);
    mg.addColorStop(0, 'rgba(0,0,0,0)');
    mg.addColorStop(0.5, `rgba(70,76,68,${moistStr * sa})`);
    mg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = mg;
    ctx.fillRect(0, H * 0.62, W, H * 0.14);
  }
}

// ── S4: Sky corridors ───────────────────────────────────────────────────────
function s4DrawSkyCorridors(now) {
  // Sky gaps close during heavy weather — canopy gaps become invisible
  const vis = window01(0.35, 0.48, 0.58, 0.72, p4) * 0.18 * (1 - s4pw * 0.75);
  if (vis < 0.008) return;
  const sa = sceneAlpha;
  const gaps = [{ wx: 4200, w: 60, h: 0.07 },{ wx: 7800, w: 90, h: 0.09 },{ wx: 11400, w: 110, h: 0.12 }];
  gaps.forEach(gap => {
    const sx = gap.wx - s4sx;
    if (sx < -gap.w || sx > W + gap.w) return;
    const fogAtten = 1 - s4FogDensityAt(sx, H * 0.28, now) * 2.5;
    const alpha = vis * Math.max(fogAtten, 0.05) * sa;
    const gg = ctx.createRadialGradient(sx, H * 0.28, 0, sx, H * 0.28, gap.w);
    gg.addColorStop(0,   `rgba(112,118,114,${alpha * 0.35})`);
    gg.addColorStop(0.5, `rgba(94,100,96,${alpha * 0.14})`);
    gg.addColorStop(1,   'rgba(0,0,0,0)');
    ctx.fillStyle = gg;
    ctx.fillRect(sx - gap.w, H * 0.10, gap.w * 2, H * gap.h + H * 0.16);
  });
}


// =============================================================================
// BLENDED DRAWS — Sky, Ground, Vignette, Dark
// =============================================================================

function drawBlendedSky() {
  const s1c = s1SkyColors();
  const s2c = s2SkyColors();
  const s3c = s3SkyColors();
  const s4c = s4SkyColors();
  // Three-stage blend: S1->S2 via seamT, result->S3 via seamT2, result->S4 via seamT3
  let topR = lerp(s1c.topR, s2c.topR, seamT);
  let topG = lerp(s1c.topG, s2c.topG, seamT);
  let topB = lerp(s1c.topB, s2c.topB, seamT);
  let botR = lerp(s1c.botR, s2c.botR, seamT);
  let botG = lerp(s1c.botG, s2c.botG, seamT);
  let botB = lerp(s1c.botB, s2c.botB, seamT);
  let horizon = lerp(s1c.horizon, s2c.horizon, seamT);
  topR = lerp(topR, s3c.topR, seamT2);
  topG = lerp(topG, s3c.topG, seamT2);
  topB = lerp(topB, s3c.topB, seamT2);
  botR = lerp(botR, s3c.botR, seamT2);
  botG = lerp(botG, s3c.botG, seamT2);
  botB = lerp(botB, s3c.botB, seamT2);
  horizon = lerp(horizon, s3c.horizon, seamT2);
  topR = lerp(topR, s4c.topR, seamT3) | 0;
  topG = lerp(topG, s4c.topG, seamT3) | 0;
  topB = lerp(topB, s4c.topB, seamT3) | 0;
  botR = lerp(botR, s4c.botR, seamT3) | 0;
  botG = lerp(botG, s4c.botG, seamT3) | 0;
  botB = lerp(botB, s4c.botB, seamT3) | 0;
  horizon = lerp(horizon, s4c.horizon, seamT3);
  const g = ctx.createLinearGradient(0, 0, 0, horizon);
  g.addColorStop(0, `rgb(${topR},${topG},${topB})`);
  g.addColorStop(1, `rgb(${botR},${botG},${botB})`);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function drawBlendedGround() {
  // Color blending
  const s1rf = window01(0.38, 0.52, 0.64, 0.80, p1);
  const s1tR = lerp(38,96,s1rf), s1tG = lerp(43,100,s1rf), s1tB = lerp(32,92,s1rf);
  const s1bR = lerp(16,52,s1rf), s1bG = lerp(19,56,s1rf), s1bB = lerp(12,48,s1rf);

  const s2wet = fadeIn(0.22, 0.60, p2);
  const s2reopen = fadeIn(0.76, 0.90, p2);
  const wetness = Math.max(0, s2wet - s2reopen * 0.3);
  const s2tR = lerp(82,50,wetness), s2tG = lerp(80,56,wetness), s2tB = lerp(68,44,wetness);
  const s2bR = lerp(44,28,wetness), s2bG = lerp(42,32,wetness), s2bB = lerp(34,24,wetness);

  const s3wet2 = fadeIn(0.15, 0.50, p3);
  const s3reopen2 = fadeIn(0.65, 0.85, p3);
  const s3wetness = Math.max(0, s3wet2 - s3reopen2 * 0.4);
  const s3tR = lerp(74,42,s3wetness), s3tG = lerp(72,48,s3wetness), s3tB = lerp(60,36,s3wetness);
  const s3bR = lerp(38,22,s3wetness), s3bG = lerp(36,26,s3wetness), s3bB = lerp(28,18,s3wetness);

  const s4wet3 = window01(0.15, 0.40, 0.65, 0.85, p4);
  const s4tR = lerp(70,46,s4wet3), s4tG = lerp(68,50,s4wet3), s4tB = lerp(58,38,s4wet3);
  const s4bR = lerp(36,22,s4wet3), s4bG = lerp(34,26,s4wet3), s4bB = lerp(28,18,s4wet3);

  // Three-stage color blend
  let tR = lerp(s1tR, s2tR, seamT);
  let tG = lerp(s1tG, s2tG, seamT);
  let tB = lerp(s1tB, s2tB, seamT);
  let bR = lerp(s1bR, s2bR, seamT);
  let bG = lerp(s1bG, s2bG, seamT);
  let bB = lerp(s1bB, s2bB, seamT);
  tR = lerp(tR, s3tR, seamT2);
  tG = lerp(tG, s3tG, seamT2);
  tB = lerp(tB, s3tB, seamT2);
  bR = lerp(bR, s3bR, seamT2);
  bG = lerp(bG, s3bG, seamT2);
  bB = lerp(bB, s3bB, seamT2);
  tR = lerp(tR, s4tR, seamT3) | 0;
  tG = lerp(tG, s4tG, seamT3) | 0;
  tB = lerp(tB, s4tB, seamT3) | 0;
  bR = lerp(bR, s4bR, seamT3) | 0;
  bG = lerp(bG, s4bG, seamT3) | 0;
  bB = lerp(bB, s4bB, seamT3) | 0;

  // Height blending (four-way)
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 3) {
    const globalWx = x + scrollX;
    const s2LocalWx = globalWx - S2_OFFSET;
    const s3LocalWx = globalWx - S3_OFFSET;
    const s4LocalWx = globalWx - S4_OFFSET;
    let y = lerp(s1GroundY(globalWx), s2GroundY(s2LocalWx), seamT);
    y = lerp(y, s3GroundY(s3LocalWx), seamT2);
    y = lerp(y, s4GroundY(s4LocalWx), seamT3);
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W, H);
  ctx.closePath();

  const midGlobalWx = scrollX + W / 2;
  const s2MidLocal = midGlobalWx - S2_OFFSET;
  const s3MidLocal = midGlobalWx - S3_OFFSET;
  const s4MidLocal = midGlobalWx - S4_OFFSET;
  let midGY = lerp(s1GroundY(midGlobalWx), s2GroundY(s2MidLocal), seamT);
  midGY = lerp(midGY, s3GroundY(s3MidLocal), seamT2);
  midGY = lerp(midGY, s4GroundY(s4MidLocal), seamT3);
  const g = ctx.createLinearGradient(0, midGY, 0, H);
  g.addColorStop(0, `rgb(${tR},${tG},${tB})`);
  g.addColorStop(1, `rgb(${bR},${bG},${bB})`);
  ctx.fillStyle = g;
  ctx.fill();

  // Scene 2 wet sheen (when scene 2 is active)
  const s2Alpha = seamT * (1 - seamT2);
  if (s2Alpha > 0.1) {
    const sheenVis = fadeIn(0.35, 0.60, p2) * fadeOut(0.78, 0.90, p2) * s2Alpha;
    if (sheenVis > 0.008) {
      const sg = ctx.createLinearGradient(0, H * 0.70, 0, H * 0.79);
      sg.addColorStop(0, `rgba(56,62,70,${sheenVis * 0.06})`);
      sg.addColorStop(0.5, `rgba(50,56,64,${sheenVis * 0.08})`);
      sg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = sg;
      ctx.fillRect(0, H * 0.70, W, H * 0.09);
    }
  }

  // Scene 3 wet sheen
  if (seamT2 > 0.1 && seamT3 < 0.9) {
    const s3sheen = fadeIn(0.22, 0.50, p3) * fadeOut(0.72, 0.88, p3) * seamT2 * (1 - seamT3);
    if (s3sheen > 0.008) {
      const sg3 = ctx.createLinearGradient(0, H * 0.68, 0, H * 0.78);
      sg3.addColorStop(0, `rgba(50,56,62,${s3sheen * 0.07})`);
      sg3.addColorStop(0.5, `rgba(44,50,56,${s3sheen * 0.10})`);
      sg3.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = sg3;
      ctx.fillRect(0, H * 0.68, W, H * 0.10);
    }
  }

  // Scene 4 wet sheen
  if (seamT3 > 0.1) {
    const s4sheen = window01(0.18, 0.38, 0.65, 0.82, p4) * seamT3;
    if (s4sheen > 0.008) {
      const sg4 = ctx.createLinearGradient(0, H * 0.66, 0, H * 0.76);
      sg4.addColorStop(0, `rgba(48,54,58,${s4sheen * 0.06})`);
      sg4.addColorStop(0.5, `rgba(42,48,52,${s4sheen * 0.08})`);
      sg4.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = sg4;
      ctx.fillRect(0, H * 0.66, W, H * 0.10);
    }
  }
}

function drawBlendedVignette() {
  const s2Alpha = seamT * (1 - seamT2);
  const s3Alpha = seamT2 * (1 - seamT3);
  const s4Alpha = seamT3;

  if (seamT < 1) {
    const vg = ctx.createRadialGradient(W/2, H/2, H*0.16, W/2, H/2, H*0.90);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, `rgba(0,0,0,${0.50 * (1 - seamT)})`);
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }
  if (s2Alpha > 0.01) {
    const close = window01(0.25, 0.40, 0.68, 0.82, p2);
    const radius = lerp(0.88, 0.52, close);
    const strength = lerp(0.40, 0.62, close);
    const vg = ctx.createRadialGradient(W/2, H/2, H*0.14, W/2, H/2, H*radius);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, `rgba(0,0,0,${strength * s2Alpha})`);
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }
  if (s3Alpha > 0.01) {
    const close3 = window01(0.15, 0.28, 0.62, 0.78, p3);
    const radius3 = lerp(0.82, 0.46, close3);
    const strength3 = lerp(0.42, 0.68, close3);
    const vg3 = ctx.createRadialGradient(W/2, H/2, H*0.12, W/2, H/2, H*radius3);
    vg3.addColorStop(0, 'rgba(0,0,0,0)');
    vg3.addColorStop(1, `rgba(0,0,0,${strength3 * s3Alpha})`);
    ctx.fillStyle = vg3;
    ctx.fillRect(0, 0, W, H);
  }
  if (s4Alpha > 0.01) {
    const weather4 = window01(0.22, 0.35, 0.62, 0.78, p4);
    const radius4 = lerp(0.86, 0.55, weather4);
    const strength4 = lerp(0.38, 0.55, weather4);
    const vg4 = ctx.createRadialGradient(W/2, H/2, H*0.14, W/2, H/2, H*radius4);
    vg4.addColorStop(0, 'rgba(0,0,0,0)');
    vg4.addColorStop(1, `rgba(0,0,0,${strength4 * s4Alpha})`);
    ctx.fillStyle = vg4;
    ctx.fillRect(0, 0, W, H);
  }
}

let loopCooldown = 0;

function drawDark() {
  let d = 0;
  // Scene 1 opening: fade from black
  if (p1 < 0.10) d = Math.max(d, fadeOut(0, 0.06, p1));
  // Scene 4 closing: fade to black (end of traversal, triggers loop)
  if (p4 > 0.85) d = Math.max(d, fadeIn(0.90, 0.98, p4));
  if (d < 0.003) return;
  ctx.fillStyle = `rgba(0,0,0,${d})`;
  ctx.fillRect(0, 0, W, H);

  // Loop-back: when fully black at end of S4, reset to beginning
  if (d > 0.97 && p4 > 0.95 && performance.now() > loopCooldown) {
    scrollX = 0;
    targetX = 0;
    loopCooldown = performance.now() + 2000;
    // Reset all fragment triggers
    S1_FRAGS.forEach(f => f.done = false);
    S2_FRAGS.forEach(f => f.done = false);
    S3_FRAGS.forEach(f => f.done = false);
    S4_FRAGS.forEach(f => f.done = false);
    fragPhase = 'idle';
  }
}
