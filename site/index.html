<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>NORTHING | a documentary about a place that doesn't exist</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #000;
  cursor: none;
}
canvas {
  display: block;
  position: fixed;
  top: 0; left: 0;
}
#fragment {
  position: fixed;
  bottom: 17%;
  left: 50%;
  transform: translateX(-50%);
  font-family: 'Courier New', Courier, monospace;
  font-size: clamp(11px, 1.6vw, 15px);
  font-style: normal;
  font-weight: 400;
  letter-spacing: 0.12em;
  text-transform: lowercase;
  color: rgba(212, 200, 178, 0);
  text-align: center;
  pointer-events: none;
  white-space: nowrap;
  z-index: 10;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="fragment"></div>
<script>
// =============================================================================
// NORTHING — Combined Traversal
// Scene 1: Forest approach / ridge / descent / orchard (from prototype 002)
// Scene 2: Drainage edge passage (from prototype 004)
// One canvas, one scroll, one audio system, one render loop.
// =============================================================================

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const fragEl = document.getElementById('fragment');

let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

// ── World geometry ──────────────────────────────────────────────────────────
// Scene 1 occupies global scrollX [0, S1_WORLD].
// Scene 2 occupies global scrollX [S2_OFFSET, S2_OFFSET + S2_WORLD].
// The seam zone [SEAM_START, SEAM_END] crossfades between them.

const S1_WORLD    = 11000;
const S2_WORLD    = 14000;
const S2_OFFSET   = 10200;
const S3_WORLD    = 16000;
const S3_OFFSET   = 22800;
const S4_WORLD    = 14000;
const S4_OFFSET   = 36500;
const WORLD_TOTAL = S4_OFFSET + S4_WORLD;   // 50500
const SEAM_START  = 7500;
const SEAM_END    = 12000;
const SEAM2_START = 20500;
const SEAM2_END   = 26000;
const SEAM3_START = 34000;
const SEAM3_END   = 39500;

let scrollX  = 0;
let targetX  = 0;

// ── Frame state (recomputed each frame) ─────────────────────────────────────
let p1 = 0, p2 = 0, p3 = 0, p4 = 0, seamT = 0, seamT2 = 0, seamT3 = 0, s2sx = 0, s3sx = 0, s4sx = 0, sceneAlpha = 1, s4pw = 0;

// ── Shared math ─────────────────────────────────────────────────────────────
const lerp     = (a, b, t) => a + (b - a) * t;
const clamp    = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;
const smooth   = t => t * t * (3 - 2 * t);
const fadeIn   = (lo, hi, t) => smooth(clamp((t - lo) / (hi - lo), 0, 1));
const fadeOut  = (lo, hi, t) => 1 - fadeIn(lo, hi, t);
const window01 = (lo, p0, p1x, hi, t) => Math.min(fadeIn(lo, p0, t), fadeOut(p1x, hi, t));

function rand(seed) {
  const x = Math.sin(seed * 9301 + 49297) * 233280;
  return x - Math.floor(x);
}

// =============================================================================
// SCENE 1 — Forest / Ridge / Orchard
// =============================================================================

// ── S1: Tree data ───────────────────────────────────────────────────────────
const S1_TREES = [];

(function buildS1Trees() {
  for (let i = 0; i < 280; i++) {
    const wx = 500 + rand(i * 7 + 1) * 2700;
    const layer = Math.floor(rand(i * 3 + 2) * 4);
    S1_TREES.push({ wx, layer,
      h: 0.28 + rand(i*11+3)*0.42 + layer*0.09,
      w: 0.022 + rand(i*17+4)*0.020,
      kind: rand(i*5+5) > 0.92 ? 'dead' : 'conifer' });
  }
  for (let i = 400; i < 460; i++) {
    const wx = 3200 + rand(i * 7) * 1600;
    const layer = Math.floor(rand(i * 3) * 3);
    S1_TREES.push({ wx, layer,
      h: 0.18 + rand(i*11)*0.28 + layer*0.07,
      w: 0.016 + rand(i*17)*0.012,
      kind: rand(i*5) > 0.55 ? 'dead' : 'conifer' });
  }
  for (let i = 500; i < 545; i++) {
    const wx = 4800 + rand(i * 7) * 1600;
    const layer = Math.floor(rand(i * 3) * 2);
    S1_TREES.push({ wx, layer,
      h: 0.05 + rand(i*11)*0.11,
      w: 0.016 + rand(i*17)*0.010,
      kind: 'shrub' });
  }
  for (let i = 600; i < 850; i++) {
    const wx = 6400 + rand(i * 7) * 1600;
    const layer = Math.floor(rand(i * 3) * 4);
    S1_TREES.push({ wx, layer,
      h: 0.26 + rand(i*11)*0.44 + layer*0.09,
      w: 0.020 + rand(i*17)*0.018,
      kind: 'conifer' });
  }
  for (let i = 0; i < 26; i++) {
    [1, 2].forEach(row => {
      S1_TREES.push({
        wx: 8100 + i * 165 + rand(i*100+row)*35 - 17,
        layer: row,
        h: 0.13 + rand(i*13+row)*0.09,
        w: 0.032 + rand(i*19+row)*0.014,
        kind: 'orchard'
      });
    });
  }
  S1_TREES.sort((a, b) => a.layer - b.layer);
})();

// ── S1: Ground height ───────────────────────────────────────────────────────
function s1GroundY(wx) {
  const base = H * 0.725;
  const undulation = Math.sin(wx * 0.0016) * 16
                   + Math.sin(wx * 0.0040 + 1.2) * 9
                   + Math.sin(wx * 0.00085 + 2.5) * 24;
  const dist = Math.abs(wx - 5400);
  const lift = Math.pow(Math.max(0, 1 - dist / 2500), 2.0) * 95;
  return base + undulation - lift;
}

// ── S1: Sky ─────────────────────────────────────────────────────────────────
function s1SkyColors() {
  const rf = window01(0.38, 0.52, 0.64, 0.80, p1);
  return {
    topR: lerp(18, 112, rf), topG: lerp(22, 126, rf), topB: lerp(18, 138, rf),
    botR: lerp(42, 158, rf), botG: lerp(48, 166, rf), botB: lerp(38, 172, rf),
    horizon: H * 0.74
  };
}

// ── S1: Distant hills ───────────────────────────────────────────────────────
function s1DrawHills() {
  const vis = window01(0.38, 0.52, 0.64, 0.80, p1);
  if (vis < 0.004) return;
  [
    { pf: 0.05, baseY: 0.50, amp: 58, freq: 0.00042, col: [96,108,118] },
    { pf: 0.09, baseY: 0.57, amp: 36, freq: 0.00071, col: [74,85,94] },
    { pf: 0.14, baseY: 0.62, amp: 22, freq: 0.00112, col: [55,65,72] },
  ].forEach(({ pf, baseY, amp, freq, col }) => {
    const off = scrollX * pf;
    ctx.fillStyle = `rgba(${col[0]},${col[1]},${col[2]},${vis * 0.90 * sceneAlpha})`;
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let x = -8; x <= W + 8; x += 5) {
      const wx = x + off;
      const y = H * baseY
              + Math.sin(wx * freq) * amp
              + Math.sin(wx * freq * 2.2 + 1.3) * amp * 0.38
              + Math.sin(wx * freq * 0.45 + 2.8) * amp * 0.65;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fill();
  });
}

// ── S1: Shelter ─────────────────────────────────────────────────────────────
function s1DrawShelter() {
  const vis = window01(0.50, 0.57, 0.62, 0.70, p1);
  if (vis < 0.01) return;
  const sx = 980 - scrollX * 0.085;
  if (sx < -60 || sx > W + 60) return;
  const hillOff = scrollX * 0.14;
  const hillWx = sx + hillOff;
  const shelterY = H * 0.62
                 + Math.sin(hillWx * 0.00112) * 22
                 + Math.sin(hillWx * 0.00246 + 1.3) * 8.4;
  const sw = 30, sh = 18;
  ctx.globalAlpha = vis * 0.62 * sceneAlpha;
  ctx.fillStyle = '#1a1814';
  ctx.fillRect(sx - sw / 2, shelterY - sh, sw, sh);
  ctx.beginPath();
  ctx.moveTo(sx - sw / 2 - 5, shelterY - sh);
  ctx.lineTo(sx, shelterY - sh - 10);
  ctx.lineTo(sx + sw / 2 + 5, shelterY - sh);
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = sceneAlpha;
}

// ── S1: Orchard boundary ────────────────────────────────────────────────────
function s1DrawOrchardBoundary() {
  const vis = window01(0.82, 0.87, 0.92, 0.97, p1);
  if (vis < 0.01) return;
  const wallWx = 8620;
  const sx = wallWx - scrollX;
  if (sx < -250 || sx > W + 250) return;
  const gy = s1GroundY(wallWx);
  ctx.globalAlpha = vis * 0.48 * sceneAlpha;
  ctx.fillStyle = '#585048';
  for (let i = 0; i < 16; i++) {
    const bx = sx - 130 + i * 17 + rand(i * 7) * 7;
    const bw = 12 + rand(i * 3) * 7;
    const bh = 5 + rand(i * 5) * 4;
    const by = gy - bh - rand(i * 11) * 4;
    ctx.fillRect(bx, by, bw, bh);
  }
  ctx.globalAlpha = sceneAlpha;
}

// ── S1: Single tree ─────────────────────────────────────────────────────────
function s1DrawOneTree(tree) {
  const sx = tree.wx - scrollX;
  if (sx < -350 || sx > W + 350) return;
  const gY = s1GroundY(tree.wx);
  const th = tree.h * H;
  const tw = tree.w * W;
  const dep = tree.layer / 3;

  if (tree.kind === 'conifer') {
    const r = lerp(65, 22, dep) | 0;
    const g = lerp(74, 28, dep) | 0;
    const b = lerp(65, 20, dep) | 0;
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    for (let lv = 0; lv < 3; lv++) {
      const lTop = gY - th + (th * 0.62 * lv / 3);
      const lBot = gY - (th * 0.10 * lv / 3);
      const lW = tw * (1.08 - lv * 0.16);
      ctx.beginPath();
      ctx.moveTo(sx, lTop);
      ctx.lineTo(sx - lW / 2, lBot);
      ctx.lineTo(sx + lW / 2, lBot);
      ctx.closePath();
      ctx.fill();
    }
    ctx.fillStyle = `rgb(${(r*0.65)|0},${(g*0.55)|0},${(b*0.50)|0})`;
    ctx.fillRect(sx - tw * 0.07, gY - th * 0.17, tw * 0.14, th * 0.17);

  } else if (tree.kind === 'dead') {
    ctx.strokeStyle = 'rgba(42,39,34,0.72)';
    ctx.lineWidth = Math.max(1, tw * 0.09);
    ctx.beginPath(); ctx.moveTo(sx, gY); ctx.lineTo(sx, gY - th); ctx.stroke();
    ctx.lineWidth = Math.max(0.5, tw * 0.045);
    ctx.beginPath();
    ctx.moveTo(sx, gY - th * 0.62); ctx.lineTo(sx - tw * 0.42, gY - th * 0.78);
    ctx.moveTo(sx, gY - th * 0.74); ctx.lineTo(sx + tw * 0.38, gY - th * 0.88);
    ctx.stroke();

  } else if (tree.kind === 'shrub') {
    const r = lerp(62,48,dep)|0, g2 = lerp(70,56,dep)|0, b2 = lerp(54,42,dep)|0;
    ctx.fillStyle = `rgba(${r},${g2},${b2},0.82)`;
    ctx.beginPath();
    ctx.ellipse(sx, gY - th * 0.52, tw * 0.68, th * 0.52, 0, 0, Math.PI * 2);
    ctx.fill();

  } else if (tree.kind === 'orchard') {
    ctx.fillStyle = 'rgb(36,50,28)';
    ctx.fillRect(sx - 3, gY - th * 0.72, 6, th * 0.72);
    ctx.beginPath();
    ctx.ellipse(sx, gY - th * 0.76, tw * 0.46, th * 0.38, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ── S1: Canopy ──────────────────────────────────────────────────────────────
function s1DrawCanopy() {
  const approach = window01(0.05, 0.12, 0.30, 0.44, p1);
  const descent  = window01(0.66, 0.72, 0.82, 0.92, p1);
  const ca = Math.max(approach, descent);
  if (ca < 0.004) return;
  const sa = sceneAlpha;

  const tg = ctx.createLinearGradient(0, 0, 0, H * 0.68);
  tg.addColorStop(0,    `rgba(6,8,5,${ca * 0.90 * sa})`);
  tg.addColorStop(0.55, `rgba(10,13,8,${ca * 0.58 * sa})`);
  tg.addColorStop(1,    'rgba(0,0,0,0)');
  ctx.fillStyle = tg;
  ctx.fillRect(0, 0, W, H * 0.68);

  const bg = ctx.createLinearGradient(0, H * 0.70, 0, H);
  bg.addColorStop(0, 'rgba(0,0,0,0)');
  bg.addColorStop(1, `rgba(4,6,3,${ca * 0.60 * sa})`);
  ctx.fillStyle = bg;
  ctx.fillRect(0, H * 0.70, W, H * 0.30);

  const mistY = H * 0.72;
  const mg = ctx.createLinearGradient(0, mistY - 45, 0, mistY + 35);
  mg.addColorStop(0,   'rgba(0,0,0,0)');
  mg.addColorStop(0.5, `rgba(65,76,55,${ca * 0.16 * sa})`);
  mg.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.fillStyle = mg;
  ctx.fillRect(0, mistY - 45, W, 80);
}

// ── S1: Ridge haze ──────────────────────────────────────────────────────────
function s1DrawRidgeHaze() {
  const vis = window01(0.44, 0.54, 0.64, 0.76, p1);
  if (vis < 0.004) return;
  const hg = ctx.createLinearGradient(0, H * 0.34, 0, H * 0.64);
  hg.addColorStop(0, 'rgba(0,0,0,0)');
  hg.addColorStop(1, `rgba(182,190,198,${vis * 0.22 * sceneAlpha})`);
  ctx.fillStyle = hg;
  ctx.fillRect(0, H * 0.34, W, H * 0.30);
}


// =============================================================================
// SCENE 2 — Drainage Edge Passage
// =============================================================================

// ── S2: Vegetation data ─────────────────────────────────────────────────────
const S2_VEG = [];

(function buildS2Veg() {
  for (let i = 0; i < 80; i++) {
    const wx = 400 + rand(i * 7 + 1) * 2200;
    const layer = Math.floor(rand(i * 3 + 2) * 3);
    S2_VEG.push({ wx, layer,
      h: 0.02 + rand(i * 11 + 3) * 0.045,
      w: 0.025 + rand(i * 17 + 4) * 0.035,
      kind: 'meadow_grass', windPhase: rand(i * 23) * Math.PI * 2 });
  }
  for (let i = 100; i < 220; i++) {
    const wx = 2000 + rand(i * 7) * 4500;
    const layer = Math.floor(rand(i * 3) * 4);
    const tall = rand(i * 9) > 0.7;
    S2_VEG.push({ wx, layer,
      h: tall ? (0.08 + rand(i * 11) * 0.14) : (0.03 + rand(i * 11) * 0.06),
      w: 0.020 + rand(i * 17) * 0.030,
      kind: tall ? 'tall_grass' : 'meadow_grass',
      windPhase: rand(i * 23) * Math.PI * 2 });
  }
  const passageClumps = [3600, 4400, 5200, 6000, 6800, 7600, 8200, 9000];
  passageClumps.forEach((cx, ci) => {
    const clumpSize = 400 + rand(ci * 7) * 600;
    const count = 12 + Math.floor(rand(ci * 11) * 18);
    for (let i = 0; i < count; i++) {
      const wx = cx + (rand(ci * 100 + i * 7) - 0.5) * clumpSize;
      const layer = Math.floor(rand(ci * 100 + i * 3) * 4);
      const kind = rand(ci * 100 + i * 5);
      S2_VEG.push({ wx, layer,
        h: 0.10 + rand(ci * 100 + i * 11) * 0.30 + layer * 0.06,
        w: 0.018 + rand(ci * 100 + i * 17) * 0.028,
        kind: kind > 0.72 ? 's2conifer' : (kind > 0.45 ? 'willow' : (kind > 0.20 ? 'alder' : 'wet_scrub')),
        windPhase: rand(ci * 100 + i * 23) * Math.PI * 2 });
    }
  });
  for (let i = 300; i < 380; i++) {
    const wx = 2800 + rand(i * 7) * 8500;
    S2_VEG.push({ wx, layer: 4,
      h: 0.22 + rand(i * 11) * 0.38,
      w: 0.030 + rand(i * 17) * 0.045,
      kind: rand(i * 5) > 0.5 ? 'fg_willow' : 'fg_grass',
      windPhase: rand(i * 23) * Math.PI * 2 });
  }
  for (let i = 400; i < 440; i++) {
    const wx = 10000 + rand(i * 7) * 2500;
    const layer = Math.floor(rand(i * 3) * 3);
    S2_VEG.push({ wx, layer,
      h: 0.04 + rand(i * 11) * 0.08,
      w: 0.022 + rand(i * 17) * 0.025,
      kind: 'meadow_grass', windPhase: rand(i * 23) * Math.PI * 2 });
  }
  for (let i = 450; i < 560; i++) {
    const wx = 3800 + rand(i * 7) * 7000;
    const layer = Math.floor(rand(i * 3) * 2) + 1;
    S2_VEG.push({ wx, layer,
      h: 0.025 + rand(i * 11) * 0.05,
      w: 0.030 + rand(i * 17) * 0.040,
      kind: 'wet_grass', windPhase: rand(i * 23) * Math.PI * 2 });
  }
  S2_VEG.sort((a, b) => a.layer - b.layer);
})();

// ── S2: Water features ──────────────────────────────────────────────────────
const S2_WATER = [];

(function buildS2Water() {
  for (let i = 0; i < 5; i++) {
    S2_WATER.push({ type: 'puddle', wx: 2800 + rand(i * 7) * 1600,
      w: 50 + rand(i * 11) * 80, depth: 0.25 + rand(i * 5) * 0.30 });
  }
  S2_WATER.push({ type: 'channel', wx: 6400, w: 480, channelWidth: 38, depth: 0.90, angle: 0.12 });
  for (let i = 10; i < 22; i++) {
    S2_WATER.push({ type: 'puddle', wx: 5000 + rand(i * 7) * 4500,
      w: 60 + rand(i * 11) * 160, depth: 0.30 + rand(i * 5) * 0.45 });
  }
  S2_WATER.push({ type: 'saturated', wx: 8200, w: 600, depth: 0.40 });
})();

// ── S2: Fog banks ───────────────────────────────────────────────────────────
const S2_FOG = [];
(function buildS2Fog() {
  for (let i = 0; i < 16; i++) {
    S2_FOG.push({
      baseX: rand(i * 13 + 7) * S2_WORLD,
      y: H * (0.32 + rand(i * 7 + 3) * 0.38),
      w: W * (0.4 + rand(i * 11) * 0.8),
      h: H * (0.10 + rand(i * 5 + 1) * 0.22),
      density: 0.08 + rand(i * 9) * 0.16,
      speed: 5 + rand(i * 3 + 2) * 14,
      phase: rand(i * 17) * Math.PI * 2,
      vertical: rand(i * 23) * 3 - 1.5
    });
  }
})();

// ── S2: Distant treeline ────────────────────────────────────────────────────
const S2_DISTANT = [];
(function buildS2Distant() {
  for (let i = 0; i < 30; i++) {
    const r = rand(i * 5);
    S2_DISTANT.push({
      wx: 800 + i * 420 + (rand(i * 7) - 0.5) * 140,
      h: 0.06 + rand(i * 11) * 0.10,
      w: 0.008 + rand(i * 17) * 0.012,
      kind: r > 0.85 ? 'dead' : (r > 0.35 ? 'conifer' : 'deciduous')
    });
  }
})();

// ── S2: Ground height (local wx) ────────────────────────────────────────────
function s2GroundY(wx) {
  const base = H * 0.68;
  const undulation = Math.sin(wx * 0.0008) * 6
                   + Math.sin(wx * 0.0024 + 0.7) * 4
                   + Math.sin(wx * 0.0052 + 1.8) * 2.5
                   + Math.sin(wx * 0.00035 + 3.2) * 10;
  const descent = Math.max(0, (wx - 1500) / 12000) * 28;
  const drainCenter = 6800;
  const drainDist = wx - drainCenter;
  const drainL = drainDist < 0 ? Math.pow(Math.max(0, 1 + drainDist / 3200), 1.8) * 22
                                : Math.pow(Math.max(0, 1 - drainDist / 2400), 2.2) * 22;
  const dep1 = Math.pow(Math.max(0, 1 - Math.abs(wx - 4200) / 800), 2) * 8;
  const dep2 = Math.pow(Math.max(0, 1 - Math.abs(wx - 9400) / 600), 2) * 6;
  const hummock = Math.sin(wx * 0.018 + 0.3) * 1.8 + Math.sin(wx * 0.031 + 1.1) * 1.2;
  return base + undulation + descent + drainL + dep1 + dep2 + hummock;
}

// ── S2: Sky colors ──────────────────────────────────────────────────────────
function s2SkyColors() {
  const close = fadeIn(0.18, 0.65, p2);
  return {
    topR: lerp(92, 68, close), topG: lerp(98, 74, close), topB: lerp(102, 76, close),
    botR: lerp(128, 88, close), botG: lerp(132, 94, close), botB: lerp(130, 90, close),
    horizon: H * 0.70
  };
}

// ── S2: Fog density query ───────────────────────────────────────────────────
function s2FogDensityAt(screenX, screenY, now) {
  let total = 0;
  S2_FOG.forEach(bank => {
    const drift = now * 0.001 * bank.speed;
    const fogCenterWx = bank.baseX + drift + Math.sin(now * 0.00018 + bank.phase) * 160;
    const wrappedWx = ((fogCenterWx % (S2_WORLD * 1.5)) + S2_WORLD * 1.5) % (S2_WORLD * 1.5) - S2_WORLD * 0.25;
    const fogCenterSx = wrappedWx - s2sx;
    const vy = bank.y + Math.sin(now * 0.0003 + bank.phase) * bank.vertical * 10;
    const dx = (screenX - fogCenterSx) / (bank.w * 0.5);
    const dy = (screenY - vy) / (bank.h * 0.5);
    const dist = dx * dx + dy * dy;
    if (dist < 1) total += bank.density * (1 - dist) * (1 - dist);
  });
  return Math.min(total, 0.45);
}

// ── S2: Wind strength ───────────────────────────────────────────────────────
function s2WindStr(now) {
  return Math.sin(now * 0.0004) * 0.5 + Math.sin(now * 0.00095) * 0.3 + 0.2;
}

// ── S2: Distant treeline ────────────────────────────────────────────────────
function s2DrawDistantTreeline(now) {
  const vis = Math.max(
    fadeOut(0.22, 0.42, p2) * fadeIn(0.04, 0.10, p2),
    window01(0.76, 0.82, 0.88, 0.94, p2) * 0.6
  );
  if (vis < 0.006) return;

  const off = s2sx * 0.04;
  S2_DISTANT.forEach(dt => {
    const sx = dt.wx - off;
    if (sx < -40 || sx > W + 40) return;
    const baseY = H * 0.48 + Math.sin((sx + off) * 0.0004) * 12;
    const th = dt.h * H;
    const fogA = s2FogDensityAt(sx, baseY, now);
    const alpha = vis * 0.35 * Math.max(1 - fogA * 3, 0.05) * sceneAlpha;
    if (alpha < 0.01) return;
    ctx.globalAlpha = alpha;

    if (dt.kind === 'dead') {
      ctx.strokeStyle = '#4a4842';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(sx, baseY); ctx.lineTo(sx + 1, baseY - th); ctx.stroke();
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(sx, baseY - th * 0.6);
      ctx.lineTo(sx + (rand(dt.wx) > 0.5 ? 6 : -6), baseY - th * 0.68);
      ctx.stroke();
    } else if (dt.kind === 'conifer') {
      const tw = dt.w * W * 0.7;
      ctx.fillStyle = '#364036';
      ctx.beginPath();
      ctx.moveTo(sx, baseY - th); ctx.lineTo(sx - tw * 0.5, baseY - th * 0.30); ctx.lineTo(sx + tw * 0.5, baseY - th * 0.30);
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(sx, baseY - th * 0.65); ctx.lineTo(sx - tw * 0.65, baseY - th * 0.05); ctx.lineTo(sx + tw * 0.65, baseY - th * 0.05);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#2a2e24'; ctx.fillRect(sx - 1, baseY - th * 0.08, 2, th * 0.08);
    } else {
      const tw = dt.w * W * 0.5;
      ctx.fillStyle = '#3a4238';
      ctx.beginPath();
      ctx.moveTo(sx - tw, baseY - th * 0.35);
      ctx.quadraticCurveTo(sx - tw * 0.8, baseY - th * 0.95, sx, baseY - th);
      ctx.quadraticCurveTo(sx + tw * 0.8, baseY - th * 0.95, sx + tw, baseY - th * 0.35);
      ctx.quadraticCurveTo(sx + tw * 0.5, baseY - th * 0.25, sx, baseY - th * 0.28);
      ctx.quadraticCurveTo(sx - tw * 0.5, baseY - th * 0.25, sx - tw, baseY - th * 0.35);
      ctx.fill();
      ctx.fillStyle = '#2a2e26'; ctx.fillRect(sx - 1, baseY - th * 0.30, 2, th * 0.30);
    }
    ctx.globalAlpha = sceneAlpha;
  });

  // Distant horizon band
  ctx.fillStyle = `rgba(62,68,60,${vis * 0.25 * sceneAlpha})`;
  ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = -8; x <= W + 8; x += 6) {
    const wx = x + off;
    const y = H * 0.52 + Math.sin(wx * 0.00045) * 16 + Math.sin(wx * 0.0014 + 1.4) * 8;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
}

// ── S2: Fog ─────────────────────────────────────────────────────────────────
function s2DrawFog(now) {
  const fogPresence = window01(0.12, 0.24, 0.78, 0.90, p2);
  if (fogPresence < 0.005) return;
  S2_FOG.forEach(bank => {
    const drift = now * 0.001 * bank.speed;
    const fogCenterWx = bank.baseX + drift + Math.sin(now * 0.00018 + bank.phase) * 160;
    const wrappedWx = ((fogCenterWx % (S2_WORLD * 1.5)) + S2_WORLD * 1.5) % (S2_WORLD * 1.5) - S2_WORLD * 0.25;
    const sx = wrappedWx - s2sx;
    if (sx < -bank.w * 0.6 || sx > W + bank.w * 0.6) return;
    const vy = bank.y + Math.sin(now * 0.0003 + bank.phase) * bank.vertical * 10;
    const alpha = bank.density * fogPresence * sceneAlpha;
    const rg = ctx.createRadialGradient(sx, vy, 0, sx, vy, Math.max(bank.w, bank.h) * 0.5);
    rg.addColorStop(0,    `rgba(118,124,116,${alpha * 0.85})`);
    rg.addColorStop(0.35, `rgba(108,114,106,${alpha * 0.5})`);
    rg.addColorStop(0.65, `rgba(98,104,96,${alpha * 0.2})`);
    rg.addColorStop(1,    'rgba(90,96,88,0)');
    ctx.fillStyle = rg;
    ctx.beginPath();
    ctx.ellipse(sx, vy, bank.w * 0.5, bank.h * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();
  });
}

// ── S2: Water features ──────────────────────────────────────────────────────
function s2DrawWater(now) {
  const waterVis = fadeIn(0.18, 0.40, p2);
  if (waterVis < 0.004) return;
  const sa = sceneAlpha;

  S2_WATER.forEach(wf => {
    const sx = wf.wx - s2sx;

    if (wf.type === 'puddle') {
      if (sx < -wf.w || sx > W + wf.w) return;
      const gy = s2GroundY(wf.wx);
      const poolH = 4 + wf.depth * 10;
      const alpha = waterVis * wf.depth * 0.62 * sa;
      const rg = ctx.createLinearGradient(0, gy - 2, 0, gy + poolH);
      rg.addColorStop(0,   `rgba(62,72,86,${alpha * 0.45})`);
      rg.addColorStop(0.4, `rgba(50,62,78,${alpha * 0.72})`);
      rg.addColorStop(0.7, `rgba(44,56,72,${alpha * 0.75})`);
      rg.addColorStop(1,   `rgba(52,62,74,${alpha * 0.35})`);
      ctx.fillStyle = rg;
      ctx.beginPath(); ctx.ellipse(sx, gy, wf.w / 2, poolH, 0, 0, Math.PI * 2); ctx.fill();
      const reflAlpha = alpha * 0.15;
      ctx.fillStyle = `rgba(98,108,120,${reflAlpha})`;
      ctx.beginPath();
      ctx.ellipse(sx + Math.sin(now * 0.0003 + wf.wx * 0.01) * 4, gy - poolH * 0.1, wf.w * 0.22, poolH * 0.25, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = `rgba(82,94,108,${alpha * 0.22})`;
      ctx.lineWidth = 0.6;
      for (let r = 0; r < 3; r++) {
        const rx = sx + Math.sin(now * 0.0004 + r * 2.3 + wf.wx * 0.01) * wf.w * 0.18;
        const rw = 5 + rand(wf.wx + r) * 12;
        ctx.beginPath();
        ctx.moveTo(rx - rw, gy + rand(r + wf.wx) * poolH * 0.3);
        ctx.quadraticCurveTo(rx, gy + rand(r + wf.wx) * poolH * 0.3 - 0.8, rx + rw, gy + rand(r + wf.wx) * poolH * 0.3 + 0.3);
        ctx.stroke();
      }
    }

    else if (wf.type === 'channel') {
      if (sx < -wf.w * 0.7 || sx > W + wf.w * 0.7) return;
      const channelVis = window01(0.36, 0.42, 0.58, 0.66, p2);
      if (channelVis < 0.01) return;
      const gy = s2GroundY(wf.wx);
      const cw = wf.channelWidth;
      const channelAlpha = channelVis * 0.80 * sa;
      const cwg = ctx.createLinearGradient(0, gy - 6, 0, gy + 8);
      cwg.addColorStop(0,    `rgba(50,60,74,${channelAlpha * 0.30})`);
      cwg.addColorStop(0.25, `rgba(40,52,68,${channelAlpha * 0.78})`);
      cwg.addColorStop(0.55, `rgba(36,48,64,${channelAlpha * 0.82})`);
      cwg.addColorStop(0.8,  `rgba(38,50,66,${channelAlpha * 0.75})`);
      cwg.addColorStop(1,    `rgba(46,56,68,${channelAlpha * 0.32})`);
      ctx.fillStyle = cwg;

      ctx.beginPath();
      const channelLeft = sx - wf.w * 0.4;
      const channelRight = sx + wf.w * 0.4;
      ctx.moveTo(channelLeft, gy - cw * 0.4 + wf.angle * (channelLeft - sx));
      for (let x = channelLeft; x <= channelRight; x += 8) {
        const irregularity = Math.sin(x * 0.02 + 1.3) * 1.5 + Math.sin(x * 0.05) * 0.8;
        ctx.lineTo(x, gy - cw * 0.4 + wf.angle * (x - sx) + irregularity);
      }
      for (let x = channelRight; x >= channelLeft; x -= 8) {
        const irregularity = Math.sin(x * 0.02 + 2.7) * 1.5 + Math.sin(x * 0.048 + 0.5) * 0.8;
        ctx.lineTo(x, gy + cw * 0.6 + wf.angle * (x - sx) + irregularity);
      }
      ctx.closePath(); ctx.fill();

      const reflectAlpha = channelAlpha * 0.20;
      ctx.fillStyle = `rgba(92,104,118,${reflectAlpha})`;
      ctx.beginPath();
      for (let x = channelLeft + 20; x <= channelRight - 20; x += 6) {
        const ry = gy + wf.angle * (x - sx) + Math.sin(now * 0.0003 + x * 0.008) * 1.2;
        if (x === channelLeft + 20) ctx.moveTo(x, ry); else ctx.lineTo(x, ry);
      }
      for (let x = channelRight - 20; x >= channelLeft + 20; x -= 6) {
        const ry = gy + wf.angle * (x - sx) + 3 + Math.sin(now * 0.0003 + x * 0.008 + 0.5) * 1.2;
        ctx.lineTo(x, ry);
      }
      ctx.closePath(); ctx.fill();

      const fogReflect = s2FogDensityAt(sx, gy, now);
      if (fogReflect > 0.02) {
        ctx.fillStyle = `rgba(88,98,110,${fogReflect * channelAlpha * 0.45})`;
        ctx.beginPath();
        ctx.ellipse(sx + Math.sin(now * 0.0002) * 30, gy + 2, 60 + fogReflect * 200, 4, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.strokeStyle = `rgba(76,88,102,${channelAlpha * 0.25})`;
      ctx.lineWidth = 0.6;
      for (let r = 0; r < 5; r++) {
        const rx = sx + (rand(r * 17) - 0.5) * wf.w * 0.5;
        const ry = gy + wf.angle * (rx - sx) + Math.sin(now * 0.0005 + r * 1.7) * 1.5;
        const rw = 8 + rand(r * 7) * 15;
        const drift = now * 0.003 + r * 40;
        ctx.beginPath();
        ctx.moveTo(rx - rw + Math.sin(drift * 0.01) * 3, ry);
        ctx.quadraticCurveTo(rx, ry - 0.6, rx + rw + Math.sin(drift * 0.01) * 3, ry + 0.3);
        ctx.stroke();
      }

      for (let v = 0; v < 4; v++) {
        const vx = sx + (rand(v * 13 + 77) - 0.5) * wf.w * 0.3;
        const vy = gy + wf.angle * (vx - sx);
        const vh = 8 + rand(v * 7 + 33) * 14;
        ctx.fillStyle = `rgba(38,48,34,${channelAlpha * 0.6})`;
        for (let r = 0; r < 3; r++) {
          const rx = vx + (rand(v * 100 + r * 7) - 0.5) * 6;
          const lean2 = (rand(v * 100 + r * 11) - 0.5) * 4 + Math.sin(now * 0.001 + v + r) * 1.5;
          ctx.beginPath();
          ctx.moveTo(rx, vy + 2);
          ctx.quadraticCurveTo(rx + lean2 * 0.4, vy - vh * 0.5, rx + lean2, vy - vh);
          ctx.lineTo(rx + lean2 + 0.8, vy - vh);
          ctx.quadraticCurveTo(rx + lean2 * 0.4 + 0.8, vy - vh * 0.5, rx + 0.8, vy + 2);
          ctx.fill();
        }
      }

      ctx.fillStyle = `rgba(56,54,44,${channelAlpha * 0.3})`;
      for (let x = channelLeft + 10; x < channelRight - 10; x += 14) {
        const yOff = wf.angle * (x - sx);
        ctx.fillRect(x, gy - cw * 0.4 + yOff - 2 + rand(x) * 2, 8, 2);
        ctx.fillRect(x + 3, gy + cw * 0.6 + yOff + rand(x + 99) * 2, 7, 1.5);
      }
    }

    else if (wf.type === 'saturated') {
      if (sx < -wf.w || sx > W + wf.w) return;
      const satVis = waterVis * wf.depth * 0.50 * sa;
      if (satVis < 0.01) return;
      const gy = s2GroundY(wf.wx);
      const sg = ctx.createRadialGradient(sx, gy, 0, sx, gy, wf.w * 0.5);
      sg.addColorStop(0,   `rgba(50,60,72,${satVis * 0.40})`);
      sg.addColorStop(0.4, `rgba(46,56,66,${satVis * 0.28})`);
      sg.addColorStop(0.7, `rgba(42,50,60,${satVis * 0.14})`);
      sg.addColorStop(1,   'rgba(38,46,54,0)');
      ctx.fillStyle = sg;
      ctx.fillRect(sx - wf.w * 0.5, gy - 6, wf.w, 14);
    }
  });
}

// ── S2: Fallen trunk ────────────────────────────────────────────────────────
function s2DrawFallenTrunk(now) {
  const trunkWx = 6650;
  const sx = trunkWx - s2sx;
  if (sx < -400 || sx > W + 400) return;
  const vis = window01(0.32, 0.40, 0.62, 0.72, p2);
  if (vis < 0.01) return;
  const fogOcc = s2FogDensityAt(sx, s2GroundY(trunkWx), now);
  const alpha = vis * (1 - fogOcc * 0.65) * sceneAlpha;
  if (alpha < 0.01) return;

  const gy = s2GroundY(trunkWx);
  const trunkLen = 180, trunkAngle = -0.08;
  const baseDiam = 11, tipDiam = 3, sinkY = 6;
  const x0 = sx - trunkLen * 0.45, y0 = gy + trunkAngle * trunkLen * 0.45 + sinkY;
  const x1 = sx + trunkLen * 0.55, y1 = gy - trunkAngle * trunkLen * 0.55 + sinkY;
  const steps = 12;

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = 'rgb(36,34,28)';
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const px = x0 + (x1 - x0) * t, py = y0 + (y1 - y0) * t;
    const radius = (baseDiam + (tipDiam - baseDiam) * t) * 0.5;
    const bulge = Math.sin(t * Math.PI) * 1.5;
    if (i === 0) ctx.moveTo(px, py - radius - bulge); else ctx.lineTo(px, py - radius - bulge);
  }
  for (let i = steps; i >= 0; i--) {
    const t = i / steps;
    const px = x0 + (x1 - x0) * t, py = y0 + (y1 - y0) * t;
    const radius = (baseDiam + (tipDiam - baseDiam) * t) * 0.5;
    ctx.lineTo(px, py + radius + Math.sin(t * Math.PI) * 1.0);
  }
  ctx.closePath(); ctx.fill();

  ctx.fillStyle = 'rgba(48,46,38,0.40)';
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const px = x0 + (x1 - x0) * t, py = y0 + (y1 - y0) * t;
    const radius = (baseDiam + (tipDiam - baseDiam) * t) * 0.5;
    if (i === 0) ctx.moveTo(px, py - radius - Math.sin(t * Math.PI) * 1.5);
    else ctx.lineTo(px, py - radius - Math.sin(t * Math.PI) * 1.5);
  }
  for (let i = steps; i >= 0; i--) {
    const t = i / steps;
    const px = x0 + (x1 - x0) * t, py = y0 + (y1 - y0) * t;
    ctx.lineTo(px, py - 1);
  }
  ctx.closePath(); ctx.fill();

  ctx.strokeStyle = 'rgb(32,30,24)'; ctx.lineCap = 'round';
  [{t:0.20,len:9,angle:-1.0},{t:0.48,len:6,angle:-1.2},{t:0.72,len:7,angle:-0.7}].forEach(s => {
    const bx = x0 + (x1 - x0) * s.t, by = y0 + (y1 - y0) * s.t;
    const r = (baseDiam + (tipDiam - baseDiam) * s.t) * 0.5;
    ctx.lineWidth = 1.5 + (1 - s.t) * 1.5;
    ctx.beginPath(); ctx.moveTo(bx, by - r);
    ctx.lineTo(bx + Math.cos(s.angle) * s.len, by - r + Math.sin(s.angle) * s.len);
    ctx.stroke();
  });

  ctx.fillStyle = 'rgba(34,42,30,0.30)';
  for (let m = 0; m < 3; m++) {
    const mt = 0.20 + rand(m * 17 + 77) * 0.55;
    const mx = x0 + (x1 - x0) * mt, my = y0 + (y1 - y0) * mt - 2;
    ctx.beginPath(); ctx.ellipse(mx, my, 5 + rand(m * 11 + 33) * 10, 2 + rand(m * 7 + 55) * 3, trunkAngle, 0, Math.PI * 2); ctx.fill();
  }

  ctx.fillStyle = `rgba(30,40,26,${alpha * 0.50 / sceneAlpha})`;
  for (let g = 0; g < 5; g++) {
    const gt = 0.08 + rand(g * 13 + 41) * 0.82;
    const gx = x0 + (x1 - x0) * gt + (rand(g * 7) - 0.5) * 12;
    const grassH = 8 + rand(g * 11 + 23) * 14;
    const lean2 = (rand(g * 19) - 0.5) * 5 + Math.sin(now * 0.0008 + g * 1.3) * 1.5;
    ctx.beginPath();
    ctx.moveTo(gx, gy + 2);
    ctx.quadraticCurveTo(gx + lean2 * 0.4, gy - grassH * 0.5, gx + lean2, gy - grassH);
    ctx.lineTo(gx + lean2 + 0.7, gy - grassH);
    ctx.quadraticCurveTo(gx + lean2 * 0.4 + 0.7, gy - grassH * 0.5, gx + 0.7, gy + 2);
    ctx.fill();
  }
  ctx.restore();
}

// ── S2: Single vegetation element ───────────────────────────────────────────
function s2DrawOneVeg(v, now) {
  const sx = v.wx - s2sx;
  if (sx < -300 || sx > W + 300) return;

  const gY = s2GroundY(v.wx);
  const vh = v.h * H, vw = v.w * W;
  const dep = Math.min(v.layer, 3) / 3;
  const wet = fadeIn(0.22, 0.60, p2);
  const windS = 0.6 + Math.sin(now * 0.0004 + v.windPhase) * 0.4;
  const windLean = Math.sin(now * 0.0008 + v.windPhase) * windS * 3
                 + Math.sin(now * 0.0019 + v.windPhase * 1.7) * windS * 1.5;

  if (v.kind === 'meadow_grass') {
    const r = lerp(72,52,wet)|0, g = lerp(78,60,wet)|0, b = lerp(58,42,wet)|0;
    ctx.fillStyle = `rgba(${r},${g},${b},0.55)`;
    for (let bl = 0; bl < 5; bl++) {
      const bx = sx - vw * 0.4 + bl * vw * 0.2;
      const lean2 = (rand(v.wx + bl * 7) - 0.5) * vw * 0.3 + windLean;
      ctx.beginPath();
      ctx.moveTo(bx, gY);
      ctx.quadraticCurveTo(bx + lean2 * 0.5, gY - vh * 0.6, bx + lean2, gY - vh);
      ctx.quadraticCurveTo(bx + lean2 * 0.5 + 1.2, gY - vh * 0.6, bx + 1.5, gY);
      ctx.fill();
    }
  } else if (v.kind === 'tall_grass') {
    const r = lerp(64,44,wet)|0, g = lerp(72,54,wet)|0, b = lerp(50,36,wet)|0;
    ctx.fillStyle = `rgba(${r},${g},${b},0.62)`;
    for (let bl = 0; bl < 7; bl++) {
      const bx = sx - vw * 0.45 + bl * vw * 0.15;
      const lean2 = (rand(v.wx + bl * 7) - 0.5) * vw * 0.35 + windLean * 1.5;
      const bladeH = vh * (0.7 + rand(v.wx + bl * 3) * 0.3);
      ctx.beginPath(); ctx.moveTo(bx, gY);
      ctx.quadraticCurveTo(bx + lean2 * 0.4, gY - bladeH * 0.5, bx + lean2, gY - bladeH);
      ctx.lineTo(bx + lean2 + 1, gY - bladeH);
      ctx.quadraticCurveTo(bx + lean2 * 0.4 + 1, gY - bladeH * 0.5, bx + 1.5, gY);
      ctx.fill();
    }
  } else if (v.kind === 'wet_grass') {
    const r = lerp(54,38,wet)|0, g = lerp(64,48,wet)|0, b = lerp(40,30,wet)|0;
    ctx.fillStyle = `rgba(${r},${g},${b},0.48)`;
    for (let bl = 0; bl < 6; bl++) {
      const bx = sx - vw * 0.45 + bl * vw * 0.18;
      const lean2 = (rand(v.wx + bl * 5) - 0.5) * vw * 0.2 + windLean * 0.8;
      ctx.beginPath(); ctx.moveTo(bx, gY);
      ctx.quadraticCurveTo(bx + lean2 * 0.4, gY - vh * 0.5, bx + lean2, gY - vh);
      ctx.lineTo(bx + lean2 + 1, gY - vh);
      ctx.quadraticCurveTo(bx + lean2 * 0.4 + 1, gY - vh * 0.5, bx + 1.5, gY);
      ctx.fill();
    }
  } else if (v.kind === 'willow') {
    const r = lerp(44,24,dep)|0, g2 = lerp(54,34,dep)|0, b2 = lerp(36,20,dep)|0;
    ctx.strokeStyle = `rgb(${(r*0.55)|0},${(g2*0.45)|0},${(b2*0.45)|0})`;
    ctx.lineWidth = Math.max(1.5, vw * 0.06);
    const stems = 2 + Math.floor(rand(v.wx * 3) * 3);
    for (let s = 0; s < stems; s++) {
      const sLean = (rand(v.wx + s * 11) - 0.5) * vw * 0.4 + windLean * 0.3;
      ctx.beginPath();
      ctx.moveTo(sx + (s - stems / 2) * 3, gY);
      ctx.quadraticCurveTo(sx + sLean * 0.4, gY - vh * 0.5, sx + sLean, gY - vh * (0.7 + rand(v.wx + s) * 0.3));
      ctx.stroke();
    }
    ctx.fillStyle = `rgba(${r},${g2},${b2},0.75)`;
    ctx.beginPath();
    ctx.ellipse(sx + windLean * 0.2, gY - vh * 0.72, vw * 0.55, vh * 0.35, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = `rgba(${r},${g2+6},${b2},0.35)`;
    ctx.lineWidth = 0.7;
    for (let f = 0; f < 5; f++) {
      const fx = sx + (rand(v.wx + f * 17) - 0.5) * vw * 0.9 + windLean * 0.4;
      const fy = gY - vh * (0.55 + rand(v.wx + f * 3) * 0.22);
      ctx.beginPath(); ctx.moveTo(fx, fy);
      ctx.quadraticCurveTo(fx + windLean * 0.3 + (rand(f + v.wx) - 0.5) * 10, fy + vh * 0.18, fx + windLean * 0.5 + (rand(f * 3 + v.wx) - 0.5) * 6, fy + vh * 0.30);
      ctx.stroke();
    }
  } else if (v.kind === 'alder') {
    const r = lerp(40,20,dep)|0, g2 = lerp(50,30,dep)|0, b2 = lerp(34,18,dep)|0;
    ctx.strokeStyle = `rgb(${(r*0.50)|0},${(g2*0.42)|0},${(b2*0.38)|0})`;
    ctx.lineWidth = Math.max(1.5, vw * 0.07);
    ctx.beginPath(); ctx.moveTo(sx, gY); ctx.lineTo(sx + windLean * 0.1, gY - vh * 0.55); ctx.stroke();
    if (rand(v.wx * 5) > 0.35) {
      const leanDir = rand(v.wx * 9) > 0.5 ? 1 : -1;
      ctx.lineWidth = Math.max(1, vw * 0.04);
      ctx.beginPath();
      ctx.moveTo(sx, gY - vh * 0.22);
      ctx.quadraticCurveTo(sx + leanDir * vw * 0.15 + windLean * 0.2, gY - vh * 0.48, sx + leanDir * vw * 0.2 + windLean * 0.3, gY - vh * 0.68);
      ctx.stroke();
    }
    ctx.fillStyle = `rgba(${r},${g2},${b2},0.78)`;
    ctx.beginPath();
    ctx.ellipse(sx + windLean * 0.15, gY - vh * 0.72, vw * 0.42, vh * 0.32, 0, 0, Math.PI * 2);
    ctx.fill();
  } else if (v.kind === 'wet_scrub') {
    const r = lerp(42,26,dep)|0, g2 = lerp(52,36,dep)|0, b2 = lerp(36,22,dep)|0;
    ctx.fillStyle = `rgba(${r},${g2},${b2},0.68)`;
    ctx.beginPath();
    ctx.ellipse(sx + windLean * 0.1, gY - vh * 0.48, vw * 0.52, vh * 0.50, 0, 0, Math.PI * 2);
    ctx.fill();
  } else if (v.kind === 's2conifer') {
    const r = lerp(32,16,dep)|0, g2 = lerp(42,24,dep)|0, b2 = lerp(30,16,dep)|0;
    ctx.strokeStyle = `rgb(${(r*0.40)|0},${(g2*0.35)|0},${(b2*0.30)|0})`;
    ctx.lineWidth = Math.max(1.5, vw * 0.05);
    ctx.beginPath(); ctx.moveTo(sx, gY); ctx.lineTo(sx + windLean * 0.08, gY - vh); ctx.stroke();
    ctx.fillStyle = `rgba(${r},${g2},${b2},0.82)`;
    const tipX = sx + windLean * 0.12, tipY = gY - vh;
    const midY = gY - vh * 0.52, baseW = vw * 0.38, midW = vw * 0.48;
    ctx.beginPath();
    ctx.moveTo(tipX, tipY);
    ctx.lineTo(tipX - baseW * 0.6 + windLean * 0.05, midY);
    ctx.lineTo(tipX + baseW * 0.6 + windLean * 0.05, midY);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = `rgba(${r-4|0},${g2-4|0},${b2-3|0},0.78)`;
    ctx.beginPath();
    ctx.moveTo(tipX, midY + vh * 0.06);
    ctx.lineTo(sx - midW * 0.7 + windLean * 0.04, gY - vh * 0.12);
    ctx.lineTo(sx + midW * 0.7 + windLean * 0.04, gY - vh * 0.12);
    ctx.closePath(); ctx.fill();
  } else if (v.kind === 'fg_willow') {
    const fgAlpha = window01(0.16, 0.26, 0.74, 0.86, p2) * 0.75 * sceneAlpha;
    if (fgAlpha < 0.02) return;
    ctx.globalAlpha = fgAlpha;
    ctx.strokeStyle = 'rgb(18,22,14)';
    ctx.lineWidth = Math.max(3, vw * 0.12);
    const stems = 2 + Math.floor(rand(v.wx * 3) * 2);
    for (let s = 0; s < stems; s++) {
      const sLean = (rand(v.wx + s * 11) - 0.5) * vw * 0.5 + windLean * 0.5;
      ctx.beginPath();
      ctx.moveTo(sx + (s - stems / 2) * 6, gY + 20);
      ctx.quadraticCurveTo(sx + sLean * 0.3, gY - vh * 0.4, sx + sLean, gY - vh * (0.6 + rand(v.wx + s) * 0.4));
      ctx.stroke();
    }
    ctx.fillStyle = 'rgba(14,20,12,0.80)';
    ctx.beginPath();
    ctx.ellipse(sx + windLean * 0.3, gY - vh * 0.65, vw * 0.7, vh * 0.40, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(16,22,12,0.55)'; ctx.lineWidth = 1.2;
    for (let f = 0; f < 8; f++) {
      const fx = sx + (rand(v.wx + f * 17) - 0.5) * vw * 1.2 + windLean * 0.5;
      const fy = gY - vh * (0.40 + rand(v.wx + f * 3) * 0.30);
      ctx.beginPath(); ctx.moveTo(fx, fy);
      ctx.quadraticCurveTo(fx + windLean * 0.4 + (rand(f + v.wx) - 0.5) * 16, fy + vh * 0.20,
                           fx + windLean * 0.6 + (rand(f * 3 + v.wx) - 0.5) * 10, fy + vh * 0.35);
      ctx.stroke();
    }
    ctx.globalAlpha = sceneAlpha;
  } else if (v.kind === 'fg_grass') {
    const fgAlpha = window01(0.16, 0.26, 0.74, 0.86, p2) * 0.65 * sceneAlpha;
    if (fgAlpha < 0.02) return;
    ctx.globalAlpha = fgAlpha;
    ctx.fillStyle = 'rgba(28,36,22,0.70)';
    for (let bl = 0; bl < 9; bl++) {
      const bx = sx - vw * 0.6 + bl * vw * 0.15;
      const lean2 = (rand(v.wx + bl * 7) - 0.5) * vw * 0.5 + windLean * 2.0;
      const bladeH = vh * (0.6 + rand(v.wx + bl * 3) * 0.4);
      ctx.beginPath(); ctx.moveTo(bx, gY + 30);
      ctx.quadraticCurveTo(bx + lean2 * 0.4, gY - bladeH * 0.4, bx + lean2, gY - bladeH);
      ctx.lineTo(bx + lean2 + 2, gY - bladeH);
      ctx.quadraticCurveTo(bx + lean2 * 0.4 + 2, gY - bladeH * 0.4, bx + 2.5, gY + 30);
      ctx.fill();
    }
    ctx.globalAlpha = sceneAlpha;
  }
}

// ── S2: Overhead vegetation ─────────────────────────────────────────────────
function s2DrawOverheadVegetation(now) {
  const overhead = window01(0.30, 0.42, 0.68, 0.80, p2);
  if (overhead < 0.004) return;
  const sa = sceneAlpha;
  const baseAlpha = overhead * 0.55 * sa;

  const tg = ctx.createLinearGradient(0, 0, 0, H * 0.45);
  tg.addColorStop(0,   `rgba(14,18,12,${baseAlpha * 0.7})`);
  tg.addColorStop(0.4, `rgba(18,24,16,${baseAlpha * 0.35})`);
  tg.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.fillStyle = tg;
  ctx.fillRect(0, 0, W, H * 0.45);

  ctx.fillStyle = `rgba(12,16,10,${overhead * 0.40 * sa})`;
  const branchOffset = s2sx * 0.15;
  const ws = s2WindStr(now);
  for (let i = 0; i < 8; i++) {
    const bx = (i * W * 0.18 + rand(i * 7) * W * 0.12 - branchOffset * (0.8 + rand(i * 3) * 0.4)) % (W * 1.4) - W * 0.2;
    const by = H * (0.02 + rand(i * 11) * 0.12);
    const bw = W * (0.08 + rand(i * 13) * 0.15);
    const bh = H * (0.03 + rand(i * 17) * 0.06);
    ctx.beginPath();
    ctx.ellipse(bx + ws * 4, by, bw, bh, rand(i * 19) * 0.3, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ── S2: Side enclosure ──────────────────────────────────────────────────────
function s2DrawSideEnclosure() {
  const enclosure = window01(0.28, 0.40, 0.70, 0.82, p2);
  if (enclosure < 0.004) return;
  const sa = sceneAlpha;

  const leftStr = enclosure * 1.1;
  const lg = ctx.createLinearGradient(0, 0, W * 0.22, 0);
  lg.addColorStop(0, `rgba(16,22,14,${Math.min(leftStr, 1) * 0.45 * sa})`);
  lg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = lg;
  ctx.fillRect(0, H * 0.15, W * 0.22, H * 0.70);

  const rightStr = enclosure * 0.85;
  const rg = ctx.createLinearGradient(W, 0, W * 0.80, 0);
  rg.addColorStop(0, `rgba(16,22,14,${rightStr * 0.40 * sa})`);
  rg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = rg;
  ctx.fillRect(W * 0.80, H * 0.18, W * 0.20, H * 0.65);

  const bottomStr = window01(0.32, 0.44, 0.66, 0.78, p2);
  if (bottomStr > 0.01) {
    const bg = ctx.createLinearGradient(0, H, 0, H * 0.76);
    bg.addColorStop(0, `rgba(14,18,12,${bottomStr * 0.38 * sa})`);
    bg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = bg;
    ctx.fillRect(0, H * 0.76, W, H * 0.24);
  }
}

// ── S2: Atmosphere ──────────────────────────────────────────────────────────
function s2DrawAtmosphere() {
  const sa = sceneAlpha;
  const haze = window01(0.20, 0.35, 0.70, 0.85, p2);
  if (haze > 0.004) {
    const hg = ctx.createLinearGradient(0, H * 0.35, 0, H * 0.65);
    hg.addColorStop(0, 'rgba(0,0,0,0)');
    hg.addColorStop(0.5, `rgba(88,96,90,${haze * 0.08 * sa})`);
    hg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = hg;
    ctx.fillRect(0, H * 0.35, W, H * 0.30);
  }
  const groundMoist = fadeIn(0.30, 0.55, p2) * fadeOut(0.75, 0.88, p2);
  if (groundMoist > 0.004) {
    const mg = ctx.createLinearGradient(0, H * 0.64, 0, H * 0.76);
    mg.addColorStop(0, 'rgba(0,0,0,0)');
    mg.addColorStop(0.5, `rgba(78,86,80,${groundMoist * 0.12 * sa})`);
    mg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = mg;
    ctx.fillRect(0, H * 0.64, W, H * 0.12);
  }
}

// ── S2: Sky corridors ───────────────────────────────────────────────────────
function s2DrawSkyCorridors(now) {
  const vis = window01(0.35, 0.44, 0.62, 0.72, p2) * 0.35;
  if (vis < 0.008) return;
  const sa = sceneAlpha;
  const gaps = [{ wx: 5800, w: 120, h: 0.12 },{ wx: 7200, w: 80, h: 0.08 },{ wx: 8800, w: 150, h: 0.15 }];
  gaps.forEach(gap => {
    const sx = gap.wx - s2sx;
    if (sx < -gap.w || sx > W + gap.w) return;
    const fogAtten = 1 - s2FogDensityAt(sx, H * 0.3, now) * 2;
    const alpha = vis * Math.max(fogAtten, 0.1) * sa;
    const gg = ctx.createRadialGradient(sx, H * 0.28, 0, sx, H * 0.28, gap.w);
    gg.addColorStop(0,   `rgba(128,136,134,${alpha * 0.45})`);
    gg.addColorStop(0.5, `rgba(108,116,114,${alpha * 0.2})`);
    gg.addColorStop(1,   'rgba(0,0,0,0)');
    ctx.fillStyle = gg;
    ctx.fillRect(sx - gap.w, H * 0.1, gap.w * 2, H * gap.h + H * 0.2);
  });
}

// ── S3: Vegetation data ─────────────────────────────────────────────────────
const S3_VEG = [];

(function buildS3Veg() {
  // Dense mixed woodland - early section (heavy, pressing)

  for (let i = 0; i < 180; i++) {
    const wx = 600 + rand(i * 7 + 1) * 5400;
    const layer = Math.floor(rand(i * 3 + 2) * 4);
    const kind = rand(i * 5 + 3);
    // Density weighting: more vegetation in early-to-mid range
    const densityBias = wx < 5000 ? 1.0 : (wx < 9000 ? 0.75 : 0.45);
    if (rand(i * 13) > densityBias) continue;
    // Skip clearing zone — these trees were felled
    if (wx > 3200 && wx < 5600) continue;
    S3_VEG.push({ wx, layer,
      h: 0.12 + rand(i * 11 + 3) * 0.32 + layer * 0.07,
      w: 0.018 + rand(i * 17 + 4) * 0.028,
      kind: kind > 0.65 ? 'birch' : (kind > 0.35 ? 'alder' : 'willow'),
      windPhase: rand(i * 23) * Math.PI * 2 });

  // Wet understory - dense early, thinning
  for (let i = 200; i < 340; i++) {
    const wx = 800 + rand(i * 7) * 7000;

    S3_VEG.push({ wx, layer,
      h: 0.025 + rand(i * 11) * 0.055,

  for (let i = 500; i < 555; i++) {

      windPhase: rand(i * 23) * Math.PI * 2 });
