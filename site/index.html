const S1_FRAGS = [
  { at: 0.29, text: 'lower orchard still producing', done: false },
  { at: 0.51, text: 'wind stronger above the ridge', done: false },
  { at: 0.84, text: 'boundary stones continued north', done: false },
];

const S2_FRAGS = [
  { at: 0.22, text: 'water audible before visible', done: false },
  { at: 0.52, text: 'footing narrowed near the drainage cut', done: false },
  { at: 0.72, text: 'insects thickest over standing water', done: false },
];

const S3_FRAGS = [
  { at: 0.22, text: 'fresh cuts beside older stumps', done: false },
  { at: 0.36, text: 'removal line continued west', done: false },
  { at: 0.68, text: 'grade flattened near the opening', done: false },
];

const S4_FRAGS = [
  { at: 0.24, text: 'visibility dropped along the low ground', done: false },
  { at: 0.52, text: 'fog held after rainfall', done: false },
  { at: 0.68, text: 'ridge visible again for a moment', done: false },
];

let fragPhase = 'idle', fragStart = 0, fragScene = 1;

function triggerFrag(text, scene) {
  fragEl.textContent = text;
  fragPhase = 'in';
  fragStart = performance.now();
  fragScene = scene;
}

function tickFrag(now) {
  if (fragPhase === 'idle') return;
  const el = now - fragStart;
  const col = fragScene === 1 ? 'rgba(212,200,178,' : (fragScene === 2 ? 'rgba(200,198,186,' : (fragScene === 3 ? 'rgba(196,192,180,' : 'rgba(194,196,188,'));
  // S4 fragments partially obscured by perceptual weather — text encountered through conditions
  const baseMaxA = fragScene === 1 ? 0.82 : (fragScene === 2 ? 0.72 : (fragScene === 3 ? 0.68 : 0.64));
  const maxA = fragScene === 4 ? baseMaxA * (1 - s4pw * 0.40) : baseMaxA;
  const fadeInT = fragScene === 1 ? 1500 : (fragScene === 2 ? 2000 : (fragScene === 3 ? 2200 : 2800));
  const holdT = fragScene === 1 ? 3000 : (fragScene === 2 ? 3800 : (fragScene === 3 ? 4000 : 4500));
  const fadeOutT = fragScene === 1 ? 1800 : (fragScene === 2 ? 2400 : (fragScene === 3 ? 2600 : 3000));

  if (fragPhase === 'in') {
    const a = Math.min(el / fadeInT, 1);
    fragEl.style.color = `${col}${smooth(a) * maxA})`;
    if (a >= 1) { fragPhase = 'hold'; fragStart = now; }
  } else if (fragPhase === 'hold') {
    if (el > holdT) { fragPhase = 'out'; fragStart = now; }
  } else {
    const a = Math.max(1 - el / fadeOutT, 0);
    fragEl.style.color = `${col}${smooth(a) * maxA})`;
    if (a <= 0) fragPhase = 'idle';
  }
}

function checkFrags() {
  S1_FRAGS.forEach(f => {
    if (!f.done && p1 >= f.at && p1 < f.at + 0.14 && seamT < 0.7) {
      f.done = true;
      triggerFrag(f.text, 1);
    }
  });
  S2_FRAGS.forEach(f => {
    if (!f.done && p2 >= f.at && p2 < f.at + 0.10 && seamT > 0.3 && seamT2 < 0.7) {
      f.done = true;
      triggerFrag(f.text, 2);
    }
  });
  S3_FRAGS.forEach(f => {
    if (!f.done && p3 >= f.at && p3 < f.at + 0.10 && seamT2 > 0.3 && seamT3 < 0.7) {
      f.done = true;
      triggerFrag(f.text, 3);
    }
  });
  S4_FRAGS.forEach(f => {
    if (!f.done && p4 >= f.at && p4 < f.at + 0.10 && seamT3 > 0.3) {
      f.done = true;
      triggerFrag(f.text, 4);
    }
  });
}


// =============================================================================
// AUDIO — One AudioContext, all channels
// =============================================================================

let ac, s1ForestG, s1WindG, s2WindG, s2WaterG, s2InsectG, s2BirdG, s2DripG;
let s3ForestG, s3WaterG, s3DripG, s3ResonanceG;
let s4WindG, s4DripG, s4RainHissG, s4ForestG;
let audioLive = false, nextBirdTime = 0, nextDripTime = 0, nextS3DripTime = 0, nextS4DripTime = 0;

function bootAudio() {
  if (audioLive) return;
  audioLive = true;
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    const master = ac.createGain();
    master.gain.value = 0.20;
    master.connect(ac.destination);

    const sr = ac.sampleRate, len = sr * 8;
    const buf = ac.createBuffer(1, len, sr);
    const d = buf.getChannelData(0);
    let prev = 0;
    for (let i = 0; i < len; i++) {
      const w = Math.random() * 2 - 1;
      d[i] = (prev + 0.04 * w) / 1.04;
      prev = d[i];
      d[i] *= 3.2;
    }
    const noise = ac.createBufferSource();
    noise.buffer = buf; noise.loop = true;

    // S1: Forest rumble
    s1ForestG = ac.createGain(); s1ForestG.gain.value = 0;
    const ff = ac.createBiquadFilter(); ff.type = 'lowpass'; ff.frequency.value = 260; ff.Q.value = 1.4;
    noise.connect(ff); ff.connect(s1ForestG); s1ForestG.connect(master);

    // S1: Wind
    s1WindG = ac.createGain(); s1WindG.gain.value = 0;
    const s1wf = ac.createBiquadFilter(); s1wf.type = 'bandpass'; s1wf.frequency.value = 680; s1wf.Q.value = 0.45;
    noise.connect(s1wf); s1wf.connect(s1WindG); s1WindG.connect(master);

    // S2: Wind (reduced, distant)
    s2WindG = ac.createGain(); s2WindG.gain.value = 0;
    const s2wf = ac.createBiquadFilter(); s2wf.type = 'bandpass'; s2wf.frequency.value = 420; s2wf.Q.value = 0.30;
    noise.connect(s2wf); s2wf.connect(s2WindG); s2WindG.connect(master);

    // S2: Water
    s2WaterG = ac.createGain(); s2WaterG.gain.value = 0;
    const watf = ac.createBiquadFilter(); watf.type = 'lowpass'; watf.frequency.value = 280; watf.Q.value = 1.4;
    const watf2 = ac.createBiquadFilter(); watf2.type = 'bandpass'; watf2.frequency.value = 180; watf2.Q.value = 0.8;
    noise.connect(watf); watf.connect(watf2); watf2.connect(s2WaterG); s2WaterG.connect(master);

    // S2: Insects
    s2InsectG = ac.createGain(); s2InsectG.gain.value = 0;
    const insF = ac.createBiquadFilter(); insF.type = 'highpass'; insF.frequency.value = 4200; insF.Q.value = 3.0;
    const insF2 = ac.createBiquadFilter(); insF2.type = 'bandpass'; insF2.frequency.value = 4800; insF2.Q.value = 5.0;
    noise.connect(insF); insF.connect(insF2); insF2.connect(s2InsectG); s2InsectG.connect(master);

    // S2: Bird calls
    s2BirdG = ac.createGain(); s2BirdG.gain.value = 0;
    s2BirdG.connect(master);

    // S2: Drips
    s2DripG = ac.createGain(); s2DripG.gain.value = 0;
    s2DripG.connect(master);

    // S3: Dense woodland low rumble
    s3ForestG = ac.createGain(); s3ForestG.gain.value = 0;
    const s3ff = ac.createBiquadFilter(); s3ff.type = 'lowpass'; s3ff.frequency.value = 220; s3ff.Q.value = 1.6;
    noise.connect(s3ff); s3ff.connect(s3ForestG); s3ForestG.connect(master);

    // S3: Water (heavier, closer)
    s3WaterG = ac.createGain(); s3WaterG.gain.value = 0;
    const s3wf1 = ac.createBiquadFilter(); s3wf1.type = 'lowpass'; s3wf1.frequency.value = 240; s3wf1.Q.value = 1.6;
    const s3wf2 = ac.createBiquadFilter(); s3wf2.type = 'bandpass'; s3wf2.frequency.value = 160; s3wf2.Q.value = 1.0;
    noise.connect(s3wf1); s3wf1.connect(s3wf2); s3wf2.connect(s3WaterG); s3WaterG.connect(master);

    // S3: Drips (heavier, more frequent)
    s3DripG = ac.createGain(); s3DripG.gain.value = 0;
    s3DripG.connect(master);

    // S3: Clearing wind (higher, more open air movement through gap)
    s3ResonanceG = ac.createGain(); s3ResonanceG.gain.value = 0;
    const resF = ac.createBiquadFilter(); resF.type = 'bandpass'; resF.frequency.value = 320; resF.Q.value = 1.5;
    noise.connect(resF); resF.connect(s3ResonanceG); s3ResonanceG.connect(master);

    // S4: Soft dampened wind
    s4WindG = ac.createGain(); s4WindG.gain.value = 0;
    const s4wf = ac.createBiquadFilter(); s4wf.type = 'bandpass'; s4wf.frequency.value = 350; s4wf.Q.value = 0.25;
    noise.connect(s4wf); s4wf.connect(s4WindG); s4WindG.connect(master);

    // S4: Forest low rumble (returning)
    s4ForestG = ac.createGain(); s4ForestG.gain.value = 0;
    const s4ff = ac.createBiquadFilter(); s4ff.type = 'lowpass'; s4ff.frequency.value = 200; s4ff.Q.value = 1.4;
    noise.connect(s4ff); s4ff.connect(s4ForestG); s4ForestG.connect(master);

    // S4: Rain hiss (very quiet high-frequency)
    s4RainHissG = ac.createGain(); s4RainHissG.gain.value = 0;
    const s4rf = ac.createBiquadFilter(); s4rf.type = 'highpass'; s4rf.frequency.value = 3200; s4rf.Q.value = 0.6;
    const s4rf2 = ac.createBiquadFilter(); s4rf2.type = 'lowpass'; s4rf2.frequency.value = 6000; s4rf2.Q.value = 0.8;
    noise.connect(s4rf); s4rf.connect(s4rf2); s4rf2.connect(s4RainHissG); s4RainHissG.connect(master);

    // S4: Drips (lighter, more sporadic)
    s4DripG = ac.createGain(); s4DripG.gain.value = 0;
    s4DripG.connect(master);

    // Shared sub drone
    const sub = ac.createOscillator(); sub.type = 'sine'; sub.frequency.value = 40;
    const subG = ac.createGain(); subG.gain.value = 0.025;
    sub.connect(subG); subG.connect(master); sub.start();

    noise.start();
  } catch(e) {}
}

function triggerBirdCall() {
  if (!ac || !s2BirdG) return;
  const t = ac.currentTime;
  const osc = ac.createOscillator();
  const env = ac.createGain();
  if (Math.random() > 0.5) {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(2600 + Math.random() * 1000, t);
    osc.frequency.exponentialRampToValueAtTime(2000 + Math.random() * 600, t + 0.10);
    env.gain.setValueAtTime(0, t);
    env.gain.linearRampToValueAtTime(0.05 + Math.random() * 0.03, t + 0.018);
    env.gain.exponentialRampToValueAtTime(0.001, t + 0.10 + Math.random() * 0.06);
  } else {
    osc.type = 'sine';
    const f1 = 3000 + Math.random() * 600;
    osc.frequency.setValueAtTime(f1, t);
    osc.frequency.setValueAtTime(f1 - 300 - Math.random() * 250, t + 0.08);
    env.gain.setValueAtTime(0, t);
    env.gain.linearRampToValueAtTime(0.04, t + 0.012);
    env.gain.setValueAtTime(0.008, t + 0.06);
    env.gain.linearRampToValueAtTime(0.035, t + 0.09);
    env.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
  }
  osc.connect(env); env.connect(s2BirdG);
  osc.start(t); osc.stop(t + 0.22);
}

function triggerDrip() {
  if (!ac || !s2DripG) return;
  const t = ac.currentTime;
  const osc = ac.createOscillator();
  const env = ac.createGain();
  osc.type = 'sine';
  const freq = 800 + Math.random() * 1200;
  osc.frequency.setValueAtTime(freq, t);
  osc.frequency.exponentialRampToValueAtTime(freq * 0.6, t + 0.04);
  env.gain.setValueAtTime(0, t);
  env.gain.linearRampToValueAtTime(0.06 + Math.random() * 0.04, t + 0.003);
  env.gain.exponentialRampToValueAtTime(0.001, t + 0.04 + Math.random() * 0.03);
  osc.connect(env); env.connect(s2DripG);
  osc.start(t); osc.stop(t + 0.10);
}

function triggerS3Drip() {
  if (!ac || !s3DripG) return;
  const t = ac.currentTime;
  const osc = ac.createOscillator();
  const env = ac.createGain();
  osc.type = 'sine';
  // Heavier, lower drips - closer proximity
  const freq = 600 + Math.random() * 900;
  osc.frequency.setValueAtTime(freq, t);
  osc.frequency.exponentialRampToValueAtTime(freq * 0.5, t + 0.05);
  env.gain.setValueAtTime(0, t);
  env.gain.linearRampToValueAtTime(0.08 + Math.random() * 0.05, t + 0.004);
  env.gain.exponentialRampToValueAtTime(0.001, t + 0.05 + Math.random() * 0.04);
  osc.connect(env); env.connect(s3DripG);
  osc.start(t); osc.stop(t + 0.12);
}

function triggerS4Drip() {
  if (!ac || !s4DripG) return;
  const t = ac.currentTime;
  const osc = ac.createOscillator();
  const env = ac.createGain();
  osc.type = 'sine';
  const freq = 900 + Math.random() * 1100;
  osc.frequency.setValueAtTime(freq, t);
  osc.frequency.exponentialRampToValueAtTime(freq * 0.55, t + 0.035);
  env.gain.setValueAtTime(0, t);
  env.gain.linearRampToValueAtTime(0.05 + Math.random() * 0.03, t + 0.003);
  env.gain.exponentialRampToValueAtTime(0.001, t + 0.035 + Math.random() * 0.025);
  osc.connect(env); env.connect(s4DripG);
  osc.start(t); osc.stop(t + 0.08);
}

function tickAudio(now) {
  if (!ac) return;
  const t = ac.currentTime;
  const s1a = 1 - seamT;
  const s2a = seamT * (1 - seamT2);
  const s3a = seamT2 * (1 - seamT3);
  const s4a = seamT3;

  if (s1ForestG) {
    const fa = window01(0.06, 0.14, 0.30, 0.44, p1);
    const fd = window01(0.66, 0.72, 0.82, 0.92, p1);
    s1ForestG.gain.setTargetAtTime(Math.max(fa, fd) * 0.52 * s1a, t, 1.2);
  }
  if (s1WindG) {
    s1WindG.gain.setTargetAtTime(window01(0.44, 0.55, 0.64, 0.78, p1) * 0.38 * s1a, t, 1.2);
  }
  if (s2WindG) {
    const wind = (fadeOut(0.25, 0.55, p2) * fadeIn(0.04, 0.12, p2)
                + window01(0.78, 0.84, 0.90, 0.96, p2) * 0.5) * 0.30 * s2a;
    s2WindG.gain.setTargetAtTime(wind, t, 1.2);
  }
  if (s2WaterG) {
    const waterBase = fadeIn(0.18, 0.40, p2) * fadeOut(0.82, 0.94, p2) * 0.32;
    const channelBoost = window01(0.42, 0.48, 0.56, 0.62, p2) * 0.18;
    s2WaterG.gain.setTargetAtTime((waterBase + channelBoost) * s2a, t, 0.8);
  }
  if (s2InsectG) {
    const insect = window01(0.28, 0.42, 0.68, 0.80, p2) * 0.08;
    const mod = 0.7 + Math.sin(now * 0.0006) * 0.3;
    s2InsectG.gain.setTargetAtTime(insect * mod * s2a, t, 1.5);
  }
  if (s2BirdG) {
    const birdPresence = window01(0.10, 0.20, 0.75, 0.88, p2) * 0.45 * s2a;
    s2BirdG.gain.setTargetAtTime(birdPresence, t, 0.8);
    if (now > nextBirdTime && birdPresence > 0.04) {
      triggerBirdCall();
      nextBirdTime = now + 5000 + Math.random() * 16000;
    }
  }
  if (s2DripG) {
    const dripPresence = window01(0.35, 0.45, 0.65, 0.75, p2) * 0.50 * s2a;
    s2DripG.gain.setTargetAtTime(dripPresence, t, 0.6);
    if (now > nextDripTime && dripPresence > 0.05) {
      triggerDrip();
      nextDripTime = now + 1500 + Math.random() * 6000;
    }
  }

  // ── Scene 3 audio ──
  if (s3ForestG) {
    const fa3 = window01(0.08, 0.18, 0.65, 0.82, p3);
    s3ForestG.gain.setTargetAtTime(fa3 * 0.58 * s3a, t, 1.4);
  }
  if (s3WaterG) {
    const w3Base = fadeIn(0.14, 0.35, p3) * fadeOut(0.70, 0.88, p3) * 0.38;
    s3WaterG.gain.setTargetAtTime(w3Base * s3a, t, 0.8);
  }
  if (s3DripG) {
    const drip3 = window01(0.18, 0.30, 0.60, 0.75, p3) * 0.55 * s3a;
    s3DripG.gain.setTargetAtTime(drip3, t, 0.6);
    if (now > nextS3DripTime && drip3 > 0.04) {
      triggerS3Drip();
      nextS3DripTime = now + 800 + Math.random() * 3500;
    }
  }
  if (s3ResonanceG) {
    // Clearing wind: air moving through the gap in canopy
    const res = window01(0.20, 0.28, 0.48, 0.58, p3) * 0.10 * s3a;
    s3ResonanceG.gain.setTargetAtTime(res, t, 0.5);
  }

  // ── Scene 4 audio ──
  if (s4WindG) {
    // Soft dampened wind: peaks during weather veil, gentler than S2/S3
    const w4 = window01(0.12, 0.25, 0.72, 0.88, p4) * 0.28 * s4a;
    s4WindG.gain.setTargetAtTime(w4, t, 1.5);
  }
  if (s4ForestG) {
    // Returning forest: absent early, builds in late section
    const f4 = fadeIn(0.55, 0.75, p4) * 0.42 * s4a;
    s4ForestG.gain.setTargetAtTime(f4, t, 1.8);
  }
  if (s4RainHissG) {
    // Rain-on-foliage hiss: weather veil zone, quieter than real rain
    const rh = window01(0.22, 0.35, 0.62, 0.78, p4) * 0.18 * s4a;
    s4RainHissG.gain.setTargetAtTime(rh, t, 1.0);
  }
  if (s4DripG) {
    const drip4 = window01(0.28, 0.40, 0.70, 0.85, p4) * 0.35 * s4a;
    s4DripG.gain.setTargetAtTime(drip4, t, 0.6);
    if (now > nextS4DripTime && drip4 > 0.03) {
      triggerS4Drip();
      nextS4DripTime = now + 2000 + Math.random() * 8000;
    }
  }
}


// =============================================================================
// INPUT
// =============================================================================

function advance(delta) {
  bootAudio();
  // Scene 2 + Scene 3 scroll resistance during close passages
  let resistance = 1.0;
  const s2Alpha = seamT * (1 - seamT2);
  if (s2Alpha > 0) {
    const passage = window01(0.35, 0.45, 0.60, 0.72, p2);
    resistance -= passage * 0.25 * s2Alpha;
  }
  if (seamT2 > 0) {
    // Clearing: slight slowing to register the stumps, lighter than enclosed passage
    const passage3 = window01(0.20, 0.28, 0.46, 0.56, p3);
    resistance -= passage3 * 0.15 * seamT2 * (1 - seamT3);
  }
  if (seamT3 > 0) {
    // Weather veil: slowing through the thickest weather, easing as forest returns
    const weatherDrag = window01(0.25, 0.38, 0.58, 0.72, p4);
    resistance -= weatherDrag * 0.20 * seamT3;
  }
  resistance = Math.max(resistance, 0.50);
  targetX = clamp(targetX + delta * resistance, 0, WORLD_TOTAL - W);
}

window.addEventListener('wheel', e => {
  e.preventDefault();
  const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
  advance(d * 1.65);
}, { passive: false });

window.addEventListener('keydown', e => {
  const step = 65;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') advance(step);
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   advance(-step);
});

let tPrev = null;
window.addEventListener('touchstart', e => { tPrev = e.touches[0].clientX; bootAudio(); }, { passive: true });
window.addEventListener('touchmove', e => {
  e.preventDefault();
  if (tPrev !== null) { advance((tPrev - e.touches[0].clientX) * 2.4); tPrev = e.touches[0].clientX; }
}, { passive: false });
window.addEventListener('touchend', () => { tPrev = null; });


// =============================================================================
// MAIN RENDER LOOP
// =============================================================================

function render(now) {
  // Compute seam from previous frame for easing interpolation
  const prevSeamT = smooth(clamp((scrollX - SEAM_START) / (SEAM_END - SEAM_START), 0, 1));
  const prevSeamT2 = smooth(clamp((scrollX - SEAM2_START) / (SEAM2_END - SEAM2_START), 0, 1));
  const prevSeamT3 = smooth(clamp((scrollX - SEAM3_START) / (SEAM3_END - SEAM3_START), 0, 1));
  const maxPrevSeam = Math.max(prevSeamT, prevSeamT2, prevSeamT3);
  scrollX = lerp(scrollX, targetX, lerp(0.085, 0.065, maxPrevSeam));

  // Frame state
  p1 = clamp(scrollX / (S1_WORLD - W), 0, 1);
  s2sx = scrollX - S2_OFFSET;
  p2 = clamp(s2sx / (S2_WORLD - W), 0, 1);
  s3sx = scrollX - S3_OFFSET;
  p3 = clamp(s3sx / (S3_WORLD - W), 0, 1);
  s4sx = scrollX - S4_OFFSET;
  p4 = clamp(s4sx / (S4_WORLD - W), 0, 1);
  seamT = smooth(clamp((scrollX - SEAM_START) / (SEAM_END - SEAM_START), 0, 1));
  seamT2 = smooth(clamp((scrollX - SEAM2_START) / (SEAM2_END - SEAM2_START), 0, 1));
  seamT3 = smooth(clamp((scrollX - SEAM3_START) / (SEAM3_END - SEAM3_START), 0, 1));
  s4pw = s4PerceptualWeather(now);

  const s1Active = seamT < 1;
  const s2Active = seamT > 0 && seamT2 < 1;
  const s3Active = seamT2 > 0 && seamT3 < 1;
  const s4Active = seamT3 > 0;
  const s2EffAlpha = seamT * (1 - seamT2);

  // ── Sky (blended) ──
  drawBlendedSky();

  // ── Scene 1 background ──
  if (s1Active) {
    sceneAlpha = 1 - seamT;
    ctx.globalAlpha = sceneAlpha;
    s1DrawHills();
    s1DrawShelter();
    ctx.globalAlpha = 1;
  }

  // ── Scene 2 background ──
  if (s2Active) {
    sceneAlpha = s2EffAlpha;
    ctx.globalAlpha = sceneAlpha;
    s2DrawDistantTreeline(now);
    ctx.globalAlpha = 1;
  }

  // ── Scene 3 background ──
  if (s3Active) {
    sceneAlpha = seamT2 * (1 - seamT3);
    ctx.globalAlpha = sceneAlpha;
    s3DrawDistantTreeline(now);
    ctx.globalAlpha = 1;
  }

  // ── Scene 4 background ──
  if (s4Active) {
    sceneAlpha = seamT3;
    ctx.globalAlpha = sceneAlpha;
    s4DrawDistantTreeline(now);
    ctx.globalAlpha = 1;
  }

  // ── Scene 2 atmosphere (behind vegetation) ──
  if (s2Active) {
    sceneAlpha = s2EffAlpha;
    s2DrawAtmosphere();
    s2DrawSkyCorridors(now);
  }

  // ── Scene 3 atmosphere (behind vegetation) ──
  if (s3Active) {
    sceneAlpha = seamT2 * (1 - seamT3);
    s3DrawAtmosphere();
    s3DrawSkyCorridors(now);
  }

  // ── Scene 4 atmosphere (behind vegetation) ──
  if (s4Active) {
    sceneAlpha = seamT3;
    s4DrawAtmosphere();
    s4DrawSkyCorridors(now);
  }

  // ── Far trees/vegetation (layers 0-2) ──
  if (s1Active) {
    sceneAlpha = 1 - seamT;
    ctx.globalAlpha = sceneAlpha;
    S1_TREES.forEach(t => { if (t.layer <= 2) s1DrawOneTree(t); });
    ctx.globalAlpha = 1;
  }
  if (s2Active) {
    sceneAlpha = s2EffAlpha;
    ctx.globalAlpha = sceneAlpha;
    S2_VEG.forEach(v => { if (v.layer <= 2) s2DrawOneVeg(v, now); });
    ctx.globalAlpha = 1;
  }
  if (s3Active) {
    sceneAlpha = seamT2 * (1 - seamT3);
    ctx.globalAlpha = sceneAlpha;
    S3_VEG.forEach(v => { if (v.layer <= 2) s3DrawOneVeg(v, now); });
    ctx.globalAlpha = 1;
  }
  if (s4Active) {
    sceneAlpha = seamT3;
    ctx.globalAlpha = sceneAlpha;
    S4_VEG.forEach(v => { if (v.layer <= 2) s4DrawOneVeg(v, now); });
    ctx.globalAlpha = 1;
  }

  // ── Ground (blended) ──
  sceneAlpha = 1;
  drawBlendedGround();

  // ── Scene 1 ground features ──
  if (s1Active) {
    sceneAlpha = 1 - seamT;
    s1DrawOrchardBoundary();
    sceneAlpha = 1;
  }

  // ── Scene 2 water + trunk ──
  if (s2Active) {
    sceneAlpha = s2EffAlpha;
    s2DrawWater(now);
    s2DrawFallenTrunk(now);
    sceneAlpha = 1;
  }

  // ── Scene 3 water + infrastructure ──
  if (s3Active) {
    sceneAlpha = seamT2 * (1 - seamT3);
    s3DrawWater(now);
    s3DrawStumpClearing(now);
    sceneAlpha = 1;
  }

  // ── Scene 4 water ──
  if (s4Active) {
    sceneAlpha = seamT3;
    s4DrawWater(now);
    sceneAlpha = 1;
  }

  // ── Near trees/vegetation (layer 3) ──
  if (s1Active) {
    sceneAlpha = 1 - seamT;
    ctx.globalAlpha = sceneAlpha;
    S1_TREES.forEach(t => { if (t.layer >= 3) s1DrawOneTree(t); });
    ctx.globalAlpha = 1;
  }
  if (s2Active) {
    sceneAlpha = s2EffAlpha;
    ctx.globalAlpha = sceneAlpha;
    S2_VEG.forEach(v => { if (v.layer === 3) s2DrawOneVeg(v, now); });
    ctx.globalAlpha = 1;
  }
  if (s3Active) {
    sceneAlpha = seamT2 * (1 - seamT3);
    ctx.globalAlpha = sceneAlpha;
    S3_VEG.forEach(v => { if (v.layer === 3) s3DrawOneVeg(v, now); });
    ctx.globalAlpha = 1;
  }
  if (s4Active) {
    sceneAlpha = seamT3;
    ctx.globalAlpha = sceneAlpha;
    S4_VEG.forEach(v => { if (v.layer === 3) s4DrawOneVeg(v, now); });
    ctx.globalAlpha = 1;
  }

  // ── Scene 2 fog ──
  if (s2Active) {
    sceneAlpha = s2EffAlpha;
    s2DrawFog(now);
  }

  // ── Scene 3 fog ──
  if (s3Active) {
    sceneAlpha = seamT2 * (1 - seamT3);
    s3DrawFog(now);
  }

  // ── Scene 4 fog + weather veil ──
  if (s4Active) {
    sceneAlpha = seamT3;
    s4DrawFog(now);
    s4DrawWeatherVeil(now);
  }

  // ── Atmospheric overlays ──
  if (s1Active) {
    sceneAlpha = 1 - seamT;
    s1DrawRidgeHaze();
    s1DrawCanopy();
  }
  if (s2Active) {
    sceneAlpha = s2EffAlpha;
    s2DrawOverheadVegetation(now);
    s2DrawSideEnclosure();
  }
  if (s3Active) {
    sceneAlpha = seamT2 * (1 - seamT3);
    s3DrawOverheadVegetation(now);
    s3DrawSideEnclosure();
  }
  if (s4Active) {
    sceneAlpha = seamT3;
    s4DrawOverheadVegetation(now);
    s4DrawSideEnclosure();
  }

  // ── Scene 2 foreground interrupters (layer 4+) ──
  if (s2Active) {
    sceneAlpha = s2EffAlpha;
    ctx.globalAlpha = sceneAlpha;
    S2_VEG.forEach(v => { if (v.layer >= 4) s2DrawOneVeg(v, now); });
    ctx.globalAlpha = 1;
  }

  // ── Scene 3 foreground interrupters (layer 4+) ──
  if (s3Active) {
    sceneAlpha = seamT2 * (1 - seamT3);
    ctx.globalAlpha = sceneAlpha;
    S3_VEG.forEach(v => { if (v.layer >= 4) s3DrawOneVeg(v, now); });
    ctx.globalAlpha = 1;
  }

  // ── Scene 4 foreground interrupters (layer 4+) ──
  if (s4Active) {
    sceneAlpha = seamT3;
    ctx.globalAlpha = sceneAlpha;
    S4_VEG.forEach(v => { if (v.layer >= 4) s4DrawOneVeg(v, now); });
    ctx.globalAlpha = 1;
  }

  // ── Vignette (blended) ──
  sceneAlpha = 1;
  drawBlendedVignette();

  // ── Dark (opening + closing only) ──
  drawDark();

  // ── Fragment ──
  checkFrags();
  tickFrag(now);

  // ── Audio ──
  tickAudio(now);

  ctx.globalAlpha = 1;
  sceneAlpha = 1;
  requestAnimationFrame(render);
}

requestAnimationFrame(render);
</script>
</body>
